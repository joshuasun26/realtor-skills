contact file using the field every other\n   sphere skill checks: `optout`. Set `optout: all` for a full revocation, or\n   `optout: text` / `optout: email` / `optout: call` for a channel-specific one (the\n   named channel only — other channels stay open). Also record the date and the\n   verbatim message that revoked. The verbatim quote is the audit record. This exact\n   field name and these exact values are what `birthday-watch`, `home-anniversary`,\n   `followup-queue`, and `sphere-message` filter on — a different field name (e.g.\n   `dnc`) is invisible to them and the revocation will not actually stop outreach.\n2. **Kill every pending touch** for that contact in every sequence, queue, and\n   scheduled batch — check followup-queue, sphere-daily drafts, and any open-house\n   follow-up sequence. A revocation that stops one list and not the others is a\n   violation with extra steps.\n3. **One confirmation message maximum, only if the channel allows it, with ZERO\n   marketing content:** \"You're removed — you won't hear from me again. Sorry to have\n   bothered you.\" Nothing else. No \"if you change your mind.\" If the revocation was\n   hostile, send nothing.\n4. **Log it** in `revocations.md` next to the contact data: date received, date\n   honored, method they used. The honor deadline is **10 business days** — but honor\n   it the same day; the deadline is a ceiling, not a target.\n5. **Report it to the agent** in the batch summary: who, verbatim what, what was\n   cancelled. Never silently swallow a revocation — the agent needs to know the\n   relationship's real state.\n\n## The standing checks\n\n- Before ANY outbound batch drafts: scan inbound replies since the last run for\n  revocations FIRST. A batch drafted before the scan is a batch drafted against a\n  stale list — re-draft after tagging.\n- On \"can I still text this person\": check the tag, the log, and the last 90 days of\n  their inbound messages before answering. If there's no consent record at all, the\n  answer is about consent tier, not just revocation — route to the consent rules in\n  open-house-signin and contact-import.\n- Monthly (or when asked to \"clean my list\"): sweep for contacts with revocation-ish\n  language in their history that never got tagged, and reconcile the log against the\n  CRM tags.\n\n## What this skill never does\n\n- Never auto-sends anything, including the confirmation — it drafts; the agent\n  approves (the agent owns every send).\n- Never deletes the contact record. Revoked contacts stay in the database tagged `optout` —\n  deleting them destroys the do-not-contact memory and the audit trail.\n- Never argues, wins-back, or \"one last value message.\" Revoked is revoked.\n\n---\n\n<!-- self-improvement-loop v1 -->\n\n## Self-improvement loop\n\nBefore ending a run of this skill, review the run:\n\n1. Did any step fail, stall, or need a workaround you had to invent?\n2. Did the user correct, reject, or rewrite something meaningful in the output?\n3. Did you discover something a future run would want to know (a path that moved, a\n   tool that replaced another, a preference stated out loud)?\n\nIf yes to any, propose a specific edit to this SKILL.md in one or two lines and ask\nwhether to apply it. Propose only changes that would alter a future run's behavior --\nskip cosmetic rewording, and never propose more than two edits at once.\n\nDo not edit this file without the user's go-ahead. If they say no, drop it and do not\nre-raise the same suggestion in a later run of the same session.\n", "path": "revocation-watch/SKILL.md", "orchestrator": false, "calls": ["birthday-watch", "followup-queue", "home-anniversary", "sphere-message"], "calledBy": ["followup-queue", "sphere-daily"]}, {"id": "social-caption", "folder": "social-caption", "dept": "content", "deptLabel": "Content", "hue": 48, "description": "Write the caption for one social post — Instagram, Facebook, or LinkedIn — in the agent's voice, with the right hook, the right length for the platform, a real call to action, and the tag and credit block that actually drives the reach. Trigger on \"write the caption\", \"caption for this post\", \"what do I write with this\", \"social copy\", or as a step inside any package orchestrator. Do NOT trigger for MLS remarks — that is listing-description.", "body": "# Social Caption — the part that decides whether the graphic gets seen\n\nReads the asset it is captioning, `profile/AGENT.md`, `profile/VOICE.md`, and whatever\nsource file the asset came from (`LISTING.md`, the market data file, `BUYDOWN.md`).\n\n---\n\n## The rule that governs everything here\n\n**The caption ADDS. It does not repeat the slides.**\n\nIf the carousel already says the median price, the caption should not say the median\nprice. The reader has both in front of them, and a caption that recaps the graphic is\nwasted space. Say the thing that did not fit on the slides — the reason it matters, the\nstory behind it, the honest caveat, the question.\n\n## Structure\n\n**Line 1 is the hook, and it is most of the job.** Feeds truncate after roughly the first\n125 characters, so the first line has to earn the tap. What works:\n\n- A specific number with the tension attached\n- A statement the reader half-disagrees with\n- A concrete detail: \"The back yard has a 40-year-old avocado tree.\"\n\nWhat does not work: \"Check out this beautiful home!\", \"New listing alert\", \"Happy Monday\neveryone\", or any sentence that could sit under any post.\n\n**Then a blank line.** The caption preview cuts at the first line break, so line 1 alone\nhas to stand up.\n\n**Body: two to five short paragraphs**, one idea each, blank line between them. Not a\nwall. People read captions on a phone in a hallway.\n\n**Then one call to action.** One. \"Comment X for the flyer\" or \"send me a message\" or\n\"save this for when you're ready\" — but not three of them. Multiple CTAs produce zero\nactions.\n\n**Then the credit and tag block.** On a listing or open house post this is not a\ncourtesy — **it is the distribution.** Tagging and crediting the listing agent, the\nco-lister, the host, and the brokerage borrows their audiences. A post with nobody tagged\nreaches only the agent's own followers, which for most agents is a fraction of the people\nthey actually want.\n\n**Then hashtags**, last, after the tag block.\n\n## Platform\n\n| | Length | Hashtags | Notes |\n|---|---|---|---|\n| **Instagram** | 125 chars before the cut; 300–800 total works | 5–15, mixed local and topical, at the end | Links are not clickable — never say \"link below\" |\n| **Facebook** | Shorter. 1–3 sentences outperforms. | 0–3 | Links work and get clicked |\n| **LinkedIn** | 1–3 paragraphs, professional register | 3–5 | Links suppress reach; consider first comment |\n\nAsk the platform. Do not write one caption and hope.\n\n## Worked example (Instagram, listing post)\n\n```\nThe back yard has a 40-year-old avocado tree the sellers have never let anyone touch.\n\nThree bed, two bath, 1,850 sqft in [City]. The kitchen was redone in 2022, but the tree\nis the reason people stop scrolling when this one comes up.\n\nNew listing, open house this weekend — details in the caption below.\n\nComment TREE and I'll send you the flyer.\n\nListed by [Agent Name], [Brokerage] — DRE #[license]. Co-hosted with [Co-lister],\n[Brokerage]. Equal Housing Opportunity.\n\n#[city]realestate #[city]homes #justlisted #openhouse #[neighborhood]\n```\n\nNotice what it does NOT do: it does not repeat the price or the spec row that is already\non the carousel slides, it has exactly one CTA, and the hook is a concrete detail, not an\nadjective.\n\n## Compliance — every caption, no exceptions\n\nA caption is public advertising. `compliance-check` runs on it before it ships.\n\n- License number and brokerage where the agent's state requires it on advertising\n- Equal Housing Opportunity where required\n- **Nothing about the neighborhood's character, its residents, its schools, or whether an\n  area is \"safe\", \"quiet\", \"family-friendly\", or \"desirable\"**\n- No valuation claim, no prediction, no guarantee\n- Any number routes through `source-check` — MLS-sourced with an as-of date\n- Any payment or rate figure carries the full disclaimer from `buydown-math`, and the\n  disclaimer does not get trimmed to fit the caption. If it does not fit, it goes on the\n  final slide and the caption points to it.\n- If it is another agent's listing, credit them and their brokerage\n\n## Voice\n\nRun `agent-voice`. Scan the finished draft against the banned words list before\ndelivering — do not just try to avoid them while writing.\n\nNo manufactured urgency the agent has not earned. No claim about their experience or\nresults that is not in `profile/AGENT.md`.\n\n## Output\n\nDeliver the caption as **plain text, ready to paste, with nothing around it** — no\npreamble, no \"here's your caption\", no metadata, no notes interleaved. Blank line between\nparagraphs so it pastes into the app looking the way it will read.\n\nIf there are notes, put them after the caption block, clearly separated.\n\n## Chains from / into\n\nCalled by `listing-package`, `open-house-package`, `market-update-package`,\n`listing-carousel`, `market-carousel`. Uses `agent-voice`, `compliance-check`,\n`source-check`.\n\n---\n\n<!-- self-improvement-loop v1 -->\n\n## Self-improvement loop\n\nBefore ending a run of this skill, review the run:\n\n1. Did any step fail, stall, or need a workaround you had to invent?\n2. Did the user correct, reject, or rewrite something meaningful in the output?\n3. Did you discover something a future run would want to know (a path that moved, a\n   tool that replaced another, a preference they stated out loud)?\n\nIf yes to any, propose a specific edit to this SKILL.md in one or two lines and ask\nwhether to apply it. Propose only changes that would alter a future run's behavior --\nskip cosmetic rewording, and never propose more than two edits at once.\n\nDo not edit this file without their go-ahead. If they say no, drop it and do not re-raise\nthe same suggestion in a later run of the same session.\n", "path": "social-caption/SKILL.md", "orchestrator": false, "calls": ["agent-voice", "buydown-math", "compliance-check", "listing-carousel", "listing-package", "market-carousel", "market-update-package", "open-house-package", "source-check"], "calledBy": ["agent-profile", "agent-voice", "buydown-math", "compliance-check", "content-week", "listing-carousel", "listing-description", "listing-intake", "market-brief", "market-carousel", "source-check"]}, {"id": "source-check", "folder": "source-check", "dept": "foundation", "deptLabel": "Foundation", "hue": 220, "description": "Verify every number, date, statistic, price, rate, and credential in a piece of real estate marketing before it goes to another human — and enforce the rule that market statistics come from the MLS, never from a consumer aggregator. Trigger on \"check these numbers\", \"is this accurate\", \"verify this\", \"sourcing\", \"before I send this\", \"fact check\", or automatically whenever any skill in this library is about to hand over content that asserts a fact. Also use to audit something already published.", "body": "# Source Check — nothing ships with a number you cannot point at\n\nOne wrong number in a flyer, a market brief, or a caption costs an agent more credibility\nthan ten good pieces earn. This skill is the gate.\n\nRun it before **anything** with a number in it leaves the machine.\n\n---\n\n## The MLS rule (hard, not negotiable)\n\n**Every market statistic must come from the MLS.** Median price, days on market, months\nof inventory, sale-to-list ratio, absorption rate, sold comps, active counts — MLS only.\n\n**Never source a market statistic from a consumer aggregator.** Zillow, Redfin,\nRealtor.com, Homes.com and similar sites publish numbers on a different basis than the\nMLS does. The most common and most damaging example: an aggregator's \"days on market\"\nusually reflects how long a listing has been **active on that site**, not how long a\n**sold** property took to go under contract. Publishing that as \"average days on market\"\nis simply a false claim, and it is the number agents get corrected on in public.\n\nAggregators are acceptable for exactly two things:\n1. A public listing page's basic property facts (address, beds, baths, sqft, list price)\n   when there is no MLS access in the session — and even then, label the source.\n2. Confirming a property exists and is publicly marketed.\n\nThey are never acceptable for a statistic about a market.\n\nIf the agent has no MLS access this session and a market number is required, the correct\noutput is: **\"this number cannot be sourced right now\"** plus what you tried. Not an\nestimate. Not a hedge.\n\n## The rungs — work them before you say you cannot verify\n\n\"I can't check that\" is a trigger, not an answer. In order:\n\n1. The MLS the agent's profile names, using their login\n2. A different search scope, date range, or report inside the same MLS\n3. Local files: prior exports, saved CSVs, previous `market-pull` output in this repo\n4. The primary source's own site (the lender's dated rate sheet, the county recorder,\n   the city, the HOA, the tax assessor)\n5. Only then: report that it could not be determined, and name which rungs you tried\n\n## The check itself\n\nFor each factual claim in the draft, build a row:\n\n| Claim | Source opened this session | As-of date | Verdict |\n|---|---|---|---|\n\n**Verdicts:** `VERIFIED` (you opened the source this session), `STALE` (sourced, but the\ndata is older than the claim implies), `UNSUBSTANTIATED` (no source found).\n\n**What does NOT count as a source:**\n- A previous session, a memory file, or a chat summary\n- An earlier message in this conversation\n- Your own recollection or general knowledge of the market\n- What the agent told you, unless the agent IS the primary source (their own listing\n  count, their own closing dates)\n\nThose are leads. Only a file you read, a table you queried, or a page you fetched is\nevidence.\n\n## Rate and payment numbers\n\nAny payment, rate, or buydown figure requires:\n- A **dated lender rate sheet** from the agent's lender partner, dated within 2 business\n  days of publication. Last week's sheet is not a source.\n- A **dated mortgage insurance quote** if MI is in the payment.\n- Every assumption written down: price, loan term, product, credit score, DTI,\n  occupancy, down payment, whether impounds are included.\n- The full disclaimer block (see `buydown-math`).\n\nIf any of those is missing, the piece with the payment in it is **blocked**. Ship the\npiece without the payment, or ship nothing. This is not a judgment call.\n\n## Rules for what happens next\n\n- **Cannot source it? Remove it.** Do not soften it into \"roughly\" or \"about\". A hedged\n  wrong number is still wrong. A defensible qualitative claim beats an unsourceable\n  precise one.\n- **Numbers shown side by side must share a basis.** Same report, same definition, same\n  date range, same geography. Flag mixed sources even when each figure is individually\n  correct.\n- **Attach the as-of date and the source name** to every statistic that ships. On a\n  graphic that means a footer line. In a brief it means a sources block.\n- **Stale is a form of unverified.** If you are reading an export, check the file date\n  and report the as-of date with the number.\n- If the agent decides to ship an `UNSUBSTANTIATED` number anyway, that is their call and\n  their license. Say the exposure once, plainly, then log it in the ledger as\n  `UNVERIFIED — shipped at the agent's direction` so the record is honest.\n\n## The ledger\n\nAppend every run to `records/source-ledger.md`: date, the piece, each claim, each source,\neach verdict. When something later turns out wrong, that file is how you find every other\nplace the number went.\n\nIf a bad number already shipped, say so immediately and check every live surface carrying\nit — posted graphics, printed flyers, scheduled emails, the listing remarks, the website.\n\n## Chains from\n\nCalled by `listing-description`, `buydown-math`, `listing-flyer`, `listing-carousel`,\n`market-brief`, `market-carousel`, `social-caption`, `listing-package`,\n`open-house-package`, `market-update-package`.\n\n---\n\n<!-- self-improvement-loop v1 -->\n\n## Self-improvement loop\n\nBefore ending a run of this skill, review the run:\n\n1. Did any step fail, stall, or need a workaround you had to invent?\n2. Did the user correct, reject, or rewrite something meaningful in the output?\n3. Did you discover something a future run would want to know (a path that moved, a\n   tool that replaced another, a preference they stated out loud)?\n\nIf yes to any, propose a specific edit to this SKILL.md in one or two lines and ask\nwhether to apply it. Propose only changes that would alter a future run's behavior --\nskip cosmetic rewording, and never propose more than two edits at once.\n\nDo not edit this file without their go-ahead. If they say no, drop it and do not re-raise\nthe same suggestion in a later run of the same session.\n", "path": "source-check/SKILL.md", "orchestrator": false, "calls": ["buydown-math", "listing-carousel", "listing-description", "listing-flyer", "listing-package", "market-brief", "market-carousel", "market-pull", "market-update-package", "open-house-package", "social-caption"], "calledBy": ["agent-voice", "buydown-math", "compliance-check", "content-week", "followup-queue", "followup-sequence", "home-anniversary", "listing-carousel", "listing-description", "listing-flyer", "listing-intake", "market-brief", "meeting-brief", "open-house-flyer", "social-caption", "sphere-message"]}, {"id": "sphere-audit", "folder": "sphere-audit", "dept": "sphere", "deptLabel": "Sphere", "hue": 340, "description": "Score and segment the agent's contact database — who is a real relationship, who has gone cold, who is missing the data that would make them reachable, and where the next transaction most likely lives. Produces a ranked list and a fix list. Trigger on \"audit my database\", \"who should I be talking to\", \"score my sphere\", \"who have I not talked to\", \"clean up my contacts\", \"where's my next deal coming from\". Do NOT trigger to import contacts — that is contact-import.", "body": "# Sphere Audit — find the deals already in the database\n\nMost agents' next transaction is already in their phone. This skill finds it, and finds\nthe reason it has not happened yet.\n\nReads `data/contacts.csv`. If it does not exist, run `contact-import` first.\n\n---\n\n## Segment\n\nSort every contact into one tier. Do not let anything land in more than one.\n\n| Tier | Who | Cadence |\n|---|---|---|\n| **A** | Past clients, plus anyone who has referred business | 8–12 touches a year |\n| **B** | Real relationships with no transaction yet — friends, neighbors, repeat conversations | 4–6 a year |\n| **C** | Consented leads and open house visitors, no relationship yet | Sequence-driven |\n| **D** | No consent, no relationship, or origin unclear | Nothing automated. Ever. |\n\nTier D exists so it can be excluded, not worked. It never enters a bulk send from any\nskill in this library.\n\n## Score each contact\n\nScore on what is actually predictive, and show your reasoning per contact so the agent can\ndisagree:\n\n- **Recency** — days since `last_touch`. Past 12 months on an A-tier contact is a problem\n  and should be named as one.\n- **Depth** — has there been a transaction, a referral, or a real conversation\n- **Reachability** — do we have a phone, an email, a birthday, a close date\n- **Life-stage signal** — anything recorded in notes that suggests a move: a growing\n  family, a job change, a rental they own, an aging parent, a home they have outgrown.\n  Only what is actually written down. **Never infer a life stage from a name, an address,\n  or a demographic guess** — that is both wrong and a fair housing problem.\n- **Anniversary proximity** — past clients at 5, 7, and 10 years from close are the\n  highest-probability sellers in most databases\n\n## Report\n\nLead with three lists, short enough to act on today:\n\n**1. The ten most valuable neglected relationships.** A-tier, no touch in 6+ months, with\nthe last known context on each. This list is the whole point of the skill. If the agent\ndoes nothing else, they call these ten.\n\n**2. The data gaps that cost the most.** Usually birthdays, close dates, and missing\nmobile numbers, with a count on each and one practical way to fill them in.\n\n**3. The anniversary and milestone queue for the next 90 days.** Names and dates.\n\nThen the summary numbers: total contacts, tier counts, how many have no touch recorded in\na year, how many are excluded from sends for consent reasons.\n\n## What NOT to do\n\n- **Do not rank contacts by estimated wealth, home value, neighborhood, or anything\n  derived from where they live.** It is a fair housing exposure and it is a bad predictor.\n  Rank on relationship depth and recency, which are both better and safe.\n- Do not propose a mass reactivation blast to everyone who has gone cold. Cold contacts\n  come back through individual messages, and a blast to 400 people who have not heard from\n  the agent in three years produces unsubscribes and spam complaints, not appointments.\n- Do not delete anything. Flag it, tag it, and let the agent decide.\n- Do not write a number about the agent's business into the report that you did not\n  compute from the file in front of you.\n\n## Cadence\n\nRun quarterly, not weekly. The database does not change fast enough to justify more, and a\nmonthly audit becomes noise the agent stops reading.\n\n## Chains into\n\n`sphere-daily`, `sphere-message`, `followup-queue`, `birthday-watch`, `home-anniversary`.\n\n---\n\n<!-- self-improvement-loop v1 -->\n\n## Self-improvement loop\n\nBefore ending a run of this skill, review the run:\n\n1. Did any step fail, stall, or need a workaround you had to invent?\n2. Did the user correct, reject, or rewrite something meaningful in the output?\n3. Did you discover something a future run would want to know (a path that moved, a\n   tool that replaced another, a preference they stated out loud)?\n\nIf yes to any, propose a specific edit to this SKILL.md in one or two lines and ask\nwhether to apply it. Propose only changes that would alter a future run's behavior --\nskip cosmetic rewording, and never propose more than two edits at once.\n\nDo not edit this file without their go-ahead. If they say no, drop it and do not re-raise\nthe same suggestion in a later run of the same session.\n", "path": "sphere-audit/SKILL.md", "orchestrator": false, "calls": ["birthday-watch", "contact-import", "followup-queue", "home-anniversary", "sphere-daily", "sphere-message"], "calledBy": ["contact-import"]}, {"id": "sphere-daily", "folder": "sphere-daily", "dept": "sphere", "deptLabel": "Sphere", "hue": 340, "description": "Orchestrator. The single morning run that produces one approval list for the day — birthdays, home anniversaries, follow-ups that are due, and the one relationship worth a phone call — all drafted and held for the agent's go. Trigger on \"run my morning\", \"who do I contact today\", \"daily nurture\", \"run the sphere\", \"my daily list\", \"good morning\". Use the individual skills when the agent wants just birthdays or just follow-ups.", "body": "# Sphere Daily — one list, once a day, everything drafted\n\nThis is the routine that makes the whole system feel like it works. Five minutes of the\nagent's morning, one list, everything already written.\n\nIts enemy is volume. A daily list of forty items gets ignored by day three. **Cap it.**\n\n---\n\n## The chain\n\nStep 0, before the chain runs: `revocation-watch` scans inbound replies and tags any\nopt-outs. Its NO overrides everything below — a revoked contact appears in no list\nthis skill produces.\n\n```\nsphere-daily\n├─ 1. birthday-watch      → today's birthdays, drafted\n├─ 2. home-anniversary    → today's closing anniversaries, drafted\n├─ 3. followup-queue      → leads and clients whose next touch is due\n├─ 4. sphere-message × N  → the individual drafting for each item above\n└─ 5. one approval list   → held, never auto-sent\n```\n\nSteps 1 to 3 gather. Step 4 drafts. Step 5 is where the agent spends their five minutes.\n\n## The cap — this is the design rule\n\n**No more than 10 items on the list, and no more than 3 flagged as calls.**\n\nIf the queue produces more, rank and hold the rest. Ranking order:\n\n1. Anything time-bound today — a birthday is today or it is nothing\n2. Tier A relationships with a real reason to reach out\n3. Year 5, 7, and 10 home anniversaries\n4. Active clients and consented leads whose next touch is due\n5. Everything else\n\n**Tie within a tier:** when two items land in the same rank tier (e.g. two Year 7\nanniversaries, or two Tier A birthdays), break the tie by longest time since\n`last_touch` in `data/contacts.csv` (longest-idle contact goes first). If `last_touch`\nis also blank or tied, break it alphabetically by last name, then first name. Apply\nthe same tiebreak when deciding which 3 items get the call flag.\n\nTell the agent when items were held back and how many. \"6 today, 14 held\" is honest and\nkeeps them trusting the cap.\n\n## The list format\n\nOne file, `daily/<YYYY-MM-DD>.md`, not a wall of chat text. For each item:\n\n```\n### N. [Name] — [why, in five words]\nChannel: text | email | call\nContext: [the one line from the database that explains this]\n\n[the full drafted message]\n```\n\nThen at the top of the file, before the items:\n\n- **The one call.** Name a single person and one line on why today. Agents do not make\n  the calls unless someone tells them which call. This line is the most valuable output\n  of the entire skill.\n- The counts: items today, items held, contacts excluded for consent or opt-out.\n\n## The approval gate\n\n**Nothing sends. Ever, automatically.**\n\nThe agent replies with the numbers they approve, or edits the file directly and says go.\n\n- Approval is per batch, per session. Today's yes is not tomorrow's yes.\n- Silence, \"looks good\", or ambiguity is not approval. Ask once, in one line, and wait.\n- If they approve 6 and you later added a 7th, the 7th is unapproved.\n- After sending, report exactly what went and what did not, by count and by name. Never\n  report a send as complete when a call failed.\n\n## After the send\n\n- Update `last_touch` in `data/contacts.csv` for everyone contacted\n- Append every message to `records/sent-log.md` with date, channel, and copy\n- Note anything the agent rewrote — that rewrite goes into `profile/VOICE.md` under\n  Corrections, and it is the most valuable thing this run produced\n\n## Keeping it honest over time\n\nOnce a month, report the actual numbers: how many days the list was run, how many messages\napproved, how many sent, how many produced a reply. If the reply rate is low, say so and\npropose one change, not five. If the agent has not run it in two weeks, say that too\nrather than quietly continuing to generate lists nobody reads.\n\nA routine that runs and is never read is worse than no routine, because it looks like a\nsystem while producing nothing.\n\n---\n\n<!-- self-improvement-loop v1 -->\n\n## Self-improvement loop\n\nBefore ending a run of this skill, review the run:\n\n1. Did any step fail, stall, or need a workaround you had to invent?\n2. Did the user correct, reject, or rewrite something meaningful in the output?\n3. Did you discover something a future run would want to know (a path that moved, a\n   tool that replaced another, a preference they stated out loud)?\n\nIf yes to any, propose a specific edit to this SKILL.md in one or two lines and ask\nwhether to apply it. Propose only changes that would alter a future run's behavior --\nskip cosmetic rewording, and never propose more than two edits at once.\n\nDo not edit this file without their go-ahead. If they say no, drop it and do not re-raise\nthe same suggestion in a later run of the same session.\n", "path": "sphere-daily/SKILL.md", "orchestrator": false, "calls": ["revocation-watch"], "calledBy": ["birthday-watch", "contact-import", "followup-queue", "followup-sequence", "home-anniversary", "open-house-followup", "sphere-audit", "sphere-message"]}, {"id": "sphere-message", "folder": "sphere-message", "dept": "sphere", "deptLabel": "Sphere", "hue": 340, "description": "Draft one personal message to one specific contact, in the agent's voice, using everything the database already knows about that relationship. The atomic unit that every other sphere and follow-up skill calls. Trigger on \"write to [name]\", \"what do I say to [name]\", \"draft a message for [name]\", \"reach out to [name]\", or as a sub-step of any sphere or follow-up skill. Do NOT trigger for a batch — that is sphere-daily or followup-queue.", "body": "# Sphere Message — one person, one message\n\nThe smallest useful skill in this library, and the one called most often. Every batch skill\nhere is really this skill run N times with different context.\n\nReads `data/contacts.csv`, `profile/VOICE.md`, `profile/AGENT.md`, and\n`records/sent-log.md`.\n\n---\n\n## Before drafting\n\n1. **Pull everything the file knows about this person.** Relationship, source, close date,\n   property, birthday, tags, notes, last touch.\n2. **Read the last two or three things the agent sent them**, from `records/sent-log.md`.\n   Repeating a message from six weeks ago is the fastest way to look automated.\n3. **Check consent tier and opt-out.** If tagged `optout: all`, say so and stop — no\n   message, no exception, on any channel. If tagged `optout: text`, `optout: email`, or\n   `optout: call`, stop only if the channel this draft would use matches the tagged one;\n   otherwise proceed on the remaining channel and note the restriction. If tier D /\n   `unknown` consent, say that an automated or templated message is not appropriate and\n   that this should be the agent writing personally, then let them decide.\n4. **Ask the agent for the occasion** if it is not obvious. \"Just checking in\" is not an\n   occasion, and a message with no reason to exist is the one that does not get answered.\n\n## The message\n\n**One specific thing.** Every good message to a person you know contains something that\ncould only be said to them. Their kitchen renovation, the dog, the job they were nervous\nabout, the street they live on, the fact that they close five years ago this month.\n\nIf the file holds nothing specific, say so to the agent and ask for one detail. That\n30-second question produces a message that works instead of one that does not.\n\n**Structure that works for a text:**\n- The specific thing, first\n- The reason for reaching out, if there is one\n- One easy question, or nothing at all\n\n**Length:** shorter than feels right. Two or three sentences for a text. Six or seven\nlines for an email. The most common failure in agent outreach is length, not tone.\n\n**Voice:** run `agent-voice`. Match register to the relationship — a past client from\nseven years ago is not written to the same way as a friend. Scan for banned words before\ndelivering.\n\n## What to leave out\n\n- No pitch on a relationship touch. If the message has both warmth and an ask, the reader\n  only registers the ask.\n- No \"just checking in\", \"touching base\", \"circling back\", \"I hope this finds you well\",\n  \"reaching out because\" — these are the phrases that mark a message as mass-sent even\n  when it is not.\n- No market statistic unless it is MLS-sourced and dated via `source-check`.\n- No claim about the agent's business, results, or history that is not in\n  `profile/AGENT.md`.\n- No promise the agent has not made.\n\n## Channel\n\nAsk, or read it from the contact's history. Rough guide, and the agent overrides it:\n\n- **Text** — existing relationships, short, time-sensitive, warm\n- **Email** — anything with an attachment, anything long, anything a person may want to\n  keep\n- **Call** — high-value relationships, anniversaries at year 5/7/10, and anything the\n  agent has been putting off. Say so when a call is the right answer, even though a draft\n  is easier to produce.\n- **Handwritten** — the top handful. Say when it is worth it.\n\n## Approval\n\nShow the copy. Wait for the agent's go. One message, one approval — and approval on this\nmessage is not approval on the next one.\n\nAfter sending, log to `records/sent-log.md` and update `last_touch`.\n\n## Chains from / into\n\nCalled by `sphere-daily`, `birthday-watch`, `home-anniversary`, `followup-queue`,\n`open-house-followup`. Uses `agent-voice`, `source-check`.\n\n---\n\n<!-- self-improvement-loop v1 -->\n\n## Self-improvement loop\n\nBefore ending a run of this skill, review the run:\n\n1. Did any step fail, stall, or need a workaround you had to invent?\n2. Did the user correct, reject, or rewrite something meaningful in the output?\n3. Did you discover something a future run would want to know (a path that moved, a\n   tool that replaced another, a preference they stated out loud)?\n\nIf yes to any, propose a specific edit to this SKILL.md in one or two lines and ask\nwhether to apply it. Propose only changes that would alter a future run's behavior --\nskip cosmetic rewording, and never propose more than two edits at once.\n\nDo not edit this file without their go-ahead. If they say no, drop it and do not re-raise\nthe same suggestion in a later run of the same session.\n", "path": "sphere-message/SKILL.md", "orchestrator": false, "calls": ["agent-voice", "birthday-watch", "followup-queue", "home-anniversary", "open-house-followup", "source-check", "sphere-daily"], "calledBy": ["agent-profile", "agent-voice", "followup-queue", "lead-intake", "market-brief", "meeting-brief", "revocation-watch", "sphere-audit"]}, {"id": "usage-recap", "folder": "usage-recap", "dept": "foundation", "deptLabel": "Foundation", "hue": 220, "description": "Read the local skill-usage log and turn it into a plain-English \"your month with the library\" recap: total runs, most-used skills, least-used or never-used skills, and a friendly line the agent can read aloud on the monthly membership office-hour Zoom. Trigger on \"usage recap\", \"my month with the library\", \"what have I been using\", \"office hour recap\", \"usage summary\", or ahead of a scheduled monthly office hour. Works entirely offline, off the agent's own machine. Degrades gracefully — with a clear friendly message, not an error — if tracking has never been turned on or the log is empty.", "body": "# Usage Recap — the office-hour mirror\n\nUsage tracking in this library is off by default (see `hooks/README.md`). When an agent\nhas turned it on for themselves and their own written consent, the only thing recorded is\na skill name and a timestamp, appended locally to\n`~/.realtor-skills/skill-usage.jsonl`. Nothing leaves their machine.\n\nThis skill's only job is to read that one local file and turn it into something a human\nenjoys hearing — a short, honest recap of what got used, what did not, and what that\nmight mean. It is the concrete deliverable behind the Membership tier's monthly\n\"what shipped\" changelog and group office hour.\n\n---\n\n## The check\n\n1. Resolve the tally path: `~/.realtor-skills/skill-usage.jsonl` (or\n   `$CLAUDE_PLUGIN_DATA/.realtor-skills/skill-usage.jsonl` if that environment variable\n   is set — same resolution logic as `hooks/tally_skill_run.py`).\n2. **If the file does not exist**, stop and say so plainly and warmly — see \"No data yet\"\n   below. Do not treat this as an error. Tracking ships disabled by default, so this is\n   the expected state for most agents, most of the time.\n3. **If the file exists but is empty**, same function esc(t){ return t.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }
function inline(t){
  return esc(t)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[\s(])\*([^*\n]+)\*/g, "$1<em>$2</em>");
}
function md(src){
  const L = src.split("\n"); let o = "", i = 0;
  const row = l => l.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim());
  while (i < L.length){
    let l = L[i];
    if (/^```/.test(l)){
      i++; let b = [];
      while (i < L.length && !/^```/.test(L[i])) b.push(L[i++]);
      i++; o += "<pre><code>" + esc(b.join("\n")) + "</code></pre>"; continue;
    }
    if (/^<!--/.test(l)){ while (i < L.length && !/-->/.test(L[i])) i++; i++; continue; }
    if (/^\s*$/.test(l)){ i++; continue; }
    if (/^(-{3,}|\*{3,}|_{3,})\s*$/.test(l)){ o += "<hr>"; i++; continue; }
    let m = l.match(/^(#{1,6})\s+(.*)$/);
    if (m){ const n = Math.min(m[1].length, 3); o += `<h${n}>${inline(m[2])}</h${n}>`; i++; continue; }
    if (/^\s*\|/.test(l) && i + 1 < L.length && /^\s*\|?[\s:|-]+\|/.test(L[i+1])){
      const head = row(l); i += 2; let body = [];
      while (i < L.length && /^\s*\|/.test(L[i])) body.push(row(L[i++]));
      o += '<div class="tw"><table><thead><tr>' +
        head.map(c => `<th>${inline(c)}</th>`).join("") + "</tr></thead><tbody>" +
        body.map(r => "<tr>" + r.map(c => `<td>${inline(c)}</td>`).join("") + "</tr>").join("") +
        "</tbody></table></div>";
      continue;
    }
    if (/^\s*>/.test(l)){
      let b = [];
      while (i < L.length && /^\s*>/.test(L[i])) b.push(L[i++].replace(/^\s*>\s?/, ""));
      o += "<blockquote>" + md(b.join("\n")) + "</blockquote>"; continue;
    }
    if (/^\s*([-*+]|\d+\.)\s+/.test(l)){
      const ol = /^\s*\d+\./.test(l); let items = [];
      while (i < L.length && /^\s*([-*+]|\d+\.)\s+/.test(L[i])){
        let t = L[i++].replace(/^\s*([-*+]|\d+\.)\s+/, "");
        while (i < L.length && /^\s{2,}\S/.test(L[i]) && !/^\s*([-*+]|\d+\.)\s+/.test(L[i]))
          t += " " + L[i++].trim();
        items.push(`<li>${inline(t)}</li>`);
      }
      o += (ol ? "<ol>" : "<ul>") + items.join("") + (ol ? "</ol>" : "</ul>"); continue;
    }
    let p = [];
    while (i < L.length && !/^\s*$/.test(L[i]) && !/^(#{1,6}\s|\s*[-*+]\s|\s*\d+\.\s|\s*>|\s*\||```|<!--)/.test(L[i]))
      p.push(L[i++]);
    if (p.length) o += `<p>${inline(p.join(" "))}</p>`; else i++;
  }
  return o;
}

let sel = null;
function select(id){
  sel = id; const s = byId[id];
  const d = $("detail");
  const chips = (arr, lbl) => arr.length
    ? `<div class="links"><span class="lbl">${lbl}</span>` +
      arr.map(n => `<button class="chip" data-go="${n}">${n}</button>`).join("") + "</div>"
    : "";
  d.innerHTML =
    `<div class="d-head">
       <button class="d-close" title="Close">&times;</button>
       <div class="d-dept"><i class="dot" style="background:${hue(s.hue)}"></i>${s.deptLabel}</div>
       <div class="d-title">${esc(s.id)}</div>
       <div class="d-path">skills/${esc(s.path)}</div>
     </div>
     ${chips(s.calls, "Calls")}${chips(s.calledBy, "Called by")}
     <div class="md">${md(s.body)}</div>`;
  d.classList.add("open");
  d.scrollTop = 0;
  d.querySelector(".d-close").onclick = () => d.classList.remove("open");
  d.querySelectorAll("[data-go]").forEach(b => b.onclick = () => select(b.dataset.go));
  document.querySelectorAll(".sk").forEach(b => b.classList.toggle("sel", b.dataset.id === id));
  const cur = document.querySelector(".sk.sel");
  if (cur) cur.scrollIntoView({ block: "nearest" });
  draw();
}

/* ---------- search ---------- */
let matches = null;
$("search").oninput = e => {
  const q = e.target.value.trim().toLowerCase();
  matches = q ? new Set(S.filter(s =>
    s.id.toLowerCase().includes(q) ||
    s.description.toLowerCase().includes(q) ||
    s.body.toLowerCase().includes(q)).map(s => s.id)) : null;
  document.querySelectorAll(".sk").forEach(b =>
    b.classList.toggle("dim", !!matches && !matches.has(b.dataset.id)));
  draw();
};

/* ---------- force graph ---------- */
const cv = $("graph"), cx = cv.getContext("2d");
let W = 0, H = 0, dpr = 1;
const N = S.map(s => ({ id: s.id, dept: s.dept, hue: s.hue, orch: s.orchestrator,
  deg: 0, x: 0, y: 0, vx: 0, vy: 0 }));
const nById = Object.fromEntries(N.map(n => [n.id, n]));
E.forEach(e => { if (nById[e.source]) nById[e.source].deg++; if (nById[e.target]) nById[e.target].deg++; });
const LK = E.filter(e => nById[e.source] && nById[e.target])
            .map(e => ({ a: nById[e.source], b: nById[e.target] }));
const rOf = n => 5.5 + Math.min(9, Math.sqrt(n.deg) * 2.6) + (n.orch ? 2.2 : 0);

const hubs = {};
function layout(){
  const n = D.length, R = Math.min(W, H) * 0.30;
  D.forEach((d, i) => {
    const a = (i / n) * Math.PI * 2 - Math.PI / 2;
    hubs[d.id] = { x: W / 2 + Math.cos(a) * R, y: H / 2 + Math.sin(a) * R };
  });
}
function seed(){
  layout();
  N.forEach(nd => {
    const h = hubs[nd.dept] || { x: W / 2, y: H / 2 };
    nd.x = h.x + (Math.random() - .5) * 90;
    nd.y = h.y + (Math.random() - .5) * 90;
    nd.vx = nd.vy = 0;
  });
}
function tick(){
  // repulsion
  for (let i = 0; i < N.length; i++) for (let j = i + 1; j < N.length; j++){
    const a = N[i], b = N[j];
    let dx = b.x - a.x, dy = b.y - a.y, d2 = dx * dx + dy * dy || .01;
    if (d2 > 62500) continue;
    const d = Math.sqrt(d2), f = 1750 / d2;
    const ux = dx / d * f, uy = dy / d * f;
    a.vx -= ux; a.vy -= uy; b.vx += ux; b.vy += uy;
  }
  // links
  LK.forEach(l => {
    let dx = l.b.x - l.a.x, dy = l.b.y - l.a.y;
    const d = Math.hypot(dx, dy) || .01, f = (d - 108) * .012;
    const ux = dx / d * f, uy = dy / d * f;
    l.a.vx += ux; l.a.vy += uy; l.b.vx -= ux; l.b.vy -= uy;
  });
  // cluster gravity
  N.forEach(nd => {
    const h = hubs[nd.dept] || { x: W / 2, y: H / 2 };
    nd.vx += (h.x - nd.x) * .026; nd.vy += (h.y - nd.y) * .026;
    nd.vx *= .82; nd.vy *= .82;
    nd.x += nd.vx; nd.y += nd.vy;
  });
}

let view = { x: 0, y: 0, k: 1 };
const sx = n => n.x * view.k + view.x, sy = n => n.y * view.k + view.y;

function draw(){
  const c = C();
  cx.setTransform(dpr, 0, 0, dpr, 0, 0);
  cx.clearRect(0, 0, W, H);

  // department halos
  cx.save();
  D.forEach(d => {
    const h = hubs[d.id]; if (!h) return;
    const pts = N.filter(n => n.dept === d.id);
    if (!pts.length) return;
    let r = 0; pts.forEach(p => r = Math.max(r, Math.hypot(p.x - h.x, p.y - h.y)));
    cx.globalAlpha = .07;
    cx.fillStyle = hue(d.hue);
    cx.beginPath();
    cx.arc(h.x * view.k + view.x, h.y * view.k + view.y, (r + 34) * view.k, 0, 7);
    cx.fill();
    cx.globalAlpha = 1;
    cx.fillStyle = c.ink3;
    cx.font = `700 ${Math.max(9, 10.5 * view.k)}px ${getComputedStyle(document.body).fontFamily}`;
    cx.textAlign = "center";
    cx.fillText(d.label.toUpperCase(),
      h.x * view.k + view.x, h.y * view.k + view.y - (r + 44) * view.k);
  });
  cx.restore();

  const near = sel ? new Set([sel, ...(byId[sel].calls), ...(byId[sel].calledBy)]) : null;

  // edges
  LK.forEach(l => {
    const hot = near && (l.a.id === sel || l.b.id === sel);
    cx.strokeStyle = hot ? c.accent : c.edge;
    cx.globalAlpha = near ? (hot ? .95 : .18) : .55;
    cx.lineWidth = hot ? 1.7 : 1;
    cx.beginPath(); cx.moveTo(sx(l.a), sy(l.a)); cx.lineTo(sx(l.b), sy(l.b)); cx.stroke();
  });
  cx.globalAlpha = 1;

  // nodes
  N.forEach(n => {
    const r = rOf(n) * Math.max(.62, view.k);
    const dim = (matches && !matches.has(n.id)) || (near && !near.has(n.id));
    cx.globalAlpha = dim ? .2 : 1;
    cx.beginPath(); cx.arc(sx(n), sy(n), r, 0, 7);
    cx.fillStyle = hue(n.hue); cx.fill();
    if (n.id === sel){
      cx.lineWidth = 2.5; cx.strokeStyle = c.ink; cx.stroke();
    } else if (n.orch){
      cx.lineWidth = 1.6; cx.strokeStyle = c.panel; cx.stroke();
    }
    if (view.k > .72 || n.deg > 3 || n.id === sel){
      cx.globalAlpha = dim ? .18 : .92;
      cx.fillStyle = c.ink2;
      cx.font = `${n.orch ? 600 : 400} ${Math.max(9, 10.5 * Math.min(1.25, view.k))}px ui-monospace,monospace`;
      cx.textAlign = "center";
      cx.fillText(n.id, sx(n), sy(n) + r + 11);
    }
    cx.globalAlpha = 1;
  });
}

function hit(mx, my){
  for (let i = N.length - 1; i >= 0; i--){
    const n = N[i], r = rOf(n) * Math.max(.62, view.k) + 4;
    if ((mx - sx(n)) ** 2 + (my - sy(n)) ** 2 <= r * r) return n;
  }
  return null;
}

let drag = null, moved = 0;
cv.addEventListener("pointerdown", e => {
  const r = cv.getBoundingClientRect();
  drag = { x: e.clientX - r.left, y: e.clientY - r.top, n: hit(e.clientX - r.left, e.clientY - r.top) };
  moved = 0; cv.setPointerCapture(e.pointerId); cv.classList.add("drag");
});
cv.addEventListener("pointermove", e => {
  const r = cv.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
  if (drag){
    const dx = mx - drag.x, dy = my - drag.y;
    moved += Math.abs(dx) + Math.abs(dy);
    if (drag.n){ drag.n.x += dx / view.k; drag.n.y += dy / view.k; drag.n.vx = drag.n.vy = 0; }
    else { view.x += dx; view.y += dy; }
    drag.x = mx; drag.y = my; draw(); return;
  }
  const n = hit(mx, my), t = $("tip");
  if (n){
    t.textContent = n.id + "  (" + n.deg + ")";
    t.style.left = (mx + 13) + "px"; t.style.top = (my + 13) + "px"; t.style.opacity = 1;
    cv.style.cursor = "pointer";
  } else { t.style.opacity = 0; cv.style.cursor = ""; }
});
cv.addEventListener("pointerup", e => {
  cv.classList.remove("drag");
  if (drag && drag.n && moved < 5) select(drag.n.id);
  drag = null;
});
cv.addEventListener("wheel", e => {
  e.preventDefault();
  const r = cv.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
  const k = Math.min(3, Math.max(.35, view.k * (e.deltaY < 0 ? 1.11 : .9)));
  view.x = mx - (mx - view.x) * (k / view.k);
  view.y = my - (my - view.y) * (k / view.k);
  view.k = k; draw();
}, { passive: false });

function resize(){
  const r = $("graphwrap").getBoundingClientRect();
  dpr = Math.min(2, devicePixelRatio || 1);
  W = r.width; H = r.height;
  cv.width = W * dpr; cv.height = H * dpr;
  cv.style.width = W + "px"; cv.style.height = H + "px";
  layout();
}
addEventListener("resize", () => { resize(); draw(); });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { css = null; buildSidebar(); draw(); });

buildSidebar();
resize(); seed();
for (let i = 0; i < 420; i++) tick();
draw();
(function settle(n){ if (n > 0){ tick(); draw(); requestAnimationFrame(() => settle(n - 1)); } })(160);
</script>
</body>
</html>
