<!doctype html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skill Atlas</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --panel-2:#f0f2f5; --edge:#d9dde3;
  --ink:#12161c; --ink-2:#5a636f; --ink-3:#8b939f;
  --accent:#2f6df6; --shadow:0 1px 2px rgba(16,22,30,.06),0 8px 24px rgba(16,22,30,.06);
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --node-l:52%; --node-s:70%;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0d1117; --panel:#151b23; --panel-2:#1c232d; --edge:#2a323d;
    --ink:#e8edf4; --ink-2:#9aa5b4; --ink-3:#6b7684;
    --accent:#5b8cff; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
    --node-l:62%; --node-s:62%;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1117; --panel:#151b23; --panel-2:#1c232d; --edge:#2a323d;
  --ink:#e8edf4; --ink-2:#9aa5b4; --ink-3:#6b7684;
  --accent:#5b8cff; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
  --node-l:62%; --node-s:62%;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
  font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}

#app{display:grid;grid-template-rows:auto 1fr;height:100vh}

header{display:flex;align-items:center;gap:18px;padding:12px 18px;
  background:var(--panel);border-bottom:1px solid var(--edge);flex-wrap:wrap}
.brand{font-size:16px;font-weight:650;letter-spacing:-.015em;white-space:nowrap}
.counts{display:flex;gap:14px;color:var(--ink-2);font-size:12.5px;white-space:nowrap}
.counts b{color:var(--ink);font-variant-numeric:tabular-nums;font-weight:600}
.grow{flex:1 1 120px}
#search{width:100%;max-width:340px;padding:7px 11px;border-radius:8px;
  border:1px solid var(--edge);background:var(--panel-2);color:var(--ink);font-size:13px}
#search:focus{outline:2px solid var(--accent);outline-offset:-1px}
.tbtn{background:var(--panel-2);border:1px solid var(--edge);border-radius:8px;
  padding:6px 11px;font-size:12.5px}
.tbtn:hover{border-color:var(--accent)}

main{display:grid;grid-template-columns:250px minmax(0,1fr) minmax(0,440px);
  min-height:0;overflow:hidden}
@media (max-width:1100px){main{grid-template-columns:210px minmax(0,1fr)}
  #detail{position:fixed;inset:0 0 0 auto;width:min(440px,100%);z-index:20;
    box-shadow:var(--shadow);transform:translateX(100%);transition:transform .18s ease}
  #detail.open{transform:none}}
@media (max-width:720px){main{grid-template-columns:1fr}#sidebar{display:none}}

#sidebar{background:var(--panel);border-right:1px solid var(--edge);
  overflow-y:auto;padding:10px 0}
.dept{padding:2px 0 8px}
.dept-h{display:flex;align-items:center;gap:8px;padding:7px 14px 5px;
  font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-2)}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.dept-h span.n{margin-left:auto;color:var(--ink-3);font-weight:600;letter-spacing:0}
.sk{display:block;width:100%;text-align:left;background:none;border:0;
  padding:5px 14px 5px 31px;font-size:13px;color:var(--ink-2);
  border-left:2px solid transparent;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap}
.sk:hover{background:var(--panel-2);color:var(--ink)}
.sk.sel{background:var(--panel-2);color:var(--ink);font-weight:600}
.sk.orch::after{content:"chain";float:right;font-size:9.5px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--ink-3);font-weight:700}
.sk.dim{opacity:.25}

#graphwrap{position:relative;min-width:0;overflow:hidden;background:var(--bg)}
#graph{display:block;width:100%;height:100%;cursor:grab}
#graph.drag{cursor:grabbing}
.hint{position:absolute;left:14px;bottom:12px;color:var(--ink-3);font-size:11.5px;
  pointer-events:none;user-select:none}
#tip{position:absolute;pointer-events:none;background:var(--panel);
  border:1px solid var(--edge);border-radius:7px;padding:5px 9px;font-size:12px;
  box-shadow:var(--shadow);opacity:0;transition:opacity .1s;white-space:nowrap;z-index:5}

#detail{background:var(--panel);border-left:1px solid var(--edge);
  overflow-y:auto;min-width:0}
.d-head{position:sticky;top:0;background:var(--panel);border-bottom:1px solid var(--edge);
  padding:14px 18px 12px;z-index:2}
.d-dept{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-weight:700;
  letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2)}
.d-title{font-size:19px;font-weight:660;letter-spacing:-.02em;margin:6px 0 2px;
  font-family:var(--mono)}
.d-path{font-size:11.5px;color:var(--ink-3);font-family:var(--mono);word-break:break-all}
.d-close{position:absolute;top:12px;right:14px;background:none;border:0;
  color:var(--ink-3);font-size:19px;line-height:1;padding:2px 6px}
.links{display:flex;flex-wrap:wrap;gap:6px;padding:11px 18px 0}
.links .lbl{width:100%;font-size:10.5px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-3);margin-bottom:-2px}
.chip{background:var(--panel-2);border:1px solid var(--edge);border-radius:20px;
  padding:3px 10px;font-size:11.5px;font-family:var(--mono);color:var(--ink-2)}
.chip:hover{border-color:var(--accent);color:var(--ink)}

.md{padding:14px 18px 60px;font-size:13.5px;color:var(--ink-2);overflow-wrap:break-word}
.md h1,.md h2,.md h3{color:var(--ink);letter-spacing:-.015em;line-height:1.3}
.md h1{font-size:17px;margin:20px 0 8px}
.md h2{font-size:15px;margin:22px 0 7px;padding-top:12px;border-top:1px solid var(--edge)}
.md h3{font-size:13.5px;margin:16px 0 5px}
.md p{margin:0 0 9px}
.md ul,.md ol{margin:0 0 10px;padding-left:20px}
.md li{margin-bottom:3px}
.md strong{color:var(--ink);font-weight:640}
.md code{font-family:var(--mono);font-size:12px;background:var(--panel-2);
  border:1px solid var(--edge);border-radius:4px;padding:.5px 4px}
.md pre{background:var(--panel-2);border:1px solid var(--edge);border-radius:8px;
  padding:10px 12px;overflow-x:auto;margin:0 0 11px}
.md pre code{background:none;border:0;padding:0;font-size:11.5px;line-height:1.5}
.md blockquote{margin:0 0 11px;padding:2px 0 2px 12px;border-left:3px solid var(--edge);
  color:var(--ink-3)}
.md hr{border:0;border-top:1px solid var(--edge);margin:16px 0}
.md .tw{overflow-x:auto;margin:0 0 12px}
.md table{border-collapse:collapse;font-size:12.5px;min-width:100%}
.md th,.md td{border:1px solid var(--edge);padding:5px 9px;text-align:left;
  vertical-align:top}
.md th{background:var(--panel-2);color:var(--ink);font-weight:620;white-space:nowrap}
.empty{padding:44px 22px;color:var(--ink-3);text-align:center;font-size:13px}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">Skill Atlas</div>
    <div class="counts">
      <span><b id="c-s">0</b> skills</span>
      <span><b id="c-d">0</b> departments</span>
      <span><b id="c-e">0</b> connections</span>
    </div>
    <div class="grow"><input id="search" type="search" placeholder="Search skills, descriptions, contents..." autocomplete="off"></div>
    <button class="tbtn" id="theme">Theme</button>
  </header>
  <main>
    <nav id="sidebar"></nav>
    <div id="graphwrap">
      <canvas id="graph"></canvas>
      <div id="tip"></div>
      <div class="hint">Click a node to read it. Drag to pan, scroll to zoom.</div>
    </div>
    <aside id="detail"><div class="empty">Select a skill to read it.</div></aside>
  </main>
</div>
<script>
const DATA = {"skills": [{"id": "agent-profile", "folder": "agent-profile", "dept": "foundation", "deptLabel": "Foundation", "hue": 220, "description": "Create or refresh the agent profile file that every other skill in this library reads — the agent's name, brokerage, license number, service area, price band, brand colors and fonts, contact details, lender partner, and the disclosures their state and brokerage require on marketing. Trigger on \"set up my profile\", \"agent profile\", \"update my brokerage\", \"my license changed\", \"change my service area\", \"my brand colors\", \"who am I in this system\", or on the FIRST run of any listing, market, or sphere skill when `profile/AGENT.md` does not exist yet. Do NOT trigger for a client's or a lead's details — that is contact-import.", "body": "# Agent Profile — the file everything else reads\n\nThis is the foundation skill. Almost every other skill in this library opens\n`profile/AGENT.md` before it does anything. If that file is thin or stale, every flyer,\ncaption, and brief downstream is thin or stale too.\n\nRun this once at install, then whenever something in it changes.\n\n---\n\n## The file\n\nPath: `profile/AGENT.md`, relative to the working folder the user runs skills from.\n\nIf it already exists, **read it first and edit in place.** Never regenerate it from\nscratch — it accumulates corrections over time, and a rebuild silently drops them.\n\n## What to collect\n\nAsk for all of it in ONE message. Do not trickle-ask across five turns.\n\n**Identity and licensing**\n- Full legal name as it appears on the license, plus the name they go by\n- License number and issuing state\n- Brokerage legal name, brokerage license number, office address\n- Team name, if they market under one\n\n**Reach**\n- Direct phone for public-facing marketing (confirm this is the number they want printed;\n  many agents do not want their personal cell on a flyer)\n- Email, website, Instagram handle, other public profiles\n\n**Market**\n- Primary service area: cities, neighborhoods, or ZIP codes, listed explicitly\n- Typical price band\n- Property types they actually work (SFR, condo, income, land, luxury, new construction)\n- Their MLS name and whether they have an agent login — every market number in this\n  library comes from that MLS, so record which one\n\n**Brand**\n- Two or three brand colors as hex values\n- Headline and body fonts, and whether those fonts are installed locally\n- Logo and headshot file paths\n- Any brokerage brand rules they must follow (some brokerages mandate logo size,\n  placement, and a specific disclosure line)\n\n**Partners**\n- Lender partner, title, escrow, photographer, stager, inspector — name and contact.\n  Skills like `buydown-math` need to know who to ask for a rate sheet.\n- **The lender's NMLS ID**, and **the lender's pricing convention** — the exact rule for\n  reading a base rate off their sheet (for example: \"the zero-cost par rate\", or \"the\n  rebate closest to 1.500 without going over\"). `buydown-math` blocks without this, and\n  if it is missing every run picks its own rule and the same rate sheet produces\n  different payments. Ask the lender for it in one line and record their answer verbatim.\n- **The mortgage insurance provider** they quote through. Any payment below 20% down\n  needs a dated MI quote from a named provider, so without this `buydown-math` can only\n  ever show the 20%-down row.\n\n**Required disclosures**\n- The exact disclosure line their brokerage requires on marketing pieces\n- Their state's license-display rule (most states require the license number and the\n  brokerage name on any advertising)\n- Equal Housing Opportunity treatment\n\nIf they do not know their brokerage's rules, **do not guess and do not fill in a\nplausible-looking line.** Write `TO CONFIRM WITH BROKER` in that field and tell them it\nblocks any piece that ships publicly. A wrong disclosure is a license problem.\n\n## The format\n\nWrite it as markdown with one `##` section per group above and one fact per line, in\n`Key: value` form. Machine-readable enough for other skills to parse, human-readable\nenough for the agent to correct by hand.\n\n**The section names and their order are fixed. Do not rename them, do not reorder them,\nand do not invent a new one.** Downstream skills look these up by name, so a run that\ncalls it `## Track record` when the last run called it `## Production & experience`\nsilently breaks every skill that reads it. The canonical list, in order:\n\n```\n## Identity and licensing\n## Reach\n## Market\n## Brand\n## Track record\n## Partners\n## Required disclosures\n## Corrections log\n```\n\n`## Track record` holds years of experience, specialty, and production numbers. Create it\nempty with `TO CONFIRM` values rather than omitting it, so the shape of the file is the\nsame on every machine. If the agent asks for a field that does not belong to any section\nabove, put it in the closest existing section and say where you put it — do not open a\nnew section for it.\n\nEnd the file with:\n\n```\nLast updated: YYYY-MM-DD\n```\n\nand a `## Corrections log` section. **Append one dated line for every change you make in\na run, every time, including the run that creates the file** — what changed, from what to\nwhat, and who said so. Also log it when a downstream skill is told something in this file\nis wrong. That log is how the profile gets more accurate instead of drifting, and a run\nthat edits the file without writing the line has broken it. Set `Last updated` to today's\ndate read from the system, never a date you inferred from the contents of the file.\n\n## Guardrails\n\n- **Never invent a fact about the agent's business.** No production numbers, no years of\n  experience, no specialties unless they told you in this session. Blank beats wrong.\n- **Never write a market statistic into this file.** Profile holds identity, not data.\n  Market numbers live in `market-pull` output with an as-of date attached.\n- **Flag stale.** If `Last updated` is more than 180 days old when another skill reads\n  this, say so once and offer to run a refresh.\n\n## Downstream\n\nThese skills read `profile/AGENT.md` and will stop and route here if it is missing:\n`agent-voice`, `birthday-watch`, `buydown-math`, `carousel-render`, `compliance-check`,\n`followup-sequence`, `home-anniversary`, `listing-carousel`, `listing-description`,\n`listing-flyer`, `listing-package`, `market-brief`, `market-carousel`,\n`market-update-package`, `open-house-flyer`, `open-house-followup`,\n`open-house-package`, `open-house-signin`, `social-caption`, `sphere-message`.\n\nIf you add or remove a reader, update this list in the same edit. It was wrong in both\ndirections on 2026-08-24 — it named two skills that never read the file and omitted nine\nthat do, including `buydown-math`, the one with real compliance exposure.\n\n---\n\n<!-- self-improvement-loop v1 -->\n\n## Self-improvement loop\n\nBefore ending a run of this skill, review the run:\n\n1. Did any step fail, stall, or need a workaround you had to invent?\n2. Did the user correct, reject, or rewrite something meaningful in the output?\n3. Did you discover something a future run would want to know (a path that moved, a\n   tool that replaced another, a preference they stated out loud)?\n\nIf yes to any, propose a specific edit to this SKILL.md in one or two lines and ask\nwhether to apply it. Propose only changes that would alter a future run's behavior --\nskip cosmetic rewording, and never propose more than two edits at once.\n\nDo not edit this file without their go-ahead. If they say no, drop it and do not re-raise\nthe same suggestion in a later run of the same session.\n", "path": "agent-profile/SKILL.md", "orchestrator": false, "calls": ["agent-voice", "birthday-watch", "buydown-math", "carousel-render", "compliance-check", "followup-sequence", "home-anniversary", "listing-carousel", "listing-description", "listing-flyer", "listing-package", "market-brief", "market-carousel", "market-pull", "market-update-package", "open-house-flyer", "open-house-followup", "open-house-package", "open-house-signin", "social-caption", "sphere-message"], "calledBy": ["ghl-setup", "listing-flyer", "owners-manual", "preflight", "voice-command"]}, {"id": "agent-voice", "folder": "agent-voice", "dept": "foundation", "deptLabel": "Foundation", "hue": 220, "description": "Capture the agent's own writing voice from real samples they have already sent, store it as a reusable voice file, and apply it to any drafted text — texts, emails, captions, DMs, listing remarks, follow-ups. Trigger on \"capture my voice\", \"make this sound like me\", \"write in my voice\", \"that doesn't sound like me\", \"rewrite this the way I talk\", or automatically before any skill in this library drafts copy that goes out under the agent's name. Do NOT trigger for analysis, research, or internal notes nobody reads.", "body": "# Agent Voice — make the output sound like the agent, not like AI\n\nThe single fastest way this whole system loses an agent's trust is copy that sounds\ngenerated. This skill fixes that once and then gets applied everywhere.\n\n---\n\n## Part 1 — Capture (run once, refresh occasionally)\n\nFile: `profile/VOICE.md`. If it exists, read and edit in place.\n\n**Collect real samples, not descriptions.** Ask the agent to paste, from their own sent\nfolder and message history:\n\n- 5 to 10 texts they actually sent to clients\n- 3 emails: one to a new lead, one to a client mid-transaction, one to their sphere\n- 2 or 3 social captions they wrote themselves\n- One message they are proud of and one they think was clumsy\n\nIf they have nothing to paste, ask them to voice-record two minutes answering \"how would\nyou tell a past client about a listing you just took?\" and transcribe that. Spoken voice\nis closer to their real register than anything they would write on request.\n\n**Then extract, and write down what you actually observed:**\n\n- Greeting patterns. Do they open with a name? A day reference? Nothing at all?\n- Closing patterns. Full sign-off, first initial, nothing?\n- Sentence length and paragraph spacing. Blank lines between sentences, or dense blocks?\n- Contractions and shortcuts they genuinely use\n- Emoji: how many, which ones, where. Some agents live on them. Record the truth.\n- Punctuation habits: em-dashes, ellipses, exclamation points, ALL CAPS for emphasis\n- Words and phrases that recur — their actual vocabulary\n- Register shifts: how they write to a past client vs a cold lead vs another agent\n\n**And record the bans.** Ask directly: what words make you cringe? Every agent has them.\nKeep a `## Banned words` list and scan every finished draft against it before delivering —\ndo not just try to avoid them while writing.\n\n## Part 2 — Apply\n\nAny skill in this library that drafts outbound text loads `profile/VOICE.md` first.\n\n**Universal rules, regardless of what the voice file says:**\n\n- No filler hedges. \"Honestly\", \"to be honest\", \"I just wanted to reach out\", \"I hope\n  this email finds you well\", \"in today's market\" all read as machine-written.\n- No manufactured urgency the agent has not actually earned.\n- No claim about the agent's life, history, or experience that is not in\n  `profile/AGENT.md` or was not said in this session. If a line implies where they live,\n  what they have personally seen, or how long they have done something, source it or\n  rewrite it true.\n- No promise made on the agent's behalf that they have not committed to.\n- Match their emoji and punctuation level to the file, not to your defaults.\n\n**Then run the check before you hand anything over:**\n\n1. Read the draft against 2 or 3 of the captured samples side by side. Does it belong in\n   the same set?\n2. Scan for banned words.\n3. Scan for claims that need a source (numbers, dates, credentials) — those route to\n   `source-check`.\n4. Anything public-facing about a property or a neighborhood routes to\n   `compliance-check` before it ships.\n\n## Part 3 — Keep it honest\n\nWhen the agent rewrites something you drafted, that rewrite is the highest-value signal in\nthis whole system. Append it to `profile/VOICE.md` under `## Corrections`, with both the\nversion you wrote and the version they sent, dated. Three of those teach more than the\noriginal capture did.\n\n## Chains into\n\n`social-caption`, `sphere-message`, `followup-sequence`, `open-house-followup`,\n`listing-description`, `market-brief`.\n\n---\n\n<!-- self-improvement-loop v1 -->\n\n## Self-improvement loop\n\nBefore ending a run of this skill, review the run:\n\n1. Did any step fail, stall, or need a workaround you had to invent?\n2. Did the user correct, reject, or rewrite something meaningful in the output?\n3. Did you discover something a future run would want to know (a path that moved, a\n   tool that replaced another, a preference they stated out loud)?\n\nIf yes to any, propose a specific edit to this SKILL.md in one or two lines and ask\nwhether to apply it. Propose only changes that would alter a future run's behavior --\nskip cosmetic rewording, and never propose more than two edits at once.\n\nDo not edit this file without their go-ahead. If they say no, drop it and do not re-raise\nthe same suggestion in a later run of the same session.\n", "path": "agent-voice/SKILL.md", "orchestrator": false, "calls": ["compliance-check", "followup-sequence", "listing-description", "market-brief", "open-house-followup", "social-caption", "source-check", "sphere-message"], "calledBy": ["agent-profile", "birthday-watch", "followup-queue", "followup-sequence", "home-anniversary", "listing-description", "market-brief", "open-house-followup", "preflight", "social-caption", "social-scan", "sphere-message"]}, {"id": "birthday-watch", "folder": "birthday-watch", "dept": "sphere", "deptLabel": "Sphere", "hue": 340, "description": "Check the contact database for birthdays landing today and in the next seven days, and draft a genuine personal message for each one in the agent's voice. Trigger on \"whose birthday is it\", \"birthdays this week\", \"birthday check\", \"run birthdays\", or as part of sphere-daily. Do NOT trigger for home purchase anniversaries — that is home-anniversary.", "body": "# Birthday Watch — the touch nobody resents\n\nA birthday message is the only unsolicited contact from a real estate agent that is\nuniversally welcome. It costs nothing, it is not a pitch, and it produces more return\nconversations than any campaign an agent will ever pay for.\n\nIt also fails badly when it is obviously automated. This skill exists to keep it real.\n\nReads `data/contacts.csv`, `profile/VOICE.md`, `profile/AGENT.md`.\n\n---\n\n## The check\n\nMatch on `birthday`. Only two formats are valid: `MM-DD` or `YYYY-MM-DD`. If a row's\n`birthday` value is blank, or is in any other format (e.g. `March 3`, `3/3`, `03/03/1990`),\ndo not guess — skip that row for today's list, add it to a \"needs fixing\" count reported\nto the agent, and do not include it in the next-7-days list either until the format is\ncorrected. Return:\n\n- **Today**, drafted and ready\n- **The next 7 days**, so the agent can plan a call or a card\n\nExclude anything tagged `optout` (any value: `all`, `text`, `email`, or `call` — if the\ntagged channel is the one this skill would use, i.e. text or call, exclude; if the\ncontact opted out of a different channel only, proceed on this channel). Include tier D\ncontacts here only if `profile/AGENT.md` or the contact's own notes field names the agent\nas knowing them personally (a job, a mutual friend, a specific shared memory) — a bare\nimported row with no such detail does not qualify, however long it has been in the\ndatabase. A birthday text to a scraped contact is worse than no message.\n\n## Draft each one individually\n\n**Never a template with a merge field.** People can tell instantly, and a generic\n\"Happy Birthday [FirstName]!\" from their real estate agent reads as a CRM, which is the\nopposite of what this touch is for.\n\nFor each person, pull whatever context the file holds — how the agent knows them, when\nthey closed, what is in their notes — and write **one message that could only have been\nsent to that person.** If the file holds nothing useful, write something short and warm\nrather than something long and generic. Short and real beats long and hollow.\n\n**Length:** one to three sentences. This is a birthday text, not a newsletter.\n\n**Voice:** run `agent-voice`. Match their real greeting habit, their real emoji level,\ntheir real spacing. Scan for banned words before delivering.\n\n## The hard rule\n\n**No business in a birthday message.** No market update, no \"let me know if you're\nthinking of selling\", no link, no listing, no call to action of any kind.\n\nThe moment a birthday text carries a pitch, it stops being a gift and becomes an ad, and\nthe recipient files every future message from that agent the same way. The business return\non birthdays comes precisely from the fact that there is no ask in them.\n\nIf the agent asks to add a line about the market, say this plainly once, then do what they\ndecide.\n\n## Escalate the important ones\n\nFor tier A contacts and anyone with a real relationship, propose **a call instead of a\ntext**, and for the top handful, a card in the mail. A voice message on someone's birthday\noutperforms a text by a wide margin and takes forty seconds.\n\nRank the day's list so the agent knows which one or two are worth the call.\n\n## Approval and sending\n\nPresent the batch as a numbered list with each recipient and the full message copy, in a\nfile the agent can edit. Then wait for their go.\n\nNothing sends without an explicit approval in this session for this specific batch.\nApproval today is not approval tomorrow.\n\nAfter sending, report what went and what did not, by count and by name. Update\n`last_touch` in `data/contacts.csv` and log to `records/sent-log.md`.\n\n## Filling the gap\n\nMost databases have birthdays on well under a quarter of contacts, which is the single\nbiggest limiter on this skill. Tell the agent the count, then give them one practical way\nto collect more — asking at closing, adding the field to the open house sign-in, or\ncapturing them from conversations as they happen. One method, not five.\n\n## Wider birthday sources\n\n`data/contacts.csv` is the read for the daily scan, but it is rarely the only place an\nagent's birthdays live. When the agent wants to grow the file rather than wait on\none-at-a-time capture, offer these, one at a time, not all five in a wall of text:\n\n1. **Phone contacts (.vcf).** If they export their phone contacts as a vCard, that is a\n   `contact-import` job, not this skill's — send them there. `contact-import` already\n   normalizes vCard `BDAY` fields into the `MM-DD` / `YYYY-MM-DD` schema this skill reads.\n   Once re-imported, re-run this skill and the new birthdays are live.\n2. **CRM birthday field, via export refresh.** Most CRMs (Lofty, Follow Up Boss, KW\n   Command, etc.) have a birthday field that never gets surfaced anywhere. Ask the agent\n   to pull a fresh CRM export and hand it to `contact-import` the same way. This is a\n   refresh, not a first import — `contact-import`'s dedupe-on-conflict rule already keeps\n   the more recently touched record, so re-running it is safe.\n3. **Facebook birthdays.** If the agent has a logged-in browser session available to\n   Claude, browse to `facebook.com/events/birthdays` and read the day's and week's names\n   directly off the page. Match each name against `data/contacts.csv` by first+last name\n   (fall back to a fuzzy match and confirm with the agent on anything uncertain — never\n   silently guess an identity match). If no logged-in session is available, tell the agent\n   plainly: \"I can't reach Facebook from here — open facebook.com/events/birthdays\n   yourself and paste me the names for today and this week.\"\n4. **WhatsApp, WeChat, or anything else.** Same paste-in path as Facebook: the agent opens\n   whatever app holds the birthday and pastes the names (and dates, if visible) into the\n   chat. Claude never needs API access to these — a pasted list is enough to work with.\n\n**Write discovered birthdays back into `data/contacts.csv`.** Whether a birthday came from\na vCard re-import, a CRM refresh, a Facebook scan, or a pasted list, the point is that the\nfile gets richer over time instead of this being a one-off lookup. Match the new birthday\nto an existing `contact_id` where one exists (same dedupe logic as `contact-import`: phone,\nthen email, then exact first+last+city); if the person is not yet in the file at all, ask\nthe agent whether to add them as a new row rather than silently creating one. Report what\nwas added: \"found 4 new birthdays from Facebook, wrote them into contacts.csv.\"\n\n## Notification levels — how the daily result reaches the agent\n\nThe scan itself does not change across levels — same file, same read, same drafting rules\nabove. **Levels only change how today's brief gets in front of the agent**, and whether it\ngoes further than that. Ask the agent once, at setup, which level they want, and record the\nchoice in `profile/AGENT.md` so future runs do not have to ask again.\n\n### Level 1 — Notify (everyone, day one)\n\nThe run writes the daily birthday brief — who, the relationship, their number, the drafted\nmessage for each — same format as the existing approval-batch file. Delivery:\n\n- If the agent has a mail connector connected in their Claude Code, draft and send an\n  email **to the agent's own address** with the brief. This is Claude emailing the agent,\n  not the agent's contacts — it needs no approval gate, since nothing is going to a third\n  party.\n- If no mail connector is connected, leave the brief file open and tell the agent plainly\n  where it is and that it's ready for review.\n\nThis works on iPhone and Android and needs no phone number, no CRM, and no API key. It is\nwhere every agent starts.\n\n### Level 2 — Text me the list (needs a CRM number, e.g. Lofty)\n\nFor agents on a CRM with its own SMS-sending number, the skill can text the daily brief\n**to the agent** from that number instead of (or alongside) the email.\n\n**Lofty reference** (the CRM most of this library's agents use):\n\n- API key: agent generates one in Lofty under **Settings > Integrations > API**. Docs at\n  `developer.lofty.com`.\n- Send endpoint: `POST /v1.0/message/sms/send`. This endpoint sends to a *lead*, not to an\n  arbitrary phone number — so the one-time setup is: the agent adds **themselves** as a\n  lead in Lofty with their own cell number.\n- Store that lead's id as `leadId` in `profile/AGENT.md` under a `Birthday Watch` section,\n  once, at setup. Every daily run reads it from there rather than asking again.\n- If the API key or `leadId` is missing when this level is requested, stop and get them\n  before the first send — do not guess or fall back to a channel the agent didn't ask for.\n\n**Other CRMs.** If the agent's CRM has its own SMS-send API, the same pattern applies:\nfind the CRM's own docs (ask Claude to check them), find the equivalent of \"add myself as\na recipient\" and \"send\" endpoints, and store whatever id that CRM needs in\n`profile/AGENT.md` the same way. Do not assume Lofty's exact shape carries over — verify\nagainst that CRM's own documentation before wiring anything.\n\n### Level 3 — Full loop (advanced)\n\n**This is real plumbing. Expect to iterate on it before it feels smooth.** It is exactly\nwhat Joshua sets up for clients in his 1:1 installs, and it is the right level for an agent\nwho wants to reply to the Level 2 text with a dictated birthday message and have it go out\nwithout opening a laptop.\n\nThe loop:\n\n1. The agent replies to the Level 2 text with a birthday message, dictated or typed.\n2. A watcher — a scheduled Claude run polling\n   `GET /v2.0/leads/{leadId}/activities` for inbound texts, or a webhook registered via\n   `POST /v1.0/webhook` with event type `Text` — picks up that reply.\n3. The watcher **always echoes back what it is about to send and to whom** before sending\n   anything to the actual contact, and only fires on an explicit \"send\" (or equivalent\n   clear go) in the agent's reply. A dictated draft that doesn't say \"send\" is held, not\n   sent.\n4. Once confirmed, the watcher sends the birthday text to the actual contact using the\n   same `POST /v1.0/message/sms/send` endpoint, this time targeting the contact's own\n   `leadId` (or the CRM equivalent), not the agent's.\n\n**Known Lofty caveats to plan around:**\n- Webhooks do not fire for `AUTO` communications — only for genuine inbound activity.\n- The webhook callback URL must be HTTPS.\n\nMark this level plainly to the agent as advanced: it involves a second moving part (the\nwatcher) that has to stay scheduled and healthy, and it is worth setting up once it's clear\nLevel 1 or 2 is actually being used.\n\n### The hard rail — unchanged at every level\n\n**Messages to CONTACTS only go out after the agent's explicit go for that specific\nmessage**, exactly as in the base skill above — this does not change no matter which\nnotification level is running. Level 1 and Level 2 deliveries are notifications *to the\nagent themselves* about their own day; those are not gated, because nothing is reaching a\nthird party. The gate is on the outbound birthday message to the contact, always.\n\n## Cadence\n\nRun this daily, in the morning, before the agent's day starts — birthdays are the one item\non `sphere-daily` that is time-bound (today or nothing), so a scan that runs at noon has\nalready missed half its value.\n\nTo have Claude run it automatically, ask: \"schedule my birthday check every morning at\n[time].\" That is a `schedule` skill job, not something this skill sets up itself.\n\n## Chains from / into\n\nCalled by `sphere-daily`. Reads `contact-import` output and `agent-voice`. Sits alongside\n`home-anniversary`.\n\n---\n\n<!-- self-improvement-loop v1 -->\n\n## Self-improvement loop\n\nBefore ending a run of this skill, review the run:\n\n1. Did any step fail, stall, or need a workaround you had to invent?\n2. Did the user correct, reject, or rewrite something meaningful in the output?\n3. Did you discover something a future run would want to know (a path that moved, a\n   tool that replaced another, a preference they stated out loud)?\n\nIf yes to any, propose a specific edit to this SKILL.md in one or two lines and ask\nwhether to apply it. Propose only changes that would alter a future run's behavior --\nskip cosmetic rewording, and never propose more than two edits at once.\n\nDo not edit this file without their go-ahead. If they say no, drop it and do not re-raise\nthe same suggestion in a later run of the same session.\n", "path": "birthday-watch/SKILL.md", "orchestrator": false, "calls": ["agent-voice", "contact-import", "home-anniversary", "sphere-daily"], "calledBy": ["agent-profile", "contact-import", "preflight", "revocation-watch", "sphere-audit", "sphere-message"]}, {"id": "buydown-math", "folder": "buydown-math", "dept": "listings", "deptLabel": "Listings", "hue": 28, "description": "Build the seller-credit and rate-buydown comparison for one property — what the same dollars do applied to price, to closing costs, or to a permanent rate buydown — with every payment traced to a dated lender rate sheet and a full assumptions disclaimer. Trigger on \"buydown\", \"rate buydown\", \"seller credit math\", \"run the payment scenarios\", \"what would 2 points do\", \"buydown flyer\", or as a step inside listing-package. Do NOT trigger without a lender partner and a current rate sheet — this skill blocks rather than estimates.", "body": "# Buydown Math — the highest-converting piece, and the one that can hurt you\n\nThis is the piece that reaches people who are not already following the agent, because it\nanswers a question buyers actually have. It is also the only piece in this library that\nputs a dollar figure in front of a consumer, which makes it the one with real exposure.\n\n**The rule that governs this entire skill: if a number cannot be sourced this session,\nthe piece does not ship.** Not hedged, not rounded, not \"approximately\". Blocked.\n\n---\n\n## The gate — check ALL of this before writing one number\n\n1. **A dated rate sheet from the agent's lender partner, dated within 2 business days.**\n   Not last week's. Not the one in the last listing folder. Not a rate from a website.\n   The lender's own dated sheet, obtained this session. **Read today's date off the\n   system to age it — never infer the date from the filename, the folder, or the\n   contents of the sheet.** If you cannot establish today's date, the piece blocks.\n2. **The pricing convention written down, BEFORE this run.** Rate sheets price in rebate\n   and cost columns, and which row you call the base rate changes every number on the\n   piece. The lender's convention lives in `profile/AGENT.md` under Partners.\n   **If it is not already recorded there, this item is MISSING and the piece blocks.**\n   Do not pick a convention yourself and disclose it — a disclosed guess is still a\n   guess, and the next run will pick a different one off the same sheet. Route it back:\n   *\"Which row on your sheet do you price from — the zero-cost par rate, or a target\n   rebate? I will write it down once and use it every time.\"* Record their answer in\n   `profile/AGENT.md`, then re-run.\n   State in the output exactly which column you read and the recorded rule you applied.\n3. **A dated mortgage insurance quote** from a named provider, if the scenario has MI.\n4. **The full assumption set:** price, down payment, loan amount, term, product, credit\n   score, DTI, occupancy, property type, impounds or not, and whether the buydown is\n   permanent (discount points) or temporary (2-1, 3-2-1).\n5. **The lender's NMLS ID** for the disclaimer.\n\n**If any of the five is missing:** say the buydown piece is blocked, name which item is\nmissing, and produce the rest of the listing package without it. That is the correct\noutcome, not a reason to estimate. Route the ask back to the agent as one line they can\nforward to their lender.\n\n## The math to present\n\nKeep it to three scenarios. More than three and nobody reads it.\n\nThe comparison that lands is **same dollars, three destinations**:\n\n| | Price reduction | Credit to closing costs | Permanent rate buydown |\n|---|---|---|---|\n| Seller gives up | $X | $X | $X |\n| Buyer's payment | | | |\n| Buyer's cash to close | | | |\n| Saved over 5 years | | | |\n\n**Defined, so two runs on the same inputs produce the same table:**\n\n- The **baseline** is the same property with no seller contribution applied, at the\n  recorded convention's base rate and the same down payment. State the baseline payment\n  in words underneath the table.\n- **Buyer's payment** is principal and interest, plus mortgage insurance when the\n  scenario has MI and a dated MI quote exists. Say in the row label exactly what is in\n  it.\n- **Saved over 5 years** is `(baseline payment − scenario payment) × 60`. Nothing else —\n  no reinvestment, no equity, no tax effect, no comparison of cash-to-close. If a\n  scenario changes the cash to close as well, that belongs in the cash-to-close row, not\n  folded into this one.\n- **Rounding:** payments and dollar savings to the cent, rates to three decimals,\n  percentages of a loan to three decimals. Do not round a savings figure to the nearest\n  dollar in one place and the cent in another.\n- **Leftover contribution.** If the sheet's lowest rate costs less than the full\n  contribution, say the exact amount that buys the rate down, say the exact remainder,\n  and state that the remainder has no lower rate on this sheet to buy into. Do not\n  suggest where the remainder should go — where it lands is the lender's and the\n  parties' call, not this skill's.\n\nThe plain-English mechanic, which is the actual content:\n\n> A price cut moves the payment a little. A credit at the closing table helps once, on\n> one day. The same dollars applied to a permanent rate buydown lower the payment every\n> single month for as long as they own the loan.\n\nThen show the down-payment ladder if the product supports it — 5% / 10% / 20% down with\nthe payment and the monthly delta on each — and name the product. Many buyers do not know\nthey have options below 20%, and that is often the line that gets the piece shared.\n\n**Every row below 20% down needs its own dated MI quote at that LTV.** One MI quote does\nnot cover three down payments, and neither does one rate — many sheets price by LTV. If\nyou have the quote for some rows and not others, show the rows you can source, leave the\nothers visibly blocked with the reason, and give the agent the one line to send their\nlender. Never carry a 20%-down payment across to a 5%-down row, and never show principal\nand interest alone on a row that needs MI — it understates what the buyer actually pays,\nwhich is the exact failure this skill exists to prevent.\n\n## What you must NOT do\n\n- **Do not state or imply that a seller credit has been offered or negotiated** on the\n  property unless the listing agent has confirmed in writing that it has. Default\n  language: *\"No seller credit has been offered or negotiated on this property.\"*\n- Do not present this as a loan offer, a pre-approval, a lock, or a commitment to lend.\n- Do not quote an APR unless the lender supplied it — APR has its own calculation rules.\n- Do not compare against a competitor lender's rate.\n- Do not show a payment as the buyer's \"total payment\" if it excludes taxes, insurance,\n  and HOA. Say explicitly what is excluded.\n- Do not omit the disclaimer to make the graphic look cleaner. The disclaimer is the\n  piece.\n- **Never show a temporary buydown (2-1, 3-2-1) as a single payment.** A temporary\n  buydown's payment steps up on a schedule, and showing only year one is the most\n  misleading thing this skill could produce. Show every year of the schedule and the\n  final permanent payment the buyer lands on, label which years are subsidized, and say\n  who funds the subsidy account. If you cannot source the full schedule, block it and\n  build the permanent-buydown version instead.\n\n## The disclaimer block (mandatory, every date updated)\n\n> Illustration only. Payment varies with loan amount, down payment, credit, and rate.\n> No seller credit has been offered or negotiated on this property. Not a commitment to\n> lend. Assumes [price], [term and product], [credit score], [DTI], [occupancy],\n> impounds [waived/included], [permanent discount point buydown / temporary buydown].\n> Payments shown are principal, interest and mortgage insurance only, and exclude\n> property taxes, homeowners insurance, and HOA dues, so the actual payment is higher.\n> MI estimated via [provider] on [date]. Rates from lender sheet dated [date], subject to\n> change without notice. Not all applicants qualify. Equal Housing Opportunity.\n> [Lender name], NMLS #[ID].\n\n## Compliance\n\n- The **agent's** brokerage and license appear on the piece, and the **lender's** name\n  and NMLS ID appear on it. Both. See `compliance-check`.\n- If a lender is paying any share of the cost of a co-marketed piece, the split is a\n  broker-and-lender question with real legal weight. Route it, do not design it here.\n- Run `source-check` on the finished piece before it ships. Every time.\n\n## Output\n\nWrite `listings/<slug>/BUYDOWN.md` containing the scenario table, every assumption, the\nrate sheet date and column read, the MI provider and date, and the disclaimer as it will\nappear. Then note it in the listing's Status log.\n\n## Chains from / into\n\nCalled by `listing-package`. Reads `listings/<slug>/LISTING.md` from `listing-intake` and\n`profile/AGENT.md`. Feeds `listing-carousel` (buydown variant), `listing-flyer`, and\n`social-caption`. Gated by `source-check` and `compliance-check`.\n\n---\n\n<!-- self-improvement-loop v1 -->\n\n## Self-improvement loop\n\nBefore ending a run of this skill, review the run:\n\n1. Did any step fail, stall, or need a workaround you had to invent?\n2. Did the user correct, reject, or rewrite something meaningful in the output?\n3. Did you discover something a future run would want to know (a path that moved, a\n   tool that replaced another, a preference they stated out loud)?\n\nIf yes to any, propose a specific edit to this SKILL.md in one or two lines and ask\nwhether to apply it. Propose only changes that would alter a future run's behavior --\nskip cosmetic rewording, and never propose more than two edits at once.\n\nDo not edit this file without their go-ahead. If they say no, drop it and do not re-raise\nthe same suggestion in a later run of the same session.\n", "path": "buydown-math/SKILL.md", "orchestrator": false, "calls": ["compliance-check", "listing-carousel", "listing-flyer", "listing-intake", "listing-package", "social-caption", "source-check"], "calledBy": ["agent-profile", "compliance-check", "listing-carousel", "listing-flyer", "listing-intake", "listing-package", "preflight", "social-caption", "source-check"]}, {"id": "carousel-render", "folder": "carousel-render", "dept": "content", "deptLabel": "Content", "hue": 48, "description": "Render a set of HTML slides into social-ready PNG images at the correct dimensions and quality, using the agent's brand colors and fonts, with the overflow and legibility checks that catch broken layouts before they post. The shared rendering engine every carousel skill calls. Trigger on \"render the slides\", \"export to PNG\", \"make the images\", \"the slides look wrong\", or as a sub-step of listing-carousel or market-carousel. Do NOT trigger to decide what goes on the slides — that is the calling skill's job.", "body": "# Carousel Render — the shared engine\n\nEvery carousel skill in this library calls this one to turn HTML into images. Kept\nseparate so the design rules live in one place and a fix reaches every carousel type at\nonce.\n\nReads `profile/AGENT.md` for brand.\n\n---\n\n## Dimensions\n\n| Use | Pixels | Note |\n|---|---|---|\n| Feed portrait (**default**) | 1080 x 1350 | 4:5, the most screen space in feed |\n| Feed square | 1080 x 1080 | Only if the agent asks |\n| Story / Reel cover | 1080 x 1920 | 9:16 |\n\n**Render at 2x and downscale.** Author the page at the target size, render at\n`deviceScaleFactor: 2` (so 2160 x 2700), then resize to the target. Text and thin rules\ncome out dramatically cleaner than rendering at 1x.\n\n## Method\n\n1. One HTML file per slide, or one file with one `.slide` element per slide sized exactly\n   to the target dimensions.\n2. **All CSS inline. No CDN, no external font links, no remote images.** The render must\n   work with no network. Embed images as files on disk or as data URIs.\n3. Fonts: use the agent's brand fonts from `profile/AGENT.md` if they are installed\n   locally. If they are not, **say so** and fall back to a named system stack. Do not\n   silently substitute — the agent will notice on the third post and lose trust in\n   everything.\n4. Headless browser screenshot per slide, full element, no scrollbars.\n5. Output `slide-01.png`, `slide-02.png`, … zero-padded, in post order, into the folder\n   the calling skill specifies.\n\n## The checks — run these every time\n\n**Then open the rendered PNGs and actually look at them.** This is not optional and it is\nwhere most failures are caught.\n\n- **Overflow.** Long addresses, six-figure numbers, and long agent names break templates\n  designed against short examples. Check every text box for clipping and for text\n  escaping its container.\n- **Bottom safe zone.** Nothing important in the bottom ~120px — the app's own UI covers\n  it in feed.\n- **Contrast.** Text over photography needs a scrim or a solid block. Check the worst\n  slide, not the best one.\n- **Minimum type size.** Body text no smaller than ~28px at 1080 wide; the disclaimer\n  block no smaller than ~22px. Social compression destroys small type.\n- **Consistent margins.** Inconsistent gutters between slides is the clearest visual tell\n  of a generated deck. Check the left edge of all slides against each other.\n- **Slide order.** Confirm the filenames are in the intended post order. Instagram uploads\n  in filename order and a reordered carousel reads as broken.\n- **File size.** Under about 8 MB per image. Larger gets recompressed harder by the\n  platform and looks worse.\n\nIf any check fails, fix the HTML and re-render. Do not deliver images you have not looked\nat.\n\n## Reusability\n\nSave the slide HTML alongside the PNGs, with the content separated from the layout where\npossible, so next month's version is a data swap rather than a rebuild. Note the template\npath in the output folder.\n\n## What this skill does not do\n\nIt does not decide what goes on the slides, write the copy, or run compliance. The calling\nskill owns all of that. This one turns approved content into correct images.\n\n## Chains from\n\n`listing-carousel`, `market-carousel`, and any future carousel type.\n\n---\n\n<!-- self-improvement-loop v1 -->\n\n## Self-improvement loop\n\nBefore ending a run of this skill, review the run:\n\n1. Did any step fail, stall, or need a workaround you had to invent?\n2. Did the user correct, reject, or rewrite something meaningful in the output?\n3. Did you discover something a future run would want to know (a path that moved, a\n   tool that replaced another, a preference they stated out loud)?\n\nIf yes to any, propose a specific edit to this SKILL.md in one or two lines and ask\nwhether to apply it. Propose only changes that would alter a future run's behavior --\nskip cosmetic rewording, and never propose more than two edits at once.\n\nDo not edit this file without their go-ahead. If they say no, drop it and do not re-raise\nthe same suggestion in a later run of the same session.\n", "path": "carousel-render/SKILL.md", "orchestrator": false, "calls": ["listing-carousel", "market-carousel"], "calledBy": ["agent-profile", "content-week", "preflight"]}, {"id": "compliance-check", "folder": "compliance-check", "dept": "foundation", "deptLabel": "Foundation", "hue": 220, "description": "Review any public-facing real estate marketing for fair housing violations, missing license and brokerage disclosure, valuation claims, and unapproved lender or affiliate mentions, before it is printed, posted, or sent. Trigger on \"compliance check\", \"is this fair housing safe\", \"can I say this\", \"review my listing copy\", \"check this flyer\", or automatically before any flyer, carousel, listing remark, caption, or landing page ships. Do NOT trigger for internal notes, private messages to a single known client about their own transaction, or number verification — numbers are source-check.", "body": "# Compliance Check — the last read before it goes public\n\nOne AI-drafted fair housing mistake is the agent's license and their E&O policy. This\nskill is a hard gate, not a suggestion.\n\n**You are not the agent's attorney or their broker.** This skill catches the common,\nwell-documented failures. Anything ambiguous goes to their broker before it ships, and\nyou say so plainly rather than making the call yourself.\n\n---\n\n## 1. Fair housing\n\nThe protected classes under the federal Fair Housing Act: race, color, religion, national\norigin, sex (including sexual orientation and gender identity), familial status, and\ndisability. Many states and cities add more — source, age, marital status, and others.\nCheck the agent's state, and if you cannot confirm the state's list this session, say so.\n\n**Reject any language that describes the PEOPLE rather than the PROPERTY.**\n\nCommon failures to scan for, in listing copy, captions, flyers, market briefs, and\nneighborhood descriptions:\n\n- Anything about who lives in an area, or the demographic makeup of a neighborhood\n- School quality or school ratings used as a selling point (a familial-status and\n  often a racial proxy). Naming the assigned district factually is different from\n  calling it \"great schools.\"\n- \"Safe\", \"quiet\", \"family-friendly\", \"good area\", \"up-and-coming\", \"exclusive\",\n  \"prestigious\", \"desirable neighborhood\"\n- \"Perfect for a young family\", \"ideal for a couple\", \"great starter home for newlyweds\",\n  \"empty nesters\", \"retirees\"\n- Proximity to specific churches, temples, or mosques as an amenity\n- \"Walking distance\" or \"must be able to climb stairs\" (disability implications) — say\n  what the property physically is instead\n- \"Master bedroom\" is being phased out at many brokerages; use \"primary bedroom\"\n\n**Never publish racial, ethnic, or demographic percentages for a neighborhood.** Not in a\ncarousel, not in a market brief, not as \"just data\". There is no compliant version of it.\n\nThe rewrite rule: **describe the house, the lot, and the verifiable physical facts.** A\nfour-bedroom with a large flat back yard is a fact. \"Perfect for a growing family\" is a\nviolation of the same sentence.\n\n## 2. Advertising and license disclosure\n\nRead the required fields from `profile/AGENT.md`:\n\n- Is the agent's license number displayed where the state requires it?\n- Is the brokerage's legal name displayed, at the size and prominence the brokerage\n  requires?\n- Is the Equal Housing Opportunity logo or statement present on the piece?\n- If the agent is a team, is the team clearly identified as operating under the brokerage?\n- If the piece names another agent's listing, is the listing brokerage credited?\n\nIf `profile/AGENT.md` has `TO CONFIRM WITH BROKER` in any disclosure field, **the piece is\nblocked.** Say so and route them to their broker. Do not fill in a plausible-looking line.\n\n## 3. Valuation and market claims\n\n- Never imply a property is underpriced, overpriced, a steal, a deal, below market, or\n  what it is \"really worth\". Mirror what the listing agent states the property offers.\n- Never state or imply what a property will be worth in the future, or that values will\n  rise. No appreciation projections in consumer marketing.\n- Never guarantee a sale, a timeline, or a price.\n- Any market statistic in the piece routes to `source-check`, MLS-sourced, with an\n  as-of date.\n\n## 4. Lender, affiliate, and referral mentions\n\n- A lender, title, or escrow partner may be credited on a co-marketed piece, but the\n  piece cannot read as a mortgage advertisement, and any lender who pays for a share of\n  a co-marketed piece must pay their fair share of the actual cost. Cost splits are a\n  real-money compliance question — route to the broker, do not design the split here.\n- Do not print or imply any arrangement where referrals are exchanged for services or\n  marketing.\n- Any rate, APR, or payment figure shown triggers the lender's own advertising rules,\n  including the lender's NMLS ID and a full assumptions disclaimer. See `buydown-math`.\n\n## 5. Photos and copyright\n\n- Listing photos belong to whoever commissioned them, usually the listing brokerage or\n  the photographer, not to the agent sharing them. Confirm permission before reusing\n  another brokerage's photography.\n- Do not use MLS photos in marketing for a listing the agent does not represent without\n  written permission.\n- No stock photo of a house presented as the actual property.\n\n## Output\n\nReturn a verdict per item:\n\n| Item | Issue | Severity | Fix |\n|---|---|---|---|\n\nSeverity is `BLOCK` (cannot ship), `BROKER` (needs their broker's call), or `NOTE`\n(safe, but worth knowing).\n\n**If anything is BLOCK, say the piece is blocked in the first line of your reply.** Do not\nbury it under the rewrite. Then offer the compliant rewrite.\n\n## Chains from\n\nCalled by `listing-description`, `listing-flyer`, `listing-carousel`, `social-caption`,\n`buydown-math`, `listing-package`, `open-house-package`.\n\n---\n\n<!-- self-improvement-loop v1 -->\n\n## Self-improvement loop\n\nBefore ending a run of this skill, review the run:\n\n1. Did any step fail, stall, or need a workaround you had to invent?\n2. Did the user correct, reject, or rewrite something meaningful in the output?\n3. Did you discover something a future run would want to know (a path that moved, a\n   tool that replaced another, a preference they stated out loud)?\n\nIf yes to any, propose a specific edit to this SKILL.md in one or two lines and ask\nwhether to apply it. Propose only changes that would alter a future run's behavior --\nskip cosmetic rewording, and never propose more than two edits at once.\n\nDo not edit this file without their go-ahead. If they say no, drop it and do not re-raise\nthe same suggestion in a later run of the same session.\n", "path": "compliance-check/SKILL.md", "orchestrator": false, "calls": ["buydown-math", "listing-carousel", "listing-description", "listing-flyer", "listing-package", "open-house-package", "social-caption", "source-check"], "calledBy": ["agent-profile", "agent-voice", "buydown-math", "content-week", "home-anniversary", "listing-carousel", "listing-description", "listing-flyer", "listing-intake", "listing-package", "market-brief", "market-carousel", "open-house-flyer", "preflight", "social-caption"]}, {"id": "computer-revive", "folder": "computer-revive", "dept": "foundation", "deptLabel": "Foundation", "hue": 220, "description": "Measure what is actually eating RAM on the agent's own computer, explain it in plain English, and clean up only what they approve. Never anything with possibly-unsaved work, never a system process, never a startup item or system setting. Trigger on \"revive my computer\", \"my computer is slow\", \"check my RAM\", \"clean up processes\", \"why is my computer crawling\", or when the agent says their machine is lagging before a call or a showing. Works on Windows (PowerShell) and Mac (ps/Activity Monitor equivalents). Ends every run with one prevention habit, never a lecture.", "body": "# Computer Revive: measure, explain, ask, then clean\n\nAn agent's computer slows down the same way everyone's does: browser tabs pile up,\nbackground helper apps never fully close, something got left running from yesterday.\nThis skill runs the same five-step loop every time: measure, explain, classify, act\nonly on approval, re-measure. That is how a slow computer becomes a two-minute fix\ninstead of a reboot-and-hope.\n\n**This skill never kills anything without a green light, and it never touches anything\nthat isn't a running process.** It does not open Task Manager settings, does not\ndisable startup items, does not change power plans or system settings. Where a change\nlike that would help, it says so and lets the agent make it themselves.\n\n---\n\n## Step 1: Measure first\n\nNever guess, never act on a vibe of \"it feels slow.\" Pull real numbers before saying\nanything.\n\n**Windows (PowerShell):**\n```\nGet-CimInstance Win32_OperatingSystem | Select-Object TotalVisibleMemorySize, FreePhysicalMemory\nGet-Process | Sort-Object WorkingSet -Descending | Select-Object -First 15 Name, Id, @{N='RAM_MB';E={[math]::Round($_.WorkingSet/1MB,0)}}\n(Get-Process chrome -ErrorAction SilentlyContinue).Count\n```\n\n**Mac (ps / vm_stat):**\n```\nvm_stat\nps -A -o pid,rss,comm | sort -k2 -nr | head -15\nps -A | grep -c \"Google Chrome\"\n```\n\nRecord: total RAM, free RAM, the top 10-15 processes by memory with their size in MB,\nand a count of browser-related processes (each browser tab commonly runs as its own\nprocess, so a big tab count often explains a big number on its own).\n\n## Step 2: Report in plain English\n\nTranslate the numbers, don't dump them. Something like:\n\n> You've got 11.2 of 16 GB in use. The two biggest things eating it: Chrome (38 tab\n> processes, about 4.1 GB total) and Zoom, which looks like it's still running in the\n> background from your last call at about 900 MB. Everything else is small.\n\nName the top few hogs with sizes. Skip anything under roughly 150-200 MB unless the\nagent asks for the full list. A screenful of small helper processes doesn't help\nanyone decide anything.\n\n## Step 3: Classify before touching anything\n\nEvery process found in step 1 goes into exactly one bucket. Say which bucket each\nnamed item is in when you report it. Don't just list processes and ask \"which ones?\"\n\n**(a) Safe to close on your own judgment, no confirmation needed per item**\n- Duplicate or orphaned helper processes (a second copy of something the user only\n  runs once, an update-checker background task, a crashed process still holding memory)\n- Extra tabs' worth of a browser's per-tab processes, but only the count/footprint,\n  never the browser window itself (see (b))\n- An app the agent has already told you in this conversation they're done with\n\n**(b) Ask first, every time, no exceptions**\n- Anything that could hold unsaved work: a document editor, a code editor, a design\n  tool, a spreadsheet, a browser window itself (as opposed to background tab bloat)\n- Anything the agent hasn't explicitly said they're finished with\n- When in doubt, this bucket. A five-second question is cheaper than a lost draft.\n\n**(c) Never touch, full stop**\n- Operating system processes and anything the OS itself depends on to keep running\n  (on Windows: anything the Task Manager labels as a Windows process or system\n  service; on Mac: anything owned by root or shown as an Apple system process)\n- Security/antivirus software\n- The rule here is: **if you don't recognize what an app does, or if closing it\n  could affect anything other than freeing memory, leave it alone and name it as\n  \"not touching this, unsure what it does\" rather than guessing.** Never rely on an\n  exhaustive list of \"known safe\" system names, since new machines have different ones.\n\n## Step 4: Kill only what's approved, then re-measure\n\n- List out exactly what you're about to close, bucket by bucket, and wait for a plain\n  yes before closing anything in bucket (a) or (b). Bucket (a) items can be proposed\n  together as a batch (\"okay to close these six?\") rather than one at a time.\n  Bucket (b) items need an explicit answer per item or per named group. \"Close Zoom\n  too?\" is a fair batch question, but never fold a possibly-unsaved app into a batch\n  the agent didn't specifically see named.\n- Close only what was approved.\n- Re-run the exact same measurement from Step 1.\n- Report before and after, plainly: \"You went from 4.8 GB free to 9.1 GB free. Chrome's\n  tab count dropped from 38 to 12.\"\n\nIf nothing was approved, that's a fine outcome. Report the numbers and stop. This\nskill's job is to make an informed decision easy, not to force a cleanup.\n\n## Step 5: One prevention habit, not a lecture\n\nEnd every run with exactly one forward-looking habit, picked to fit what you actually\nsaw, not a generic checklist. Examples of the kind of thing to say (pick the one that\nmatches what caused today's slowdown, don't recite all of them):\n\n- \"Chrome was most of this. Closing and reopening it once a day keeps tab processes\n  from compounding.\"\n- \"Zoom stayed open from your last call. Worth closing it right after instead of just\n  minimizing.\"\n- \"A weekly restart clears out anything like this that quietly stacks up.\"\n\nOne sentence. Never a bulleted list of five habits after a two-minute cleanup.\n\n---\n\n## Hard rails\n\n- **Never kill anything in bucket (b) without an explicit yes for that item.** A vague\n  \"sure, clean it up\" from the agent covers bucket (a) only. Bucket (b) items need\n  their own answer.\n- **Never disable a startup item, never change a system or power setting.** If one\n  would help (e.g., \"you have twelve apps set to launch at login\"), say so as a\n  suggestion and stop there. The agent does that themselves in their own settings.\n- **8 GB of RAM or less is a hardware ceiling, say so plainly.** On a machine that\n  small, a cleanup buys a few minutes of headroom, not a fix. Tell the agent that\n  directly rather than running the same steps and implying it solved the problem,\n  something like: \"This will help for a bit, but 8 GB is genuinely tight for what\n  you're running day to day. The real fix here is more RAM, not another cleanup.\"\n- **Never claim a number you didn't just measure.** If a measurement command fails\n  (permissions, an unsupported OS version), say so and try the fallback for that\n  platform rather than estimating.\n\n## Chains from / into\n\nStandalone. Runs entirely on the agent's own machine, reads nothing from and writes\nnothing to any other skill's files, and needs no network access to do its job.\n\n---\n\n<!-- self-improvement-loop v1 -->\n\n## Self-improvement loop\n\nBefore ending a run of this skill, review the run:\n\n1. Did any step fail, stall, or need a workaround you had to invent?\n2. Did the user correct, reject, or rewrite something meaningful in the output?\n3. Did you discover something a future run would want to know (a path that moved, a\n   tool that replaced another, a preference they stated out loud)?\n\nIf yes to any, propose a specific edit to this SKILL.md in one or two lines and ask\nwhether to apply it. Propose only changes that would alter a future run's behavior --\nskip cosmetic rewording, and never propose more than two edits at once.\n\nDo not edit this file without their go-ahead. If they say no, drop it and do not re-raise\nthe same suggestion in a later run of the same session.\n", "path": "computer-revive/SKILL.md", "orchestrator": false, "calls": [], "calledBy": ["owners-manual", "preflight"]}, {"id": "contact-import", "folder": "contact-import", "dept": "foundation", "deptLabel": "Foundation", "hue": 220, "description": "Import an agent's database from a CRM export, phone contacts (.vcf), spreadsheet, or email export into one normalized contacts file that every sphere and follow-up skill reads. Deduplicates, normalizes phone numbers and names, records source and consent tier, and flags what is missing. Trigger on \"import my contacts\", \"load my database\", \"here's my CRM export\", \"upload my sphere\", \"my contacts csv\", \"vcf\", or on the first run of any sphere skill when `data/contacts.csv` does not exist. Do NOT trigger for adding a single new lead — that is lead-intake.", "body": "# Contact Import — one clean database, one time\n\nEvery sphere, birthday, and follow-up skill in this library reads `data/contacts.csv`.\nThis skill builds it and keeps it clean.\n\n---\n\n## Inputs it handles\n\n- CRM export (CSV) from any platform — column names vary wildly, map them, do not assume\n- Phone contacts as `.vcf` / vCard\n- A spreadsheet the agent keeps by hand\n- Gmail / Outlook contacts export\n- A past-client list from their transaction management system\n\nAsk which they have. Take all of them — merging is the point.\n\n## The normalized schema\n\nWrite `data/contacts.csv` with exactly these columns, in this order:\n\n```\ncontact_id,first_name,last_name,phone,email,relationship,source,consent_tier,\ncity,birthday,close_date,property_address,last_touch,tags,notes\n```\n\n- `contact_id` — stable slug, `firstname-lastname-4digits`. Never renumber on re-import.\n- `phone` — E.164 where possible (`+15555550123`). Strip formatting. Keep only one\n  primary; extras go in `notes`.\n- `relationship` — one of `past-client`, `active-client`, `lead`, `sphere`, `agent`,\n  `vendor`, `personal`, `unknown`\n- `source` — where this contact came from and the export's file date. This matters.\n- `consent_tier` — see below\n- `birthday` — `MM-DD` or `YYYY-MM-DD`. Blank if unknown, never guessed.\n- `close_date` — for past clients, the closing date, for home anniversaries\n- `last_touch` — date of last real contact, blank if unknown\n\n## Consent tiers (do this at import, not later)\n\nTexting and emailing rules depend on how the relationship started. Record it now while\nthe source is in front of you.\n\n- `express-written` — they signed up, opted in, or checked a box. Written record exists.\n- `existing-relationship` — a past client or an active client. There is a real prior\n  business relationship.\n- `personal` — friends and family, someone the agent genuinely knows.\n- `unknown` — scraped, purchased, harvested, or origin unclear.\n\n**Anything marked `unknown` is not a marketing list.** Do not include those contacts in\nany bulk send this library produces. Downstream skills filter them out automatically. If\nthe agent wants to reach them, that is a one-to-one, personally written, non-automated\nmessage, and it is their call and their compliance risk.\n\nAlso carry an `optout` tag. **An opt-out is permanent and applies across every channel and\nevery skill in this library.** Once tagged, that contact never appears in a send list\nagain, and no skill may remove the tag.\n\n## Deduplication\n\nMerge on, in priority order: phone match, then email match, then exact\nfirst+last+city match. On conflict, keep the record with the more recent `last_touch` and\nput the discarded values in `notes` rather than deleting them.\n\nReport the dedupe count. Agents are usually surprised by it and it builds trust.\n\n## The gaps report\n\nAfter import, tell the agent, in plain numbers:\n\n- Total contacts, and how many after dedupe\n- How many have a phone, how many have an email, how many have both\n- How many have a birthday (usually very few — this is the biggest miss)\n- How many past clients have a `close_date` (drives home anniversaries)\n- How many are `unknown` consent tier and therefore excluded from sends\n- Which fields would unlock the most value if filled in\n\nThen offer one concrete next step, not five. Usually: \"your birthdays are the biggest gap\n— want me to set up a way to fill them in over time?\"\n\n## Privacy\n\nThis file is the agent's client database. It lives on the agent's machine, in the agent's\nworking folder.\n\n- Do not upload it anywhere, do not paste its contents into a third-party tool, and do\n  not include real names or numbers in any example, screenshot, or shared output.\n- If a working copy was made during import, delete it when the import is done and say so.\n- `data/` should be listed in the working folder's `.gitignore`. Check that it is; if the\n  folder is a git repo and `data/` is not ignored, fix it before writing the file.\n\n## Chains into\n\n`sphere-audit`, `birthday-watch`, `home-anniversary`, `followup-queue`, `sphere-daily`.\n\n---\n\n<!-- self-improvement-loop v1 -->\n\n## Self-improvement loop\n\nBefore ending a run of this skill, review the run:\n\n1. Did any step fail, stall, or need a workaround you had to invent?\n2. Did the user correct, reject, or rewrite something meaningful in the output?\n3. Did you discover something a future run would want to know (a path that moved, a\n   tool that replaced another, a preference they stated out loud)?\n\nIf yes to any, propose a specific edit to this SKILL.md in one or two lines and ask\nwhether to apply it. Propose only changes that would alter a future run's behavior --\nskip cosmetic rewording, and never propose more than two edits at once.\n\nDo not edit this file without their go-ahead. If they say no, drop it and do not re-raise\nthe same suggestion in a later run of the same session.\n", "path": "contact-import/SKILL.md", "orchestrator": false, "calls": ["birthday-watch", "followup-queue", "home-anniversary", "sphere-audit", "sphere-daily"], "calledBy": ["birthday-watch", "home-anniversary", "lead-intake", "meeting-brief", "open-house-followup", "open-house-signin", "owners-manual", "preflight", "social-scan", "sphere-audit", "voice-command", "wire-a-tool"]}, {"id": "content-week", "folder": "content-week", "dept": "content", "deptLabel": "Content", "hue": 48, "description": "Orchestrator. Plan and produce one week of social content from what is already happening in the agent's business — the listings they have, the market data that just refreshed, the open house on Saturday — rather than from invented topics. Trigger on \"plan my content\", \"what should I post this week\", \"content calendar\", \"I need posts\", \"weekly content\". Use the individual skills when the agent wants one specific post.", "body": "# Content Week — plan from the real business, not from a topic list\n\nThe failure mode this skill exists to prevent: producing content about real estate in\ngeneral, when the agent's actual listings, actual open house, and actual market data are\nsitting right there unused.\n\n**Start with what exists.** Only invent a topic when the real inventory is genuinely\nempty.\n\n---\n\n## Step 1 — Take inventory before planning anything\n\nRead, in this order:\n\n- `listings/` — active listings, upcoming open houses, anything recently sold or pending\n- `data/market/` — is the current month's data pulled? Has anything moved?\n- `records/sent-log.md` and prior weeks' plans — what already went out, so nothing repeats\n- The agent's calendar for the week, if they will share it\n\nThen ask them two questions and nothing more: **what is happening this week, and what\nhave people been asking you lately.** The second question produces the best content in\nthis whole library, because it is a real question from a real person.\n\n## Step 2 — The week\n\nThree to five posts. **Not seven.** An agent who commits to five and delivers five beats\none who commits to seven and stops in week two. Say so if they push for more.\n\nA workable default shape:\n\n| Slot | Type | Built by |\n|---|---|---|\n| 1 | A property — listing, open house, or just sold | `listing-carousel` |\n| 2 | The market numbers | `market-carousel` |\n| 3 | An answer to a real question they were asked | written here |\n| 4 | Something human — the agent, the work, the week | written here |\n| 5 | The buydown or process explainer, if a listing supports it | `listing-carousel` B |\n\n**Spacing rules:** never two property posts back to back, never the listing carousel and\nits buydown carousel on the same day, and put the human post mid-week where the feed is\nleast crowded.\n\n## Step 3 — Produce\n\nFor each slot, call the skill that owns it. Do not rebuild carousel logic here.\n\n- Property posts → `listing-carousel` → `carousel-render`\n- Market posts → `market-carousel` → `carousel-render`\n- Every post → `social-caption`\n- Everything → `compliance-check` and `source-check` before delivery\n\n## Step 4 — Deliver a calendar, not a pile\n\n| Day | Time | Post | Assets | Caption | Tags |\n|---|---|---|---|---|---|\n\nPlus, for each post that involves another agent's listing: the credit and tag block, and a\nnote to invite them as a collaborator. **That block is the distribution**, not a courtesy.\n\n## Honest guidance to give the agent, once\n\n- **Their own follower graph is probably not who they want.** Most agents' followings were\n  built years ago around something else and do not engage with real estate. The reliable\n  route to the right audience is tagging and crediting other agents and brokerages on\n  property posts, which borrows audiences that are dense with exactly the right people.\n- **Consistency beats production value.** Three modest posts a week for a year beats\n  twelve polished ones in January.\n- **Video outperforms static almost everywhere** — but a static carousel that ships beats\n  a video that does not. Build what they will actually do.\n- If they have posted nothing for two months, do not plan twenty posts. Plan three, for\n  one week, and see if they run.\n\n## Track it\n\nAppend the week's plan to `content/plan-<YYYY-Www>.md`. Once a month, pull the actual\nresults the agent can see — reach, saves, shares — and report which formats worked. Only\nnumbers they can point at in their own analytics; do not estimate performance.\n\n---\n\n<!-- self-improvement-loop v1 -->\n\n## Self-improvement loop\n\nBefore ending a run of this skill, review the run:\n\n1. Did any step fail, stall, or need a workaround you had to invent?\n2. Did the user correct, reject, or rewrite something meaningful in the output?\n3. Did you discover something a future run would want to know (a path that moved, a\n   tool that replaced another, a preference they stated out loud)?\n\nIf yes to any, propose a specific edit to this SKILL.md in one or two lines and ask\nwhether to apply it. Propose only changes that would alter a future run's behavior --\nskip cosmetic rewording, and never propose more than two edits at once.\n\nDo not edit this file without their go-ahead. If they say no, drop it and do not re-raise\nthe same suggestion in a later run of the same session.\n", "path": "content-week/SKILL.md", "orchestrator": false, "calls": ["carousel-render", "compliance-check", "listing-carousel", "market-carousel", "social-caption", "source-check"], "calledBy": ["preflight", "social-audit"]}, {"id": "followup-queue", "folder": "followup-queue", "dept": "pipeline", "deptLabel": "Pipeline", "hue": 192, "description": "Work out who is due for a follow-up touch today across every active sequence and every open pipeline item, draft each message personalized against that contact's real record, and hold the batch for approval. Trigger on \"who's due today\", \"run my follow-ups\", \"follow-up queue\", \"what did I forget\", \"who's falling through the cracks\", or as part of sphere-daily. Do NOT trigger to design a cadence — that is followup-sequence.", "body": "# Follow-Up Queue — the thing that catches what falls through\n\nReads `data/pipeline.csv`, `sequences/*.md`, `data/contacts.csv`,\n`records/sent-log.md`, `profile/VOICE.md`.\n\n---\n\n## Step zero — run revocation-watch first\n\nBefore building anything, run the `revocation-watch` scan over inbound replies since\nthe last batch. A queue drafted before the opt-out scan is drafted against a stale\nlist. Anyone it tags is out of today's queue and every future one.\n\n## Build the queue\n\nFor every row in `data/pipeline.csv`:\n\n1. Is `next_action_date` today or earlier? `next_action_date` must be `YYYY-MM-DD`. If a\n   row's value is blank or in any other format, do not guess — skip that row, add it to a\n   \"needs fixing\" count reported to the agent, and do not include it in today's queue\n   until the format is corrected. Otherwise: if the date is earlier than today, it is\n   **overdue** — flag it as such and put it above everything on time. Overdue items are\n   where deals die.\n2. Is there an active sequence on this contact, and which touch number is next?\n3. **Has the contact replied since the last touch?** If yes, the sequence stops and this\n   becomes a human conversation, not a queued touch. Say so and move it to the top.\n4. Is the contact tagged `optout: all`? Remove them entirely, permanently. If tagged\n   `optout: text` or `optout: call` and this touch would use that exact channel, remove\n   it for that channel only — re-route the touch to a channel the contact has not\n   revoked, or exclude if no channel remains.\n5. Is the consent tier below what the sequence requires? Exclude and report the count.\n\n## Rank and cap\n\n**Cap the daily queue at 10 items.** More than that and the agent stops reading it, which\nmeans the whole system produces nothing.\n\nRank:\n\n1. **Replies waiting on the agent.** Someone who answered and is being ignored is the most\n   expensive item in the queue.\n2. Overdue, by how overdue\n3. Active clients mid-transaction\n4. This-month leads\n5. Everything else\n\n**Tie within a tier:** break ties by how overdue the item is (most overdue first); if\n`next_action_date` is identical, break by longest time since `last_touch` in\n`data/contacts.csv`; if that is also bl
