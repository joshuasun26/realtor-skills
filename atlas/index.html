-pull` produces nothing and the whole\npackage stops. **This is correct behavior.** Do not substitute aggregator data, do not\nreuse last month's numbers, and do not write a \"qualitative\" brief around the gap.\n\nReport which areas pulled and which did not, and what you tried.\n\n## Timing\n\nRun in the **first week of the month**, for the month that just closed. Sales that close\nlate in a month take a few days to post in the MLS, so pulling on the 1st undercounts.\nWaiting until the 5th or 6th gives a cleaner number, and the brief is still timely.\n\nUse the **same area definitions** every month, read from the prior month's data file.\nChanging the geography silently makes every trend claim false.\n\n## Scale\n\nAsk which areas up front. One area is a 20-minute run; twelve areas is a batch and needs\nthe same definition file reused and the same template re-rendered rather than redesigned.\n\nIf the agent wants more than about six areas, tell them plainly: six well-sourced areas\nthey can speak to beats twelve they cannot. Then build what they ask for.\n\n## Step 7 — staging, not sending\n\nProduce, and hold:\n\n- The email to their sphere (brief, email version), with the recipient list filtered by\n  `consent_tier` and every `optout` removed\n- The three-line text version for the contacts who prefer text\n- The carousel and caption ready to post\n\n**Nothing sends and nothing posts without the agent's explicit go in this session, for\nthis specific batch.** Show them the recipient counts, the subject, and the copy. Approval\non this month's send is not approval on next month's.\n\n## The handoff\n\nReturn:\n\n- File paths grouped by destination\n- The counts: contacts on the email list after filtering, contacts excluded and why\n- Anything blocked, in one line each\n- The single most interesting thing in this month's data, in plain language — the agent\n  will use that line in conversation all month, and it is the real deliverable\n\n## Archive\n\nNever overwrite a prior month. `data/market/` accumulating twelve files is what makes\nnext year's year-over-year claims sourceable instead of asserted.\n\n---\n\n<!-- self-improvement-loop v1 -->\n\n## Self-improvement loop\n\nBefore ending a run of this skill, review the run:\n\n1. Did any step fail, stall, or need a workaround you had to invent?\n2. Did the user correct, reject, or rewrite something meaningful in the output?\n3. Did you discover something a future run would want to know (a path that moved, a\n   tool that replaced another, a preference they stated out loud)?\n\nIf yes to any, propose a specific edit to this SKILL.md in one or two lines and ask\nwhether to apply it. Propose only changes that would alter a future run's behavior --\nskip cosmetic rewording, and never propose more than two edits at once.\n\nDo not edit this file without their go-ahead. If they say no, drop it and do not re-raise\nthe same suggestion in a later run of the same session.\n", "path": "market-update-package/SKILL.md", "orchestrator": true, "calls": ["market-pull"], "calledBy": ["agent-profile", "market-brief", "market-carousel", "market-pull", "preflight", "social-caption", "source-check"]}, {"id": "meeting-brief", "folder": "meeting-brief", "dept": "pipeline", "deptLabel": "Pipeline", "hue": 192, "description": "Build a one-page brief before a listing appointment, buyer consultation, showing, or any meeting with a client or another agent — who they are, the history, the property, the MLS-sourced numbers, and the three questions to ask. Trigger on \"brief me on [name]\", \"I have a listing appointment\", \"prep me for this meeting\", \"who am I meeting\", \"before my 2 o'clock\", \"listing presentation prep\". Do NOT trigger for a written follow-up after the meeting — that is sphere-message.", "body": "# Meeting Brief — read it in the car\n\nThe whole value is that it is short enough to read in the five minutes before walking in.\nOne page. If it runs to three, it will not be read and it produced nothing.\n\nReads `data/contacts.csv`, `data/pipeline.csv`, `records/sent-log.md`,\n`data/market/`, and `listings/` if a property is involved.\n\n---\n\n## Ask first\n\nWhat kind of meeting, with whom, when, and where. A listing appointment, a buyer\nconsultation, a showing, and a coffee with another agent need different briefs, and\nproducing the wrong one wastes the run.\n\n## The brief\n\n**1. Who — three lines.** Name, how the agent knows them, and the single most important\npiece of context. Not a biography.\n\n**2. History — the last three touches.** What was sent, when, and what they replied. Pull\nfrom `records/sent-log.md`. This is the part agents most want and most often walk in\nwithout.\n\n**3. What they said they want**, in their own words if the record has them. Their words\nbeat any summary.\n\n**4. The property, if there is one.** Address, verified specs from `listing-intake` or the\nMLS, days on market, price history, and anything in the compliance notes the agent needs\nto know before standing in the room.\n\n**5. The numbers — MLS-sourced, dated.** For a listing appointment: recent comparable\nsales with addresses, close dates, and prices; current actives; median days to sell. Every\nfigure from `market-pull`, every one carrying its as-of date.\n\n**Never bring an aggregator estimate into a listing appointment.** The seller has already\nseen the aggregator's number, and the agent's entire credibility in that room rests on\nbeing the person with the real data. Bringing the same estimate back is the worst possible\noutcome. If MLS data cannot be pulled this session, say so plainly and say the appointment\nneeds it — do not fill the section with something softer.\n\n**6. Three questions to ask.** Real ones, specific to this person and this property. This\nsection makes the meeting go well more than any of the data does.\n\n**7. One thing to watch.** The likely objection, the thing they were unhappy about last\ntime, the competing agent, the timeline pressure. One, not five.\n\n## Rules\n\n- **Everything is sourced.** Every number cites where it came from and when. Run\n  `source-check`. An agent quoting a wrong number in a listing appointment loses the\n  listing on the spot.\n- **No valuation opinion in the brief.** Provide the comparables and let the agent form\n  the opinion. That is their license and their judgment.\n- **Nothing about the client's demographics, family composition, national origin,\n  religion, or anything protected.** Not in a private internal brief either — it has no\n  legitimate use, and a discoverable file containing it is a liability.\n- **Do not invent history.** If there is no record of prior contact, say \"no prior contact\n  recorded.\" That is useful information; a fabricated warm history is a disaster in the\n  room.\n- If the meeting is with another agent about a co-listing or a referral, include their\n  brokerage and anything the record holds about prior dealings, and nothing speculative.\n\n## Format\n\nOne page. Markdown, and a PDF if they want it on a phone. Bold the three or four things\nthat matter most so it survives a 90-second skim.\n\n## Chains from / into\n\nReads `lead-intake`, `market-pull`, `listing-intake`, `contact-import` output. Uses\n`source-check`. Feeds `sphere-message` for the follow-up afterward.\n\n---\n\n<!-- self-improvement-loop v1 -->\n\n## Self-improvement loop\n\nBefore ending a run of this skill, review the run:\n\n1. Did any step fail, stall, or need a workaround you had to invent?\n2. Did the user correct, reject, or rewrite something meaningful in the output?\n3. Did you discover something a future run would want to know (a path that moved, a\n   tool that replaced another, a preference they stated out loud)?\n\nIf yes to any, propose a specific edit to this SKILL.md in one or two lines and ask\nwhether to apply it. Propose only changes that would alter a future run's behavior --\nskip cosmetic rewording, and never propose more than two edits at once.\n\nDo not edit this file without their go-ahead. If they say no, drop it and do not re-raise\nthe same suggestion in a later run of the same session.\n", "path": "meeting-brief/SKILL.md", "orchestrator": false, "calls": ["contact-import", "lead-intake", "listing-intake", "market-pull", "source-check", "sphere-message"], "calledBy": ["lead-intake", "market-brief", "market-pull", "preflight"]}, {"id": "open-house-flyer", "folder": "open-house-flyer", "dept": "open-house", "deptLabel": "Open House", "hue": 152, "description": "Build the event flyer for a specific open house — the property, the day, date and time window, the QR code to the sign-in page, and the agent block — plus the matching directional sign copy and the neighbor invitation card. Trigger on \"open house flyer\", \"flyer for Saturday\", \"make the open house handout\", \"directional signs\", \"neighbor invite\", or as a step inside open-house-package. Do NOT trigger for a standard listing flyer with no event — that is listing-flyer.", "body": "# Open House Flyer — the event piece\n\nA listing flyer sells the house. An open house flyer sells **being there at 1pm on\nSaturday**, and then converts the visitor into a contact. Different job, different\nhierarchy.\n\nReads `listings/<slug>/LISTING.md`, `profile/AGENT.md`, and the QR target produced by\n`open-house-signin`.\n\n---\n\n## Hierarchy on the page\n\nThe order of prominence, top to bottom:\n\n1. **Hero photo** — full bleed across the top third\n2. **Day, date, and time window** — the largest type on the page after the address.\n   \"SATURDAY, MARCH 8 · 1–4 PM\". Spell the day out; nobody parses \"3/8\".\n3. **Address and city**\n4. **Price and the spec row** — beds / baths / interior sqft / lot sqft / year built\n5. **Three or four supporting photos**\n6. **Three to five sentences** built on the distinctive feature from `LISTING.md`\n7. **QR code** with a short human-readable URL beneath it, and one line of why to scan:\n   \"scan to sign in\" or \"scan for the full photo set\"\n8. **Agent block** — headshot, name, license number, phone, email, brokerage and logo,\n   Equal Housing Opportunity\n\nPrint production rules — 300 DPI, 0.25in bleed, 0.5in safe margin, export as PDF, CSS\nphysical units — are the same as `listing-flyer`. Follow that skill's production section\nrather than reinventing it here.\n\n## Also produce, in the same run\n\n**Directional sign copy.** Short. An arrow direction, \"OPEN HOUSE\", the day and time, and\nthe agent's name. Nothing else — people read these at 30 mph. Ask how many signs and\nwhich corners, and produce one per direction. Check the city's rules on sign placement and\nwhether the HOA permits them; some cities and most HOAs restrict both, and a confiscated\nsign is a wasted Saturday.\n\n**Neighbor invitation card.** Half-page or postcard sized. The property, the day and time,\nand a genuine invitation to come see the inside. **No valuation hook** — nothing that\nimplies what their own home is worth or promises a number. Describe the event.\n\n**A \"just sold / just listed\" version** of the same layout, for reuse afterward, so the\nagent gets a second piece from one build.\n\n## Before it ships\n\n- **Scan the QR with a real phone from the printed proof.** Not from the screen. A QR\n  that fails at the door wastes the entire capture strategy for that day.\n- `compliance-check` on all copy, including the neighbor card.\n- `source-check` on the specs and the price.\n- Confirm the date and time are correct against the agent's calendar. A flyer with the\n  wrong Saturday on it is the most expensive typo in this library.\n\n## Output\n\n`listings/<slug>/open-house-<date>/` containing `flyer.pdf`, `signs.pdf`,\n`neighbor-card.pdf`, and the source HTML for each.\n\n## Chains from / into\n\nCalled by `open-house-package`. Needs `open-house-signin` to have run first (for the QR\ntarget). Reads `listing-intake`. Shares production rules with `listing-flyer`.\n\n---\n\n<!-- self-improvement-loop v1 -->\n\n## Self-improvement loop\n\nBefore ending a run of this skill, review the run:\n\n1. Did any step fail, stall, or need a workaround you had to invent?\n2. Did the user correct, reject, or rewrite something meaningful in the output?\n3. Did you discover something a future run would want to know (a path that moved, a\n   tool that replaced another, a preference they stated out loud)?\n\nIf yes to any, propose a specific edit to this SKILL.md in one or two lines and ask\nwhether to apply it. Propose only changes that would alter a future run's behavior --\nskip cosmetic rewording, and never propose more than two edits at once.\n\nDo not edit this file without their go-ahead. If they say no, drop it and do not re-raise\nthe same suggestion in a later run of the same session.\n", "path": "open-house-flyer/SKILL.md", "orchestrator": false, "calls": ["compliance-check", "listing-flyer", "listing-intake", "open-house-package", "open-house-signin", "source-check"], "calledBy": ["agent-profile", "listing-intake", "open-house-package", "open-house-signin", "preflight"]}, {"id": "open-house-followup", "folder": "open-house-followup", "dept": "open-house", "deptLabel": "Open House", "hue": 152, "description": "Turn an open house sign-in list into individually drafted follow-up messages, segmented by what each visitor said they were, on a timed cadence — and hold every message for the agent's approval before anything sends. Trigger on \"follow up on the open house\", \"who came Sunday\", \"draft the open house follow-ups\", \"what do I send the people who came\", or as the final step of open-house-package. Do NOT trigger for general sphere touches — that is followup-queue.", "body": "# Open House Follow-Up — the 48 hours that decide whether the open house was worth it\n\nMost agents hold the open house and then send nothing, or send one identical blast. The\nfollow-up is where the open house actually pays.\n\nReads `data/open-house-<slug>-<date>.csv`, `listings/<slug>/LISTING.md`,\n`profile/AGENT.md`, and `profile/VOICE.md`.\n\n---\n\n## Segment first\n\nSplit the sign-in list by what each visitor told you:\n\n| They said | What they are | Cadence |\n|---|---|---|\n| Actively looking | The reason to hold open houses | Same day, then day 3, then weekly |\n| Just looking | Long horizon, real | Same day, then day 7, then monthly |\n| Working with an agent | Do not poach | ONE courteous message, then stop |\n| Neighbor | Future seller, best source | Same day, then at the sale |\n\n**The \"working with an agent\" rule is a hard line.** Send one message thanking them for\ncoming and nothing else. Do not add them to a nurture sequence. Soliciting a client under\nan exclusive representation agreement is an ethics complaint, and in most markets the\nother agent will find out.\n\n## Consent filter (runs before anything is drafted)\n\nDrop every row whose `consent_tier` is `unknown` from all automated and bulk messaging.\nThey can be called or written to one at a time by the agent personally, and that is the\nagent's judgment call — but this library will not queue them.\n\nDrop every row tagged `optout`, permanently, across all channels.\n\nSay the counts out loud: \"42 signed in, 31 consented, 4 already working with an agent,\n7 excluded for no consent.\"\n\n## Draft each message individually\n\nNot a template with a merge field. The whole advantage here is that each visitor had a\ndifferent conversation.\n\nEvery message should carry **one specific thing** — what they said about the kitchen,\nthat they mentioned a commute, that they asked about the schools district assignment,\nthat they were the neighbor two doors down. Ask the agent for their notes from the day. If\nthey have none, ask for the three visitors they remember and draft those individually,\nand keep the rest short and honest rather than fake-personal.\n\n**Message 1 (same day, evening):** thank them, one specific reference, one useful thing\n(the listing link, the flyer PDF, the answer to a question they asked), one low-pressure\nopen. Short. Two or three sentences.\n\n**Message 2 (day 3):** the actual value. What sold, what came on, what the property did.\nThis is where `market-brief` output gets attached — MLS-sourced, dated.\n\n**Message 3 (day 7+):** the ask, once. A call, a showing, a buyer consultation. Then move\nthem to the long cadence in `followup-sequence`.\n\n**Voice:** run `agent-voice` on every draft. Scan for the banned words before delivering.\n\n## The approval gate — this is not optional\n\n**Nothing sends automatically. Ever.**\n\nPresent the batch as a numbered list: recipient, channel, and the full message copy for\neach one, in a file the agent can read and edit, not buried in chat scrollback. Then\nwait.\n\n- The agent approves the batch, or specific numbers, in this session.\n- Approval on one batch is never approval on the next batch, the next wave, or tomorrow.\n  New batch, new ask.\n- \"Looks good\", silence, or ambiguity is not approval. If you are not certain, ask in one\n  line and wait.\n- After sending, say plainly what went and what did not. Count them. Name anything that\n  failed. Never report a send as complete when a call errored.\n\n## Log it\n\nWrite every sent message to `records/sent-log.md` with date, recipient, channel, and the\ncopy. Update `last_touch` in `data/contacts.csv`. Merge new consented visitors into the\ncontacts file via `contact-import` so they flow into the sphere skills from then on.\n\n## Chains from / into\n\nCalled by `open-house-package`. Reads `open-house-signin` output. Uses `agent-voice`.\nHands long-term contacts to `followup-sequence` and `sphere-daily`.\n\n---\n\n<!-- self-improvement-loop v1 -->\n\n## Self-improvement loop\n\nBefore ending a run of this skill, review the run:\n\n1. Did any step fail, stall, or need a workaround you had to invent?\n2. Did the user correct, reject, or rewrite something meaningful in the output?\n3. Did you discover something a future run would want to know (a path that moved, a\n   tool that replaced another, a preference they stated out loud)?\n\nIf yes to any, propose a specific edit to this SKILL.md in one or two lines and ask\nwhether to apply it. Propose only changes that would alter a future run's behavior --\nskip cosmetic rewording, and never propose more than two edits at once.\n\nDo not edit this file without their go-ahead. If they say no, drop it and do not re-raise\nthe same suggestion in a later run of the same session.\n", "path": "open-house-followup/SKILL.md", "orchestrator": false, "calls": ["agent-voice", "contact-import", "followup-sequence", "market-brief", "open-house-package", "open-house-signin", "sphere-daily"], "calledBy": ["agent-profile", "agent-voice", "followup-sequence", "ghl-setup", "market-brief", "market-pull", "open-house-package", "open-house-signin", "sphere-message"]}, {"id": "open-house-package", "folder": "open-house-package", "dept": "open-house", "deptLabel": "Open House", "hue": 152, "description": "Orchestrator. Produces everything one open house needs, on the right timeline — event flyer with QR, digital sign-in page, social carousel and captions, neighbor invitation, day-of checklist, and the segmented follow-up drafts afterward — by calling the individual skills in order. Trigger on \"open house Saturday\", \"I'm holding [address] open\", \"open house package\", \"everything for the open house\", \"set up my open house\". Use the individual skills when the agent wants only one piece.", "body": "# Open House Package — the orchestrator\n\nAn open house is a dated event, so this orchestrator is built around a countdown rather\nthan a checklist. Ask for the date and time window first; everything else schedules off\nit.\n\n**Every step is its own skill and runs alone.** An agent who only needs the QR page runs\n`open-house-signin`.\n\n---\n\n## The chain\n\n```\nopen-house-package\n├─ 0. agent-profile           (only if profile/AGENT.md is missing)\n├─ 1. listing-intake           → listings/<slug>/LISTING.md  (skip if it exists)\n├─ 2. open-house-signin        → sign-in page + QR  (do this FIRST, the flyer needs the QR)\n├─ 3. open-house-flyer         → event flyer PDF with the QR embedded\n├─ 4. listing-carousel (A)     → the promo carousel\n├─ 5. buydown-math             → payment scenarios          [may BLOCK]\n├─ 6. listing-carousel (B)     → buydown carousel           [skipped if 5 blocked]\n├─ 7. social-caption × N       → captions for each post\n├─ 8. compliance-check + source-check   → gates\n├─ 9. day-of checklist         → produced here\n└─ 10. open-house-followup     → AFTER the event, from the sign-in data\n```\n\nStep 2 runs before step 3. The flyer embeds the QR, and building the flyer first means\nrebuilding it.\n\n## The countdown\n\n| When | What | Skill |\n|---|---|---|\n| T-7 days | Sign-in page live, QR tested on a real phone | `open-house-signin` |\n| T-6 days | Flyers printed. Order more than you think. | `open-house-flyer` |\n| T-4 days | Listing carousel posts | `listing-carousel` A |\n| T-3 days | Buydown carousel posts | `listing-carousel` B |\n| T-2 days | Neighbor invitation delivered | below |\n| T-1 day | Day-of checklist reviewed, signs and batteries checked | below |\n| Day of | Run it | — |\n| T+6 hours | Message 1 to everyone who signed in | `open-house-followup` |\n| T+3 days | Message 2 | `open-house-followup` |\n| T+7 days | Message 3, then long cadence | `followup-sequence` |\n\n**Post the listing carousel and the buydown carousel on different days.** They compete.\n\n## The neighbor invitation\n\nThe highest-value and most-skipped piece. Neighbors are the future sellers on that street,\nand they come to open houses to see what their own home is worth.\n\nProduce a short printed invitation for the surrounding homes — the property, the day and\ntime, and a genuine \"come see what your neighbor's place looks like inside.\" No valuation\nclaim, no \"find out what your home is worth\" hook that implies a number.\n\nCheck the agent's state and local rules on unaddressed mail drops and do-not-solicit\nlists before suggesting a walk. Where solicitation restrictions apply, this is a hand\ndelivery to doors, not a mailer, and the agent decides.\n\n## Day-of checklist (produce this, agents actually use it)\n\nSigns and directional arrows with the count needed. Sign-in QR card by the door plus a\npaper backup. Printed flyers, plus the buydown flyer if it exists. Business cards. Phone\ncharger. Something to write notes on — **the notes from the day are what make the\nfollow-up worth anything**, and they are always the thing that gets skipped. Lights on,\nblinds open, thermostat set, valuables and medications secured, pets handled.\n\nOne line to say to every visitor: ask what brought them by. That answer is the whole\nsegment field on the sign-in.\n\n## After\n\nDo not consider this run complete when the flyers are printed. Set the expectation\nexplicitly: **the follow-up is the deliverable, the open house is the event.** Tell the\nagent when to come back and run step 10, and what to bring (their notes from the day).\n\n---\n\n<!-- self-improvement-loop v1 -->\n\n## Self-improvement loop\n\nBefore ending a run of this skill, review the run:\n\n1. Did any step fail, stall, or need a workaround you had to invent?\n2. Did the user correct, reject, or rewrite something meaningful in the output?\n3. Did you discover something a future run would want to know (a path that moved, a\n   tool that replaced another, a preference they stated out loud)?\n\nIf yes to any, propose a specific edit to this SKILL.md in one or two lines and ask\nwhether to apply it. Propose only changes that would alter a future run's behavior --\nskip cosmetic rewording, and never propose more than two edits at once.\n\nDo not edit this file without their go-ahead. If they say no, drop it and do not re-raise\nthe same suggestion in a later run of the same session.\n", "path": "open-house-package/SKILL.md", "orchestrator": true, "calls": ["followup-sequence", "listing-carousel", "open-house-flyer", "open-house-followup", "open-house-signin"], "calledBy": ["agent-profile", "compliance-check", "listing-carousel", "listing-flyer", "listing-package", "open-house-flyer", "open-house-followup", "open-house-signin", "preflight", "social-caption", "source-check"]}, {"id": "open-house-signin", "folder": "open-house-signin", "dept": "open-house", "deptLabel": "Open House", "hue": 152, "description": "Build the digital open house sign-in page and its QR code — a single self-contained HTML page in the agent's brand that captures name, phone, email, and buyer status on a visitor's phone, with the consent language that makes later follow-up legitimate. Trigger on \"sign-in sheet\", \"QR code for the open house\", \"digital sign in\", \"capture page\", \"how do I collect visitor info\", or as a step inside open-house-package. Do NOT trigger for a general lead form on the agent's website.", "body": "# Open House Sign-In — capture that holds up later\n\nThe paper clipboard loses half the visitors and produces handwriting nobody can read. A\nQR code on the flyer and a card by the door converts better and produces clean data.\n\nThe part most agents get wrong is the consent language, and that is the part that decides\nwhether the follow-up sequence you build later is legitimate or a problem.\n\nReads `listings/<slug>/LISTING.md` and `profile/AGENT.md`.\n\n---\n\n## The page\n\n**One self-contained HTML file.** All CSS inline, no external fonts, no CDN scripts, no\ntracking pixels. It has to load instantly on a weak cell signal in someone's driveway,\nwhich is exactly where it will be used.\n\nLayout, in order:\n\n1. Property hero photo and the address. The visitor should recognize where they are.\n2. **Four fields, and only four:** first and last name, mobile phone, email, and one\n   radio group: *just looking / actively looking / working with an agent / neighbor*.\n   Every additional field costs completions. Resist adding more.\n3. The consent block (below), as visible text with a checkbox — not buried in a link.\n4. One submit button with a large tap target.\n5. A short confirmation state after submit, with the agent's name and contact.\n6. Footer: agent name, license number, brokerage, Equal Housing Opportunity.\n\n**Mobile first.** 16px minimum input font size, or iOS zooms the page on focus. Tap\ntargets at least 44px tall. Test at 375px wide.\n\n## The consent block (this is the whole point)\n\nWritten as plain text the visitor actually reads, with an **unchecked** box:\n\n> I'd like [Agent Name] of [Brokerage] to follow up with me about this property and\n> similar homes, by text, call, or email. I can stop at any time by replying STOP, or\n> just by telling [Agent Name] to stop.\n\n(The \"or just by telling me\" clause is load-bearing: under 47 CFR 64.1200, a consumer\nmay revoke by ANY reasonable method, and naming STOP as the only way is itself a\nviolation. The revocation-watch skill enforces the honor side.)\n\nRules that are not optional:\n\n- **The box starts unchecked.** A pre-checked box is not consent.\n- **No pre-checked box, no dark pattern, no \"by submitting you agree\" buried in fine\n  print.** If a visitor did not affirmatively opt in, they go into the database as\n  consent tier `existing-relationship` at best, and they do not go into any automated\n  text or bulk email sequence.\n- Automated or bulk texting to a mobile number has its own legal rules, and they change.\n  Tell the agent plainly: **the written consent record is what protects them**, and they\n  should have their broker confirm the current requirements in their state. Do not state\n  a specific statute or a specific rule as settled law in this skill — say it needs their\n  broker's confirmation.\n- Record where the submit goes. If the agent has a CRM, post there. If not, the page\n  writes to a local CSV and you tell them exactly where the file is.\n\n## Where the data goes\n\nOutput rows into `data/open-house-<slug>-<date>.csv` with columns matching the\n`contact-import` schema, including `source` (`open house <address> <date>`) and\n`consent_tier` (`express-written` only if the box was checked, otherwise `unknown`).\n\nThat file is the input to `open-house-followup`. Contacts marked `unknown` are excluded\nfrom any automated send by every downstream skill, automatically.\n\n## The QR code\n\n- Generate the QR pointing at wherever the page is actually reachable — a hosted URL if\n  the agent has a site, or a local network address if the page runs on a laptop at the\n  house. **A QR pointing at a `file://` path does not work from a visitor's phone.** If\n  there is no hosting, say so and produce a paper fallback instead of shipping a dead QR.\n- Minimum printed size 1 inch square; 1.5 inches is safer on a flyer.\n- Quiet zone: leave at least four modules of blank margin around it. QR codes fail most\n  often because someone put a border right against them.\n- Put a short human-readable URL under the code, for people who will not scan.\n- **Scan the printed QR with an actual phone before the open house.** Every time. Do not\n  assume.\n\n## Fallback\n\nBring a paper sheet too. Some visitors will not scan anything, and the two-minute\nconversation while someone writes their name down is not worthless.\n\n## Chains from / into\n\nCalled by `open-house-package`. Feeds `open-house-flyer` (the QR target) and\n`open-house-followup` (the captured list).\n\n---\n\n<!-- self-improvement-loop v1 -->\n\n## Self-improvement loop\n\nBefore ending a run of this skill, review the run:\n\n1. Did any step fail, stall, or need a workaround you had to invent?\n2. Did the user correct, reject, or rewrite something meaningful in the output?\n3. Did you discover something a future run would want to know (a path that moved, a\n   tool that replaced another, a preference they stated out loud)?\n\nIf yes to any, propose a specific edit to this SKILL.md in one or two lines and ask\nwhether to apply it. Propose only changes that would alter a future run's behavior --\nskip cosmetic rewording, and never propose more than two edits at once.\n\nDo not edit this file without their go-ahead. If they say no, drop it and do not re-raise\nthe same suggestion in a later run of the same session.\n", "path": "open-house-signin/SKILL.md", "orchestrator": false, "calls": ["contact-import", "open-house-flyer", "open-house-followup", "open-house-package"], "calledBy": ["agent-profile", "listing-flyer", "listing-intake", "open-house-flyer", "open-house-followup", "open-house-package", "preflight"]}, {"id": "owners-manual", "folder": "owners-manual", "dept": "foundation", "deptLabel": "Foundation", "hue": 220, "description": "Write the owner's manual for everything installed on this machine, from what is actually on disk: each piece, the one command that runs it, where it writes, and what to do when it breaks, plus the six things that break in the first three weeks and their fixes. Trigger on \"write my owner's manual\", \"write my playbook\", \"what is installed on this machine\", \"document my setup\", \"what do I do when it breaks\", \"it stopped working\", \"nothing texted me this morning\", \"what did we set up\", or at the end of an install when the agent is about to run the system alone. Do NOT trigger for how one skill works (that skill's own playbook), for a slow machine (computer-revive), or for checking tools before an install (preflight).", "body": "# Owner's manual: the system documents itself, in front of the owner\n\nThe handoff moment in any install is the agent watching their own Claude write down what\nis on their machine and how to use it. A manual written from a template describes some\nother setup. This one reads the folder, the profile, the scheduled tasks and the plugin,\nand writes only what is there. It is also the first thing to run when something stops\nworking, because the fix for most week-two failures is already in it.\n\nReads everything in `profile/`, `.env` (key names only), `voice/`, `data/`, `daily/`,\n`records/`, the scheduled task list, and the installed plugin version. Writes\n`OWNERS-MANUAL.md` in the workspace root.\n\n## The rule that comes first\n\n**This skill reads the machine; it changes nothing.** It uninstalls nothing, edits no\ntask, deletes no file. It never prints a secret: `.env` appears in the manual as a list of\nkey names, never values. Any fix that involves signing in, a permission dialog, or a\npassword (Claude Code's sign-in, a macOS grant, a token minted again) is the agent's own\nhands; the manual says which button, and the agent clicks it.\n\n## Levels, so nothing is promised before it is proven\n\n- **Level 1, the inventory.** What is actually here, read from disk and from the system:\n  profile files and their dates, data files and row counts, the voice wire and its\n  transport, scheduled tasks and when each last ran, the plugin version and whether\n  auto-update is on. Nothing described that was not found.\n- **Level 2, the manual.** For each installed piece: the one command to run it, what it\n  reads, what it writes, what it never does, and what to do when it breaks. Written from\n  the inventory, in the agent's words where they gave them.\n- **Level 3, the drill.** The six known breakages run live with the agent: restart a stale\n  session, confirm a task actually fired, change one word in a skill file and see the next\n  run use it. The drill is what turns a document into a habit.\n\n## Who does what\n\n| Step | Claude | The agent (their own hands) | Why |\n|---|---|---|---|\n| Inventory | Reads the folders, the task list, `/plugin list`, `.env` key names | Nothing | Read-only |\n| Support terms | Asks who installed this, what the support window is, what counts as broken-broken | Answers, in their words | Not invented |\n| Write the manual | Writes `OWNERS-MANUAL.md` | Reads it on the spot, corrects anything wrong | Their manual |\n| The drill | Names each step | Does each step at the keyboard | They will need it alone |\n| Re-auth, grants, tokens | Names the exact path | Signs in, clicks Allow, mints again | Credentials |\n| Re-run later | Edits the manual in place, dated, keeps the change log | Nothing | It accumulates |\n\n## The inventory, in order\n\n1. **Profile.** `profile/AGENT.md` (name, brokerage, `Last updated`), `profile/VOICE.md`,\n   `profile/STACK.md` sections, `profile/TOOLS.md` sections, `profile/PREFLIGHT.md` date.\n   Flag any `TO CONFIRM WITH BROKER` still open; it blocks every public piece.\n2. **Data.** `data/contacts.csv` row count and the count with a birthday; `data/pipeline.csv`\n   if present; `listings/` folders; `records/sent-log.md` last entry date; `daily/` newest\n   file. Counts and dates only, never the contents.\n3. **The voice wire.** Transport from `profile/STACK.md`, the scripts present in `voice/`,\n   which `.env` keys exist (names only), the working hours, and whether the loop-guard\n   check is recorded as passed.\n4. **Scheduled tasks.** The list, each with its schedule and its last run if the system\n   shows one. A task with no last run is reported as \"never fired yet,\" not as working.\n5. **The plugin.** Version from `/plugin list`, and whether auto-update is on for this\n   marketplace. Off is the default and it is the most common silent failure.\n6. **Tools.** `git`, `python`, `ffmpeg`, Playwright: from `profile/PREFLIGHT.md` if it is\n   under 30 days old, otherwise run `preflight` first.\n\n## The manual\n\n`OWNERS-MANUAL.md`, in this order, under 200 lines:\n\n```\n# Owner's manual: <agent name>'s system\nWritten YYYY-MM-DD by the system itself, from what is installed here. Re-run \"write my\nowner's manual\" after any change.\n\n## What is here\nOne line per piece, from the inventory. Only what was found.\n\n## The daily habit\nOpen Claude Code in this folder. Type /clear at the start of every day. Say\n\"good morning\" (sphere-daily) or wait for the brief on your phone. Say \"save that to\nmemory\" when you correct something.\n\n## Each piece, and the one command\nFor every installed skill or wire: the trigger phrase, what it reads, what it writes,\nwhat it never does. Taken from each skill's own description, not paraphrased into a\npromise the skill does not make.\n\n## When it breaks\nThe table below, with the fix lines adjusted to this machine (Mac or Windows, iMessage or\nTelegram).\n\n## Support\nWho installed this, what the support window is and when, what counts as broken-broken,\nand what a new build costs. In the agent's own words from this session. Blank if they\ndid not say.\n\n## Change log\nYYYY-MM-DD: first manual.\n```\n\n## When it breaks: the six known failures, in the order they happen\n\nEvery one of these has happened on a real install. None is a guess, and none is the\nagent's fault.\n\n| Days | What they see | Why | The fix, in the manual |\n|---|---|---|---|\n| 1 to 3 | Nothing fires. No brief this morning. | Laptop asleep, lid closed, or the task never had an awake machine. | Is the laptop open and plugged in? Scheduled tasks need an awake machine. Run the task by hand once; if it works by hand, the clock is the problem, not the task. |\n| 3 to 7 | \"Not logged in,\" or a task runs and nothing replies. | The Claude Code sign-in lapsed. | Type `claude`, sign in again with the same email that pays for the plan. One line, their hands. |\n| 7 to 10 | The wire went quiet, or on a Mac it started replying to itself. | Mac: the `[claude]` prefix was edited out, or the cursor replayed history. Windows: the `.env` file moved or the token changed. | Mac: `python voice/imessage_poll_commands.py --reset`, then check the prefix in the reply script. Windows: re-run the test send from `voice-command` Level 1 and read the response. |\n| 10 to 14 | A skill someone mentioned is not here. | Auto-update is off, the default for this marketplace. | `/plugin update realtor-skills@realtor-skills`, then `/plugin`, Marketplaces, auto-update on. |\n| 14 | They stopped opening it. | Not a bug. The friction list went unanswered, or the first win was not theirs. | Text the friction list to whoever installed this. Then run one small thing that worked before, today. |\n| 14 to 21 | It got slow and dumb. | The session context filled up; nobody started fresh. | `/clear` at the start of every day. If it is still slow, `computer-revive`. |\n\nIf it is none of these: screenshot it and paste it to Claude. That is the fastest way\nthrough, and Claude will say which of the six it is closest to.\n\n## The drill (Level 3)\n\nRun each with the agent's hands, in this order, five minutes total:\n\n1. Type `/clear`, then ask one question the profile answers. A stale session is now a\n   fresh one and they have seen the difference.\n2. Open the scheduled task list; pick the brief; run it now; confirm it landed on the\n   phone. They have seen the difference between \"scheduled\" and \"fired.\"\n3. Open one skill file (say \"show me the skill file for birthdays\"), change one word in\n   its output format, save, run it. They have seen that the words in the file are the\n   behavior.\n4. Say \"save to memory: <one thing they corrected today>.\" They have seen how it learns.\n\nRecord in the manual's change log that the drill was done and the date.\n\n## What this skill will not claim\n\n- It will not list a task as working because it is scheduled. Only a last-run time the\n  system shows, or a run done in the session, counts.\n- It will not claim the plugin is current without reading the version from `/plugin list`\n  in that session.\n- It cannot see a phone. \"The brief lands\" is the agent's word, recorded as such.\n- It will not fill in support terms, prices, or a support window the agent did not state.\n  Blank is correct; invented is not.\n- It will not describe a skill as installed that is not in `/plugin list` or in the\n  workspace, even if the design for it exists somewhere.\n\n## Chains from / into\n\nRun at the end of an install and any time the agent asks what is wrong. Reads the output\nof `preflight`, `agent-profile`, `voice-command`, `wire-a-tool`, `ghl-setup`,\n`contact-import`, and `sphere-daily`. Routes to `computer-revive` for a slow machine and\nto the owning skill for any one piece's fix.\n\nIf the user asks how this works, what it needs, or how to customize it, read\n`PLAYBOOK-owners-manual.md` in this folder and answer from it.\n\n---\n\n<!-- self-improvement-loop v1 -->\n\n## Self-improvement loop\n\nBefore ending a run of this skill, review the run:\n\n1. Did any step fail, stall, or need a workaround you had to invent?\n2. Did the user correct, reject, or rewrite something meaningful in the output?\n3. Did you discover something a future run would want to know (a path that moved, a\n   tool that replaced another, a preference they stated out loud)?\n\nIf yes to any, propose a specific edit to this SKILL.md in one or two lines and ask\nwhether to apply it. Propose only changes that would alter a future run's behavior --\nskip cosmetic rewording, and never propose more than two edits at once.\n\nDo not edit this file without their go-ahead. If they say no, drop it and do not re-raise\nthe same suggestion in a later run of the same session.\n", "path": "owners-manual/SKILL.md", "orchestrator": false, "calls": ["agent-profile", "computer-revive", "contact-import", "ghl-setup", "preflight", "sphere-daily", "voice-command", "wire-a-tool"], "calledBy": ["preflight", "voice-command", "wire-a-tool"]}, {"id": "preflight", "folder": "preflight", "dept": "foundation", "deptLabel": "Foundation", "hue": 220, "description": "Check whether this machine can run each part of the library before anything is attempted: Claude Code and the paid plan, the working folder and profile, git, Python, the render browser, ffmpeg, disk and memory. Reports one table, offers each missing install one at a time with a yes required, and tiers the library into what runs now, what runs if you brought the thing, and what needs an install first. Trigger on \"check my setup\", \"am I ready\", \"preflight\", \"is my computer ready\", \"what can I run\", \"which one should I do\", \"will this work on my laptop\", or as the first step of any skill that needs a tool it cannot find (Python, Playwright, ffmpeg, git, Node). Do NOT trigger for a slow machine (computer-revive), for filling in the profile itself (agent-profile), or for creating accounts (ghl-setup, or the stack skills).", "body": "# Preflight: find out what this laptop can do before promising it\n\nHalf the library needs nothing but Claude Code. The other half quietly assumes a headless\nbrowser, ffmpeg, or a login the agent has to bring. A skill that discovers a missing tool\nforty minutes in, and then improvises an install, is how a session dies. This skill finds\nout in two minutes, says what is missing, and asks before it changes anything.\n\nReads `profile/AGENT.md` if it exists. Writes `profile/PREFLIGHT.md`, dated.\n\n## The rule that comes first\n\n**Nothing gets installed without naming what, why, and getting a yes for that one thing.**\nInstallers that ask for an administrator password, any consent screen, and the paid Claude\nplan are the agent's own hands, every time. Claude runs the checks, prints the exact line\nit would run, and waits. On a company-managed laptop where installs are blocked, it stops,\nsays so, and hands over the one-paragraph note for their IT person instead of trying a\nworkaround.\n\n## Levels, so nothing is promised before it is proven\n\n- **Level 1, look.** Every check below, read-only, one table. Nothing changes on the\n  machine. This is the default and it is safe to run any time.\n- **Level 2, fix.** Each missing tool offered one at a time with the exact install line,\n  run only on a yes, verified after with the same check that found it missing.\n- **Level 3, tier.** The library sorted for *this* machine: run it now, run it if you\n  brought the thing, tonight after an install. Generated from the table, never promised.\n\n## Who does what\n\n| Step | Claude | The agent (their own hands) | Why |\n|---|---|---|---|\n| Run every check | Yes, read-only | Nothing | Nothing changes |\n| Paid Claude plan | Reads whether `claude` opens without a plan warning | Upgrades with their own card if it does not | Payment |\n| Package installs (Python, git, ffmpeg) | Prints the line, runs it on a yes | Says yes; types the administrator password if the installer asks | Their machine |\n| Homebrew on a Mac, if absent | Prints the brew.sh address and stops | Installs it themselves; it asks for their password | Their machine |\n| Playwright and its browser | Runs the two lines on a yes | Says yes | Downloads a browser, about 150 MB |\n| Whisper model for video | Says the model download is 1 to 3 GB and offers the no-captions path | Decides | Disk and time |\n| Company-managed laptop | Detects the failure, hands over the IT note | Forwards it | Not ours to bypass |\n\n## The checks\n\nRun all of them before saying anything. Report each as PASS, MISSING, or OLD with the\nversion found. On Windows use PowerShell; on a Mac use the terminal. Do not infer a result\nfrom a filename or from memory; run the command.\n\n| Check | How | If missing or old |\n|---|---|---|\n| Claude Code installed | `claude --version` prints | Re-run the one-line installer from the install page |\n| Plan allows Claude Code | `claude` opens without a plan warning, signed in with the email that pays | Stop here. The upgrade is the agent's card; come back after |\n| Working folder | Current folder is the one they will always use; `profile/` exists or can be created here | Create it, say the folder name, tell them to always open Claude Code there |\n| Profile | `profile/AGENT.md` exists and `Last updated` is within 180 days | Route to `agent-profile` |\n| Git | `git --version` | Windows: git-scm.com, defaults, \"Add to PATH\", then a NEW terminal window. Mac: `xcode-select --install` |\n| Python 3.10+ and pip | `python --version` (Mac: `python3 --version`), `python -m pip --version` | Windows: `winget install Python.Python.3.12`. Mac: `brew install python`. Ask first |\n| Playwright + Chromium (render skills) | `python -c \"import playwright\"` then `python -m playwright install --dry-run chromium` | `pip install playwright` then `python -m playwright install chromium`. Ask first |\n| ffmpeg + ffprobe (video skills) | `ffmpeg -version` and `ffprobe -version` | Windows: `winget install Gyan.FFmpeg`. Mac: `brew install ffmpeg`. Ask first, then a NEW terminal |\n| Word-level transcriber (video captions) | `pip show faster-whisper` | Offer the install, say the model is 1 to 3 GB, or offer the no-captions path |\n| Node 18+ (only if a web page will be hosted) | `node --version` | Windows: `winget install OpenJS.NodeJS.LTS`. Mac: `brew install node`. Ask first, and only if a hosting skill is on the list |\n| Free disk | Windows: `Get-PSDrive C`; Mac: `df -h /` | Under 5 GB free: say so, route to `computer-revive` before any install |\n| Memory | Windows: `Get-CimInstance Win32_ComputerSystem`; Mac: `sysctl hw.memsize` | 8 GB or less: say the render and video skills will be slow and that `computer-revive` can help, not fix |\n| Plugin auto-update | `/plugin`, Marketplaces tab, auto-update for this library | Off is the default. Turn it on in the room; a skill that never updates looks healthy |\n\n**Windows and Mac differ on PATH.** A tool installed a minute ago is not visible to the\nterminal that was already open. After any install, close every terminal window and open a\nnew one before re-running the check. Do not tell them to restart the computer.\n\n## The tiers (Level 3)\n\nAfter the table, sort the library for this machine. Three words, and the third one is the\nhonest one.\n\n**Run it now** (nothing beyond Claude Code): `agent-profile`, `agent-voice`,\n`compliance-check`, `source-check`, `computer-revive`, `lead-intake`, `followup-queue`,\n`followup-sequence`, `listing-intake`, `listing-description`, `meeting-brief`,\n`market-brief`, `sphere-audit`, `sphere-message`, `sphere-daily`, `home-anniversary`,\n`revocation-watch`, `social-caption`, `content-week`, `wire-a-tool`, `owners-manual`.\n\n**Run it if you brought the thing:** `contact-import` (a CRM .csv or a phone .vcf),\n`birthday-watch` (contacts with a birthday column; most phone exports have none),\n`market-pull` (the agent's own MLS login; aggregators are forbidden by that skill),\n`buydown-math` (a dated lender rate sheet; it blocks without one), `social-scan` and\n`social-audit` (Instagram logged in, or screenshots), `ghl-setup` (a GoHighLevel\naccount on the agent's own card), `voice-command` (Telegram installed on a Windows\nagent's phone; a Mac that is not company-managed).\n\n**Tonight, after an install:** `carousel-render`, `listing-carousel`, `listing-flyer`,\n`market-carousel`, `open-house-flyer`, and the three orchestrators `listing-package`,\n`market-update-package`, `open-house-package` (Python plus Playwright and Chromium);\n`video-talking-head` and `video-event-recap` (ffmpeg, and a transcriber for captions;\n30 to 60 minutes on first run); `open-house-signin` (a host for the page).\n\nPrint the three lists with the missing tool named next to each \"tonight\" item and the\ninstall line it needs. That is the answer to \"which one should I do.\"\n\n## Output\n\n`profile/PREFLIGHT.md`:\n\n```\n# Preflight, YYYY-MM-DD\nMachine: Windows 11 | macOS 15, 16 GB, 41 GB free\nClaude Code 2.x.y, plan OK, folder: <name>\n\n| Check | Result | Version / note |\n|---|---|---|\n| ...   | PASS / MISSING / OLD | ... |\n\nRun it now: ...\nRun it if you brought the thing: ...\nTonight, after an install: ...\n\nInstalled this run (each on a yes): ...\nDeclined or blocked: ...\n```\n\nOverwrite it on every run; the date is the point. Other skills read the table instead of\nre-checking.\n\n## What this skill will not claim\n\n- A version print is not a working render. This skill proves a tool is present, not that\n  a carousel comes out; the render skill's own first run proves that.\n- It will not fix a slow machine. That is `computer-revive`, and this skill says so\n  instead of closing programs.\n- It will not put a skill in \"run it now\" that it did not check the requirements of. If\n  a new skill is not in the lists above, it says \"not tiered yet\" rather than guessing.\n- It will not install anything on a company-managed machine that refuses, and it will not\n  suggest a way around the refusal.\n\n## Chains from / into\n\nCalled first by `carousel-render`, `video-talking-head`, `video-event-recap`,\n`voice-command`, and any skill that hits a missing tool. Routes to `agent-profile` when\nthe profile is missing and to `computer-revive` when memory or disk is the problem.\n`owners-manual` reads `profile/PREFLIGHT.md`.\n\nIf the user asks how this works, what it needs, or how to customize it, read\n`PLAYBOOK-preflight.md` in this folder and answer from it.\n\n---\n\n<!-- self-improvement-loop v1 -->\n\n## Self-improvement loop\n\nBefore ending a run of this skill, review the run:\n\n1. Did any step fail, stall, or need a workaround you had to invent?\n2. Did the user correct, reject, or rewrite something meaningful in the output?\n3. Did you discover something a future run would want to know (a path that moved, a\n   tool that replaced another, a preference they stated out loud)?\n\nIf yes to any, propose a specific edit to this SKILL.md in one or two lines and ask\nwhether to apply it. Propose only changes that would alter a future run's behavior --\nskip cosmetic rewording, and never propose more than two edits at once.\n\nDo not edit this file without their go-ahead. If they say no, drop it and do not re-raise\nthe same suggestion in a later run of the same session.\n", "path": "preflight/SKILL.md", "orchestrator": false, "calls": ["agent-profile", "agent-voice", "birthday-watch", "buydown-math", "carousel-render", "compliance-check", "computer-revive", "contact-import", "content-week", "followup-queue", "followup-sequence", "ghl-setup", "home-anniversary", "lead-intake", "listing-carousel", "listing-description", "listing-flyer", "listing-intake", "listing-package", "market-brief", "market-carousel", "market-pull", "market-update-package", "meeting-brief", "open-house-flyer", "open-house-package", "open-house-signin", "owners-manual", "revocation-watch", "social-audit", "social-caption", "social-scan", "source-check", "sphere-audit", "sphere-daily", "sphere-message", "video-event-recap", "video-talking-head", "voice-command", "wire-a-tool"], "calledBy": ["owners-manual", "voice-command"]}, {"id": "revocation-watch", "folder": "revocation-watch", "dept": "foundation", "deptLabel": "Foundation", "hue": 220, "description": "Catch every opt-out, however it's phrased, and make it stick. Run on every batch of inbound replies before drafting any follow-up, and any time the agent asks \"did anyone opt out\", \"check for stops\", \"clean my list\", or \"can I still text this person\". Also runs automatically as the first step of followup-queue and sphere-daily. This is a compliance gate: its NO overrides every other skill's draft.", "body": "# Revocation Watch — the opt-out catcher\n\nConsumers may revoke consent by **any reasonable method** (47 CFR 64.1200(a)(10)) —\nnot just by replying STOP. \"Please don't text me,\" \"take me off your list,\" \"not\ninterested, stop reaching out,\" \"who is this? don't contact me,\" a voicemail saying to\nquit calling, or telling the agent face to face at an open house ALL count. A system\nthat only catches the literal word STOP is a system that keeps texting people who\nrevoked, and every message after a revocation is a separate violation that lands on\nthe agent's license and wallet.\n\n## What a revocation looks like (classify by meaning, not keywords)\n\nRead each inbound reply and judge intent:\n\n- **Clear revocation** — any expression of \"stop contacting me,\" whatever the words:\n  STOP, unsubscribe, remove me, don't text me, wrong number + go away, \"no more,\"\n  profanity + leave-me-alone, \"I already have a lender/agent, please stop.\"\n- **Channel-specific revocation** — \"stop texting me, email is fine\" revokes ONE\n  channel. Honor the named channel; keep only what they said stays open, and record\n  which is which.\n- **Scope-specific** — \"I'm not interested in this house\" is not a revocation of all\n  contact. When genuinely ambiguous, treat as full revocation OR ask exactly once for\n  clarification with zero marketing content. When in doubt, out.\n- **NOT a revocation** — a question, a \"not right now, maybe in spring\" (that's a\n  deferral: pause the sequence, keep consent), a complaint about frequency (\"so many\n  texts!\" → reduce cadence, confirm once).\n\n## What happens on a revocation (all five, every time)\n\n1. **Tag the contact immediately** in the CRM/contact file using the field every other\n   sphere skill checks: `optout`. Set `optout: all` for a full revocation, or\n   `optout: text` / `optout: email` / `optout: call` for a channel-specific one (the\n   named channel only — other channels stay open). Also record the date and the\n   verbatim message that revoked. The verbatim quote is the audit record. This exact\n   field name and these exact values are what `birthday-watch`, `home-anniversary`,\n   `followup-queue`, and `sphere-message` filter on — a different field name (e.g.\n   `dnc`) is invisible to them and the revocation will not actually stop outreach.\n2. **Kill every pending touch** for that contact in every sequence, queue, and\n   scheduled batch — check followup-queue, sphere-daily drafts, and any open-house\n   follow-up sequence. A revocation that stops one list and not the others is a\n   violation with extra steps.\n3. **One confirmation message maximum, only if the channel allows it, with ZERO\n   marketing content:** \"You're removed — you won't hear from me again. Sorry to have\n   bothered you.\" Nothing else. No \"if you change your mind.\" If the revocation was\n   hostile, send nothing.\n4. **Log it** in `revocations.md` next to the contact data: date received, date\n   honored, method they used. The honor deadline is **10 business days** — but honor\n   it the same day; the deadline is a ceiling, not a target.\n5. **Report it to the agent** in the batch summary: who, verbatim what, what was\n   cancelled. Never silently swallow a revocation — the agent needs to know the\n   relationship's real state.\n\n## The standing checks\n\n- Before ANY outbound batch drafts: scan inbound replies since the last run for\n  revocations FIRST. A batch drafted before the scan is a batch drafted against a\n  stale list — re-draft after tagging.\n- On \"can I still text this person\": check the tag, the log, and the last 90 days of\n  their inbound messages before answering. If there's no consent record at all, the\n  answer is about consent tier, not just revocation — route to the consent rules in\n  open-house-signin and contact-import.\n- Monthly (or when asked to \"clean my list\"): sweep for contacts with revocation-ish\n  language in their history that never got tagged, and reconcile the log against the\n  CRM tags.\n\n## What this skill never does\n\n- Never auto-sends anything, including the confirmation — it drafts; the agent\n  approves (the agent owns every send).\n- Never deletes the contact record. Revoked contacts stay in the database tagged `optout` —\n  deleting them destroys the do-not-contact memory and the audit trail.\n- Never argues, wins-back, or \"one last value message.\" Revoked is revoked.\n\n---\n\n<!-- self-improvement-loop v1 -->\n\n## Self-improvement loop\n\nBefore ending a run of this skill, review the run:\n\n1. Did any step fail, stall, or need a workaround you had to invent?\n2. Did the user correct, reject, or rewrite something meaningful in the output?\n3. Did you discover something a future run would want to know (a path that moved, a\n   tool that replaced another, a preference stated out loud)?\n\nIf yes to any, propose a specific edit to this SKILL.md in one or two lines and ask\nwhether to apply it. Propose only changes that would alter a future run's behavior --\nskip cosmetic rewording, and never propose more than two edits at once.\n\nDo not edit this file without the user's go-ahead. If they say no, drop it and do not\nre-raise the same suggestion in a later run of the same session.\n", "path": "revocation-watch/SKILL.md", "orchestrator": false, "calls": ["birthday-watch", "followup-queue", "home-anniversary", "sphere-message"], "calledBy": ["followup-queue", "preflight", "social-scan", "sphere-daily"]}, {"id": "social-audit", "folder": "social-audit", "dept": "content", "deptLabel": "Content", "hue": 48, "description": "Audit the agent's own Instagram — content mix, posting cadence, and what is actually performing versus what is not — from Insights screenshots, a browsed logged-in session, or the public grid if neither is available, then hand back a dated report with a one-week post plan ready for content-week. Zero setup beyond having an Instagram account. Trigger on \"audit my instagram\", \"audit my social\", \"how's my instagram doing\", \"what's working on my IG\", \"check my social media\", \"instagram audit\", \"social audit\", or \"review my posts\". Do NOT trigger to plan next week's content from scratch — that is content-week, which reads this skill's output. Do NOT trigger to write a single caption — that is social-caption.", "body": "# Social Audit — ten minutes, one command, real numbers only\n\nThis is the skill an agent can run the moment the library is installed, before they have\ntouched anything else, and still walk away with something true and useful. No listings\nfile, no market pull, no profile setup required. If `profile/AGENT.md` exists, use it to\nsharpen the advice — brokerage, price band, service area. If it does not, run anyway.\n\n---\n\n## The one rule this skill will not break\n\n**Every claim that a post \"performed well\" or \"underperformed\" must name the actual\npost and the actual number, and say which path below produced that number.**\n\nIf the input path available this run cannot surface a number, say \"no visible\nengagement data for this post\" and stop there. Never estimate a like count, never infer\nreach from a caption's tone, never carry a number forward from a prior audit into this\none, and never round a fuzzy read into a clean-looking stat. A guessed number is worse\nthan no number — it is the same failure this whole library refuses everywhere else.\n\n## Step 0 — Work out which path is available, in this order\n\n**Path 1 — Insights screenshots.** Ask first: \"Drop in a screenshot of your Instagram\nInsights — Accounts Reached, your top posts, and Total Followers / growth. Three\nscreenshots, from your phone, is plenty.\" Read the images directly. This is the only\npath with real numbers attached to real posts, so prefer it every time it is available.\nIf the agent has a professional (business or creator) account, these screens live at\nprofile → menu (top right) → **Insights**. If they are on a personal account, Insights\ndoes not exist — tell them plainly and drop to Path 2 or 3.\n\n**Path 2 — browse their own session.** If this session has a working browser tool and\nthe agent is already logged into Instagram in it, browse to their own profile and\ninsights pages directly instead of asking for screenshots. Say so in the report —\n\"read live from your logged-in session\" — and still cite the specific number and screen\nit came from. Do not attempt to log in on the agent's behalf and do not ask for a\npassword; if no logged-in session is available, drop to Path 3.\n\n**Path 3 — public profile only (degraded).** Look at the public grid: post captions,\napparent post type, cadence from visible dates, and like/comment counts where Instagram\nstill shows them publicly. This path cannot see reach, saves, shares, or follower\ngrowth, and it is often blocked entirely by Instagram's logged-out wall. Try it, and if\nit comes back empty or clearly wrong, say that plainly rather than presenting a thin\nresult as a full audit.\n\n**State the path used at the top of the report, every time**, plus one line on what it\ncould not see. An agent reading this needs to know whether they are looking at real\nInsights numbers or a grid-only guess.\n\n## Step 1 — Content mix breakdown\n\nSort what you can see (screenshots, browsed feed, or public grid — however many recent\nposts the path exposes, note the count) into:\n\n- **Listings** — a property, an open house, a just-sold, a buydown/rate post\n- **Personal** — the agent as a person: family, faith, behind-the-scenes, no CTA tied to a deal\n- **Market** — stats, trends, \"what's happening in [city]\"\n- **Value** — an answer to a real question, a how-to, a myth-buster, anything a\n  non-client would still find useful\n\nReport counts and rough percentages. Do not force a post into a category it does not\nfit — say \"unclear\" rather than guess.\n\n## Step 2 — Posting cadence reality check\n\nFrom visible post dates, work out the actual average per week over whatever window the\npath exposes (Insights screenshots often show 30 or 90 days; the public grid shows\nwhatever is on screen). Compare it, gently and specifically, to what the agent probably\nbelieves they are doing — most agents overestimate their own cadence. Flag any gap of\ntwo weeks or longer with no post, by date.\n\n## Step 3 — What's performing vs. what's not\n\nOnly from Path 1 or Path 2 data with real numbers attached. For each: the post named\n(caption snippet or date, whichever identifies it), the actual number, and the source\nscreen. Group into \"performing\" and \"not performing\" only where the gap is real, not\nnoise between two similar posts. If working from Path 3 only, replace this whole\nsection with: \"No engagement numbers were visible this run — public grids don't show\nreach or saves. Send Insights screenshots next time for this section to mean anything.\"\n\n## Step 4 — Three to do more of, three to stop\n\nPull straight from Steps 1 through 3, not from general social media advice. Each of the\nsix lines should point at something specific already visible in this agent's own data —\na format that is over- or under-represented, a category that is quietly winning or\nlosing, a cadence gap. If the data does not support six distinct findings, give fewer\nand say why, rather than padding to six.\n\n## Step 5 — One-week suggested post plan\n\nBuild a five-slot week in the same table shape `content-week` uses, so it can be handed\nstraight over:\n\n| Day | Post | Why (tie back to Step 4) |\n|---|---|---|\n\nThis is a suggestion, not a build. Tell the agent plainly: \"Hand this to content-week\n(or just say 'plan my content' and paste this in) to actually produce the posts.\"\n\n## Write the report\n\n`content/audit-<YYYY-MM-DD>.md`. Never overwrite a prior audit — each run is a dated\nsnapshot, and comparing this month's cadence or mix to last month's only works if both\nfiles still exist.\n\n```\n## Social Audit — <date>\n\nPath used: [Insights screenshots / browsed session / public grid only]\nWhat this path could not see: [...]\n\n## Content mix\n[counts + rough %, with \"unclear\" called out]\n\n## Cadence\n[actual posts/week over the visible window, gaps flagged by date]\n\n## Performing / not performing\n[named post + number + source, or the Path-3 disclaimer]\n\n## Do more of\n1.\n2.\n3.\n\n## Stop\n1.\n2.\n3.\n\n## Suggested week\n[the 5-slot table]\n```\n\n## Requires\n\nNothing but an Instagram handle and ten minutes. `profile/AGENT.md` is optional — read\nit if present for a sharper read (brokerage voice, price band, service area), but do not\nblock or degrade the audit for its absence.\n\n## Chains from / into\n\nStandalone entry point — does not require any other skill to have run first. Feeds its\nsuggested week into `content-week`. If the agent wants the \"what's performing\" section\nsharper going forward, point them at turning on Insights if they have not, and at\nrunning this again in about a month rather than weekly — engagement data needs more\nthan a few days to mean anything.\n\n---\n\n<!-- self-improvement-loop v1 -->\n\n## Self-improvement loop\n\nBefore ending a run of this skill, review the run:\n\n1. Did any step fail, stall, or need a workaround you had to invent?\n2. Did the user correct, reject, or rewrite something meaningful in the output?\n3. Did you discover something a future run would want to know (a path that moved, a\n   tool that replaced another, a preference they stated out loud)?\n\nIf yes to any, propose a specific edit to this SKILL.md in one or two lines and ask\nwhether to apply it. Propose only changes that would alter a future run's behavior --\nskip cosmetic rewording, and never propose more than two edits at once.\n\nDo not edit this file without their go-ahead. If they say no, drop it and do not re-raise\nthe same suggestion in a later run of the same session.\n", "path": "social-audit/SKILL.md", "orchestrator": false, "calls": ["content-week"], "calledBy": ["preflight"]}, {"id": "social-caption", "folder": "social-caption", "dept": "content", "deptLabel": "Content", "hue": 48, "description": "Write the caption for one social post — Instagram, Facebook, or LinkedIn — in the agent's voice, with the right hook, the right length for the platform, a real call to action, and the tag and credit block that actually drives the reach. Trigger on \"write the caption\", \"caption for this post\", \"what do I write with this\", \"social copy\", or as a step inside any package orchestrator. Do NOT trigger for MLS remarks — that is listing-description.", "body": "# Social Caption — the part that decides whether the graphic gets seen\n\nReads the asset it is captioning, `profile/AGENT.md`, `profile/VOICE.md`, and whatever\nsource file the asset came from (`LISTING.md`, the market data file, `BUYDOWN.md`).\n\n---\n\n## The rule that governs everything here\n\n**The caption ADDS. It does not repeat the slides.**\n\nIf the carousel already says the median price, the caption should not say the median\nprice. The reader has both in front of them, and a caption that recaps the graphic is\nwasted space. Say the thing that did not fit on the slides — the reason it matters, the\nstory behind it, the honest caveat, the question.\n\n## Structure\n\n**Line 1 is the hook, and it is most of the job.** Feeds truncate after roughly the first\n125 characters, so the first line has to earn the tap. What works:\n\n- A specific number with the tension attached\n- A statement the reader half-disagrees with\n- A concrete detail: \"The back yard has a 40-year-old avocado tree.\"\n\nWhat does not work: \"Check out this beautiful home!\", \"New listing alert\", \"Happy Monday\neveryone\", or any sentence that could sit under any post.\n\n**Then a blank line.** The caption preview cuts at the first line break, so line 1 alone\nhas to stand up.\n\n**Body: two to five short paragraphs**, one idea each, blank line between them. Not a\nwall. People read captions on a phone in a hallway.\n\n**Then one call to action.** One. \"Comment X for the flyer\" or \"send me a message\" or\n\"save this for when you're ready\" — but not three of them. Multiple CTAs produce zero\nactions.\n\n**Then the credit and tag block.** On a listing or open house post this is not a\ncourtesy — **it is the distribution.** Tagging and crediting the listing agent, the\nco-lister, the host, and the brokerage borrows their audiences. A post with nobody tagged\nreaches only the agent's own followers, which for most agents is a fraction of the people\nthey actually want.\n\n**Then hashtags**, last, after the tag block.\n\n## Platform\n\n| | Length | Hashtags | Notes |\n|---|---|---|---|\n| **Instagram** | 125 chars before the cut; 300–800 total works | 5–15, mixed local and topical, at the end | Links are not clickable — never say \"link below\" |\n| **Facebook** | Shorter. 1–3 sentences outperforms. | 0–3 | Links work and get clicked |\n| **LinkedIn** | 1–3 paragraphs, professional register | 3–5 | Links suppress reach; consider first comment |\n\nAsk the platform. Do not write one caption and hope.\n\n## Worked example (Instagram, listing post)\n\n```\nThe back yard has a 40-year-old avocado tree the sellers have never let anyone touch.\n\nThree bed, two bath, 1,850 sqft in [City]. The kitchen was redone in 2022, but the tree\nis the reason people stop scrolling when this one comes up.\n\nNew listing, open house this weekend — details in the caption below.\n\nComment TREE and I'll send you the flyer.\n\nListed by [Agent Name], [Brokerage] — DRE #[license]. Co-hosted with [Co-lister],\n[Brokerage]. Equal Housing Opportunity.\n\n#[city]realestate #[city]homes #justlisted #openhouse #[neighborhood]\n```\n\nNotice what it does NOT do: it does not repeat the price or the spec row that is already\non the carousel slides, it has exactly one CTA, and the hook is a concrete detail, not an\nadjective.\n\n## Compliance — every caption, no exceptions\n\nA caption is public advertising. `compliance-check` runs on it before it ships.\n\n- License number and brokerage where the agent's state requires it on advertising\n- Equal Housing Opportunity where required\n- **Nothing about the neighborhood's character, its residents, its schools, or whether an\n  area is \"safe\", \"quiet\", \"family-friendly\", or \"desirable\"**\n- No valuation claim, no prediction, no guarantee\n- Any number routes through `source-check` — MLS-sourced with an as-of date\n- Any payment or rate figure carries the full disclaimer from `buydown-math`, and the\n  disclaimer does not get trimmed to fit the caption. If it does not fit, it goes on the\n  final slide and the caption points to it.\n- If it is another agent's listing, credit them and their brokerage\n\n## Voice\n\nRun `agent-voice`. Scan the finished draft against the banned words list before\ndelivering — do not just try to avoid them while writing.\n\nNo manufactured urgency the agent has not earned. No claim about their experience or\nresults that is not in `profile/AGENT.md`.\n\n## Output\n\nDeliver the caption as **plain text, ready to paste, with nothing around it** — no\npreamble, no \"here's your caption\", no metadata, no notes interleaved. Blank line between\nparagraphs so it pastes into the app looking the way it will read.\n\nIf there are notes, put them after the caption block, clearly separated.\n\n## Chains from / into\n\nCalled by `listing-package`, `open-house-package`, `market-update-package`,\n`listing-carousel`, `market-carousel`. Uses `agent-voice`, `compliance-check`,\n`source-check`.\n\n---\n\n<!-- self-improvement-loop v1 -->\n\n## Self-improvement loop\n\nBefore ending a run of this skill, review the run:\n\n1. Did any step fail, stall, or need a workaround you had to invent?\n2. Did the user correct, reject, or rewrite something meaningful in the output?\n3. Did you discover something a future run would want to know (a path that moved, a\n   tool that replaced another, a preference they stated out loud)?\n\nIf yes to any, propose a specific edit to this SKILL.md in one or two lines and ask\nwhether to apply it. Propose only changes that would alter a future run's behavior --\nskip cosmetic rewording, and never propose more than two edits at once.\n\nDo not edit this file without their go-ahead. If they say no, drop it and do not re-raise\nthe same suggestion in a later run of the same session.\n", "path": "social-caption/SKILL.md", "orchestrator": false, "calls": ["agent-voice", "buydown-math", "compliance-check", "listing-carousel", "listing-package", "market-carousel", "market-update-package", "open-house-package", "source-check"], "calledBy": ["agent-profile", "agent-voice", "buydown-math", "compliance-check", "content-week", "listing-carousel", "listing-description", "listing-intake", "market-brief", "market-carousel", "preflight", "source-check"]}, {"id": "social-scan", "folder": "social-scan", "dept": "pipeline", "deptLabel": "Pipeline", "hue": 192, "description": "Review the agent's recent Instagram activity — new followers, story viewers, post likers and commenters — classify each new person, check whether they are an existing sphere contact re-engaging, and draft a first DM for the ones worth reaching, capped at 5 per run. Trigger on \"check my Instagram\", \"run my IG scan\", \"who engaged with my posts\", \"any new followers worth a DM\", \"social scan\", or as a daily/scheduled routine. Do NOT trigger to write or schedule content — that is content-week and social-caption.", "body": "# Social Scan — turn Instagram activity into five ready-to-send DMs\n\nEvery agent's warmest leads are already tapping on their Instagram — a like on a listing\npost, a view on a story about a new baby, a comment from someone whose name shows up in\n`data/contacts.csv` from three years ago. Almost none of it gets a reply, because reading\nthe activity and writing a real first message takes longer than an agent will do between\nshowings.\n\nThis skill does the reading and the drafting. It never does the sending.\n\nReads `profile/AGENT.md`, `profile/VOICE.md`, `data/contacts.csv` (optional but\nrecommended — the skill still runs without it, just without the sphere cross-check).\n\n---\n\n## Step 1 — Get the activity\n\n**This skill does not use the Instagram API and never will.** IG's API does not expose\nstory viewers or a clean likers/commenters feed to a normal account, and building around\nscraping workarounds is exactly the kind of thing that gets an account flagged. Instead,\nget the activity one of two ways — both are first-class, use whichever the agent has:\n\n- **Browse it live.** If Claude Code's browser tools are available and the agent is\n  logged into instagram.com in that browser session, open the activity feed, the story\n  viewer lists on the last 24 hours of stories, and the likes/comments on the last few\n  posts. Read what is on screen. Do not attempt to log in on the agent's behalf, do not\n  touch saved passwords, and stop and ask if a login screen appears instead of the feed\n  the agent expected.\n- **Take what the agent hands over.** A screenshot of the activity tab, a screenshot of\n  a story's viewer list, or a pasted list of names/handles. This is the fallback for any\n  agent without the browser tools connected, and it is just as valid an input — treat it\n  the same as a live browse.\n\nEither way, pull three lists: **new followers since the last run**, **story viewers**\n(only from stories still in the last 24 hours), and **likers/commenters** on posts from\nthe last 3 to 4 days. Note the date/time of the scan.\n\n**Never attempt to view a private account's content the agent does not already follow\nback or have visibility into.** If a profile is private and nothing beyond the handle and\nname is visible, classify it as unknown and say so — do not try to work around the\nprivacy setting.\n\n## Step 2 — Classify each new person\n\nFor everyone who is new since the last run (a new follower, a first-time story viewer, a\nfirst-time engager), open their profile and read the bio, recent posts, and who they\nfollow. Classify into exactly one of:\n\n- **(a) Fellow realtor / vendor** — bio says agent, broker, lender, title, photographer,\n  stager, or the account is clearly a real estate business account. Worth a professional\n  hello, not a client pitch.\n- **(b) Potential buyer signal** — engaging specifically with listing posts, open house\n  posts, or content about buying; or a bio/recent-post life signal that points toward a\n  move (new job in the area, engagement, growing family, \"just relocated\").\n- **(c) Potential seller signal** — bio or posts suggest they already own where the agent\n  farms (local tags, a home-related post, a \"we've outgrown this place\" kind of caption),\n  or they specifically engaged with market-value or \"what's my home worth\" content.\n- **(d) Unknown / personal** — no signal either way, or clearly a personal friend/family\n  account with no business angle. These get noted, not drafted.\n\nClassify on what is actually visible. Do not guess at someone's finances, ethnicity, or\nfamily status to sharpen a classification — if the signal is not there, it is unknown.\n\n## Step 3 — Check the sphere first\n\nBefore doing anything else with a name, check it against `data/contacts.csv` (if it\nexists). **A contact re-engaging after going quiet is the hottest signal this skill can\nsurface** — someone the agent already has a real relationship with just showed up again\non their own. Flag any match at the top of the report, above new-to-the-agent people,\nregardless of what page of the funnel they otherwise classify into.\n\nIf the matched contact is tagged `optout` in any form, this skill does not draft anything\nfor them, on any channel, full stop — see Hard rails.\n\n## Step 4 — Draft, at most 5\n\nRank everyone worth a message — sphere re-engagement first, then buyer/seller signals,\nthen realtor/vendor hellos — and draft no more than **5** DMs this run, even if more\npeople qualify. Say how many qualified and how many got held back, the same honesty\nsphere-daily uses for its cap.\n\nEvery draft runs through `agent-voice` against `profile/VOICE.md` before it's shown.\n\n**Rules for every draft:**\n\n- **Reference the specific thing they did.** \"Saw you liked the Wasatch listing\" or \"you\n  watched my story about the open house Saturday\" — never a generic \"hey, thanks for the\n  follow!\" A message that could have been sent to anyone reads like a bot and gets\n  ignored like one.\n- **No pitch in the first m
