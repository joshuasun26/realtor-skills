sing statement.\n\n## Variant B — the buydown carousel (text and graphics)\n\n**No photography required.** This variant routinely outperforms the photo carousel with\npeople who do not already follow the agent, because it answers a question rather than\nshowing a house. Do not over-build it.\n\n- **Cover:** the tension in the reader's own language. \"Most buyers negotiate the price.\n  Almost nobody negotiates the rate.\"\n- **Slide 2:** the mechanic in plain English — one credit applied once versus the same\n  dollars applied to the payment every month.\n- **Slides 3 to 5:** the scenario table from `BUYDOWN.md`, one comparison per slide. Big\n  numbers, minimal chrome.\n- **Slide 6:** the down-payment ladder, if the product supports it, with the product\n  named.\n- **Slide 7:** pivot to the property and the open house, so the post still serves the\n  listing.\n- **Final slide:** the full disclaimer block, verbatim from `BUYDOWN.md`. It is small\n  type but it is legible type. Never a screenshot, never cropped.\n\n## Build method\n\n1. Write one HTML file per slide, or one HTML file with one `.slide` element per slide,\n   at **1080 x 1350** (4:5 portrait, the highest-reach feed ratio). Use 1080 x 1080 only\n   if the agent asks for square.\n2. Pull colors and fonts from `profile/AGENT.md`. If a brand font is not installed\n   locally, say so and fall back to a named system font rather than silently substituting.\n3. Design at 2x and downscale — render at 2160 x 2700 and resize. Text renders far\n   cleaner.\n4. Render with a headless browser to PNG. Name files `slide-01.png` … in post order, in\n   `listings/<slug>/carousel-<variant>/`.\n5. Open the rendered PNGs and actually look at them before delivering. Check for clipped\n   text, overlay text sitting on a face or a busy area, and low-contrast text on photos.\n   Rendering is where layouts break, and the only way to catch it is to look.\n\n## Type and layout rules\n\n- One idea per slide. If a slide needs a paragraph, it needs to be two slides.\n- Minimum body size ~28px at 1080 wide. Instagram compresses; small type turns to mush.\n- High contrast. Text over a photo needs a scrim or a solid block behind it, never raw\n  text on a busy image.\n- Leave the bottom ~120px of every slide clear of anything important — the app's own UI\n  covers it in feed.\n- Consistent margins across all slides. Inconsistent gutters is the single most common\n  tell of a generated deck.\n\n## Before it ships\n\n- `compliance-check` on all slide copy. Every time. This is public marketing.\n- `source-check` on any number on any slide.\n- License number and brokerage on the final slide, per `profile/AGENT.md`.\n- If the listing belongs to another agent, credit the listing agent and their brokerage\n  on the final slide, and confirm photo permission is recorded in `LISTING.md`.\n\n## Distribution note (say this to the agent once)\n\nThe design is not what makes this reach people. **The tags are.** Crediting and tagging\nthe listing agent, the co-lister, the open house host, and the brokerage borrows their\naudiences, which are dense with exactly the people the agent wants. A carousel with\nnobody tagged is a worse version of a post that already underperforms. Invite every real\naccount as a collaborator.\n\n## Chains from / into\n\nCalled by `listing-package`, `open-house-package`. Reads `listing-intake` and\n`buydown-math` output. Feeds `social-caption`.\n\n---\n\n<!-- self-improvement-loop v1 -->\n\n## Self-improvement loop\n\nBefore ending a run of this skill, review the run:\n\n1. Did any step fail, stall, or need a workaround you had to invent?\n2. Did the user correct, reject, or rewrite something meaningful in the output?\n3. Did you discover something a future run would want to know (a path that moved, a\n   tool that replaced another, a preference they stated out loud)?\n\nIf yes to any, propose a specific edit to this SKILL.md in one or two lines and ask\nwhether to apply it. Propose only changes that would alter a future run's behavior --\nskip cosmetic rewording, and never propose more than two edits at once.\n\nDo not edit this file without their go-ahead. If they say no, drop it and do not re-raise\nthe same suggestion in a later run of the same session.\n", "path": "listing-carousel/SKILL.md", "orchestrator": false, "calls": ["buydown-math", "compliance-check", "listing-intake", "listing-package", "open-house-package", "social-caption", "source-check"], "calledBy": ["agent-profile", "buydown-math", "carousel-render", "compliance-check", "content-week", "listing-intake", "open-house-package", "social-caption", "source-check"]}, {"id": "listing-description", "folder": "listing-description", "dept": "listings", "deptLabel": "Listings", "hue": 28, "description": "Write the MLS public remarks and the agent-facing private remarks for one listing, plus the shorter variants for syndication and social, all inside the MLS character limits and clean on fair housing. Trigger on \"write the listing description\", \"MLS remarks\", \"property description\", \"public remarks\", \"write the copy for [address]\", or as a step inside listing-package. Do NOT trigger for a caption on a social post — that is social-caption.", "body": "# Listing Description — the copy that has to survive a compliance review\n\nMLS remarks are the most-scrutinized copy an agent writes. They are archived, they are\npublic, and they are the exhibit if a fair housing complaint is ever filed. Write them\ncarefully.\n\nReads `listings/<slug>/LISTING.md` and `profile/AGENT.md`.\n\n---\n\n## What to produce\n\n1. **Public remarks** — the consumer-facing description. Ask the agent for their MLS's\n   character limit; most fall between 750 and 1,500 characters including spaces. **Do not\n   assume a limit.** If they do not know, write to 750 and note that it can expand.\n2. **Private / agent remarks** — showing instructions, lockbox notes, offer instructions,\n   commission terms if the MLS carries them, known conditions. Never consumer-facing.\n3. **Short syndication line** — roughly 250 characters for portals that truncate.\n4. **One-line hook** — under 100 characters, reusable in texts, emails, and captions.\n\n## How to write the public remarks\n\n**Structure that works:**\n\n- **Open on the distinctive feature**, not on \"Welcome to this beautiful home.\" The first\n  eight words are the only ones most readers see in a list view. Use the sentence from\n  `LISTING.md`.\n- **Then the layout**, concretely: bedroom and bath count and how they are arranged, the\n  kitchen, the primary suite, the flow. Specific beats adjectival.\n- **Then improvements with dates.** \"Roof replaced 2021, HVAC 2023\" outperforms \"recently\n  updated\" because it is checkable.\n- **Then the lot and the outdoor space**, if it is a selling point.\n- **Close on the practical**: parking, HOA, and any showing note that belongs in public.\n\n**Voice:** run `agent-voice`. Most MLS remarks read like they were written by the same\nperson because they were all written by the same three habits. The agent's own register is\na differentiator.\n\n**Banned across the board:** exclamation-point stacking, ALL CAPS SHOUTING, \"must see\",\n\"won't last\", \"priced to sell\", \"motivated seller\" (unless the seller has explicitly\nauthorized signaling that — it costs them negotiating position), \"TLC\", \"handyman\nspecial\", \"as-is\" without the agent's confirmation, and any word implying a value opinion.\n\n## Fair housing — the specific ones that show up in MLS remarks\n\nScan for and remove:\n\n- Anything about schools as a quality claim. Naming the assigned district factually is\n  different from \"top-rated schools.\"\n- \"Safe\", \"quiet neighborhood\", \"family neighborhood\", \"good area\", \"up-and-coming\",\n  \"exclusive\", \"desirable\"\n- \"Perfect for a growing family\", \"great starter home\", \"ideal for retirees\", \"empty\n  nesters\", \"bachelor pad\", \"mother-in-law suite\" (use \"second unit\" or \"ADU\")\n- \"Walking distance to…\" — say the distance or say \"near\"\n- Proximity to a specific place of worship as an amenity\n- Anything describing current or expected occupants\n- \"Master bedroom\" — most brokerages have moved to \"primary bedroom\"\n\n**Describe the property, never the people.** Then run `compliance-check` on the finished\ncopy anyway. This is the one piece where a second pass is always worth it.\n\n## Accuracy\n\n- Every number in the remarks comes from the verified section of `LISTING.md`. Square\n  footage, lot size, year built, bed and bath count.\n- **Do not describe an unpermitted addition as finished square footage.** If permit\n  status is unknown, describe the space without claiming it as square footage, and flag\n  it to the agent.\n- Do not state that solar is owned if `LISTING.md` says the lease status is unconfirmed.\n- Do not describe a condition you have not been told about — no \"move-in ready\", no\n  \"needs nothing\", unless the agent said it.\n\n## Output\n\nAppend a `## Copy` section to `listings/<slug>/LISTING.md` holding all four variants\nverbatim, with the character count of each. The agent pastes from there.\n\nWorked example (public remarks, opening lines only):\n\n> You can renovate a kitchen, you cannot grow a 40-year-old avocado tree. This three\n> bedroom, two bath home offers 1,850 square feet with the primary suite separated from\n> the secondary bedrooms. Roof replaced 2021, HVAC 2023...\n\nThat is the pattern for all four variants: distinctive feature first, then concrete\nspecifics, never an adjective doing the work a fact could do.\n\n## Chains from / into\n\nCalled by `listing-package`. Reads `listing-intake`, `agent-voice`. Gated by\n`compliance-check` and `source-check`. Feeds `social-caption` and `listing-flyer`.\n\n---\n\n<!-- self-improvement-loop v1 -->\n\n## Self-improvement loop\n\nBefore ending a run of this skill, review the run:\n\n1. Did any step fail, stall, or need a workaround you had to invent?\n2. Did the user correct, reject, or rewrite something meaningful in the output?\n3. Did you discover something a future run would want to know (a path that moved, a\n   tool that replaced another, a preference they stated out loud)?\n\nIf yes to any, propose a specific edit to this SKILL.md in one or two lines and ask\nwhether to apply it. Propose only changes that would alter a future run's behavior --\nskip cosmetic rewording, and never propose more than two edits at once.\n\nDo not edit this file without their go-ahead. If they say no, drop it and do not re-raise\nthe same suggestion in a later run of the same session.\n", "path": "listing-description/SKILL.md", "orchestrator": false, "calls": ["agent-voice", "compliance-check", "listing-flyer", "listing-intake", "listing-package", "social-caption", "source-check"], "calledBy": ["agent-profile", "agent-voice", "compliance-check", "listing-intake", "source-check"]}, {"id": "listing-flyer", "folder": "listing-flyer", "dept": "listings", "deptLabel": "Listings", "hue": 28, "description": "Build a print-ready single-page property flyer for one listing — hero photo, specs, supporting photos, agent block, disclosures — as a PDF sized for letter or A4, in the agent's brand. Also builds the buydown variant of the same flyer when payment scenarios exist. Trigger on \"flyer for [address]\", \"property flyer\", \"make the handout\", \"open house flyer\", \"print piece\", or as a step inside listing-package or open-house-package. Do NOT trigger for social graphics — that is listing-carousel.", "body": "# Listing Flyer — the thing people pick up and take home\n\nThe flyer is the only piece in this library that gets printed, which means every mistake\nis permanent and sits in a stack on a kitchen counter. Slower, more careful pass than\nanything digital.\n\nReads `listings/<slug>/LISTING.md`, `listings/<slug>/BUYDOWN.md` if present, and\n`profile/AGENT.md`.\n\n---\n\n## Layouts\n\n**Standard property flyer (default)** — one page, letter (8.5 x 11 in) portrait unless\nthe agent's market uses A4.\n\n- Top third: hero photo, full bleed to the margins. Address and city over it or directly\n  beneath it, whichever keeps text off a busy area.\n- Price, prominent, with beds / baths / interior sqft / lot sqft / year built as a clean\n  spec row.\n- Middle: three to five supporting photos in a grid, sized so nothing is a thumbnail.\n- Short body copy: three to five sentences maximum, built around the distinctive feature\n  and its sentence from `LISTING.md`. Nobody reads a flyer paragraph.\n- Bottom block: agent headshot, name, title, license number, phone, email, brokerage name\n  and logo, Equal Housing Opportunity statement.\n- Fine print: HOA dues if any, and the \"information deemed reliable but not guaranteed\"\n  line the agent's brokerage uses.\n\n**Open house variant** — same layout, with the open house day, date, and time window as\nthe most prominent element after the address, plus a QR code linking to the sign-in page\nfrom `open-house-signin`.\n\n**Buydown variant** — a second page or a separate flyer. The scenario table from\n`BUYDOWN.md` occupies the top half, the property occupies the bottom half, and the full\ndisclaimer block sits at the foot at a legible size. Never shrink the disclaimer to make\nroom.\n\n## Print production rules\n\nThese are the ones people get wrong:\n\n- **300 DPI.** Render or export at 300 dots per inch at final size. A 1080px photo is a\n  screen asset; it prints soft. Check the source resolution of every image before\n  placing it, and say so if a photo is too small rather than placing it anyway.\n- **0.25 inch bleed** on anything intended for a commercial printer; 0.5 inch safe\n  margin inside the trim on all four sides. Nothing important within the safe margin.\n- **Export as PDF, not PNG or JPG.** Vector text stays sharp; rasterized text does not.\n- Check the file size. Over about 10 MB and email will bounce it; run a compression pass\n  and verify the photos still look right afterward.\n- If the agent is printing at home, produce a no-bleed version too, because home printers\n  cannot print to the edge.\n\n## Build method\n\nAuthor in HTML and CSS with a `@page { size: letter; margin: 0 }` rule and print-to-PDF\nfrom a headless browser. It gives real text in the PDF, the agent's actual brand fonts,\nand a file anyone can re-render later.\n\nUse CSS physical units (`in`, `mm`, `pt`) throughout, not `px`. Mixing pixel units into a\nprint layout is how flyers come out at 92% scale.\n\nThen open the PDF and look at it. Every time.\n\n## Before it ships\n\n- `compliance-check` on all copy. License number and brokerage present and at the size\n  the brokerage requires.\n- `source-check` on every number, including the square footage and the HOA dues.\n- If it is another agent's listing, their name and brokerage are credited, and photo\n  permission is recorded in `LISTING.md`.\n- Confirm the QR code, if present, actually resolves — scan it, do not assume it.\n\n## Output\n\n`listings/<slug>/flyer-<variant>.pdf`, plus the source HTML alongside it so it can be\nregenerated when the price changes. Note it in the listing's Status log.\n\n## Chains from / into\n\nCalled by `listing-package`, `open-house-package`. Reads `listing-intake`, `buydown-math`,\n`open-house-signin` (for the QR target).\n\n---\n\n<!-- self-improvement-loop v1 -->\n\n## Self-improvement loop\n\nBefore ending a run of this skill, review the run:\n\n1. Did any step fail, stall, or need a workaround you had to invent?\n2. Did the user correct, reject, or rewrite something meaningful in the output?\n3. Did you discover something a future run would want to know (a path that moved, a\n   tool that replaced another, a preference they stated out loud)?\n\nIf yes to any, propose a specific edit to this SKILL.md in one or two lines and ask\nwhether to apply it. Propose only changes that would alter a future run's behavior --\nskip cosmetic rewording, and never propose more than two edits at once.\n\nDo not edit this file without their go-ahead. If they say no, drop it and do not re-raise\nthe same suggestion in a later run of the same session.\n", "path": "listing-flyer/SKILL.md", "orchestrator": false, "calls": ["buydown-math", "compliance-check", "listing-intake", "listing-package", "open-house-package", "open-house-signin", "source-check"], "calledBy": ["agent-profile", "buydown-math", "compliance-check", "listing-description", "listing-intake", "listing-package", "open-house-flyer", "source-check"]}, {"id": "listing-intake", "folder": "listing-intake", "dept": "listings", "deptLabel": "Listings", "hue": 28, "description": "Collect and verify every fact about one property in a single pass, then write it to a per-listing file that all downstream listing skills read — address, price, beds, baths, square footage, lot size, year built, HOA, status, photo inventory, and the distinctive feature that actually sells it. Trigger on \"new listing\", \"set up [address]\", \"I just took a listing\", \"here's the property\", or automatically as step 1 of listing-package and open-house-package. Do NOT trigger for a buyer lead or a market-wide question.", "body": "# Listing Intake — one pass, verified, written down\n\nEvery downstream piece (flyer, carousel, remarks, buydown, QR page, captions) reads this\nfile. Get it right once and nothing downstream has to re-ask or re-guess.\n\n---\n\n## Step 0 — Recover before you create\n\nCheck `listings/<address-slug>/LISTING.md`. If it exists, a prior session already made\ndecisions. **Those win** unless you have a stated reason they are wrong. Never silently\nre-decide a chosen photo or an approved line of copy.\n\nSlug format: `123-main-st-anytown` — number, street, city, lowercase, hyphens.\n\n## Step 1 — Ask for everything in ONE message\n\nDo not trickle-ask across five turns. An agent's patience for this is one message long.\n\n**Required:**\n- Full property address including city, state, ZIP\n- List price\n- Beds, full baths, partial baths\n- Interior square footage, lot square footage\n- Year built\n- Property type\n- MLS number and status\n- Photos: a folder path, a shared-drive link, or the public listing URL\n\n**Required if it is a co-listing or another agent's listing:**\n- Listing agent name(s), brokerage, and license number\n- Written permission to use their photos and market the property\n\n**Required if there is an HOA:**\n- HOA dues, frequency, and what the dues cover\n\n**Ask once, then move on if they do not have it:**\n- What the seller or the agent most wants highlighted\n- Recent improvements with dates\n- Parking, garage, pool, ADU, solar (owned or leased — this matters)\n- Showing instructions\n\n**If a Required field is still missing after your one message, that is the one\nexception to \"ask once.\"** Send a second, short message asking only for the specific\nRequired fields still missing (e.g. \"just need the full address and lot size to pull the\nMLS record\"). Do not invent a placeholder and do not proceed to Step 2 until you have\neither an answer or an explicit \"the agent doesn't know\" for every Required field — record\n\"agent doesn't know, needs confirmation\" as the answer where that is the case, and carry\nit into `## Not verified` in Step 4.\n\n**Never ask them for the lender rate sheet.** `buydown-math` goes and gets a current\ndated one itself, or it blocks.\n\n## Step 2 — Verify against the MLS\n\nOpen the MLS record **this session** and confirm: beds, baths, interior sqft, lot size,\nlist price, year built, status, and HOA. The MLS is the source of record for a property's\nfacts.\n\n**Do not** take property facts from the agent's message alone, from a prior session, or\nfrom memory. Agents relay from other agents and everyone rounds. A flyer that says 2,400\nsqft when the MLS says 2,180 is a real problem.\n\nIf MLS access is not available this session, the public listing page is an acceptable\nfallback **for property facts only** — label it as such in the file. Aggregator pages are\nnever acceptable for market statistics; see `source-check`.\n\nRecord what you actually opened, and when.\n\n## Step 3 — Inventory the photos\n\nList every image file with a one-line description. Then pick and mark:\n\n- **Hero** — the single best exterior or signature shot. This is slide one and the flyer\n  cover. It is the house, never a logo and never the agent.\n- **The distinctive feature** — the one thing about this property nobody else has. A\n  mature fruit-bearing yard, an original 1920s stair, a workshop, a view. Find the\n  sentence for it: *\"you can renovate a kitchen, you cannot grow that.\"* Every property\n  has one. Write the sentence into the file; every downstream skill reuses it.\n- **Supporting set** — six to ten in the order a buyer would walk the house.\n- **Do not use** — anything with people in it, a neighbor's property, a visible address\n  on a package, a pet, or a mirror with the photographer in it.\n\nFlag photo quality honestly. If the photos are phone snapshots in bad light, say so and\nsay that a professional shoot changes the result more than any graphic will.\n\n## Step 4 — Write the file\n\n`listings/<address-slug>/LISTING.md`, with sections:\n\n```\n## Property        (every verified fact, one per line)\n## Sources         (what you opened, with the date)\n## Photos          (file, role, one-line description)\n## The one thing   (the distinctive feature and its sentence)\n## Seller priorities\n## Compliance notes (permissions, HOA disclosure, solar lease, known issues)\n## Status log      (dated line per downstream piece produced)\n```\n\nThen a `## Not verified` list — anything the agent asserted that you could not confirm.\nThat list is what blocks downstream pieces, and it should be short and explicit.\n\n## Guardrails\n\n- **Fair housing starts here.** Describe the house and the lot. Nothing about the\n  neighborhood's character, its schools, who lives there, or whether it is \"safe\" or\n  \"family-friendly\". `compliance-check` will catch it, but do not write it in the first\n  place.\n- **No valuation opinion.** Not underpriced, not a deal, not what it is \"really worth\".\n- **Solar leases, HOA special assessments, permit status on additions, and known material\n  defects** get recorded in Compliance notes even if they never appear in marketing. The\n  agent needs to see them in one place.\n\n## Chains into\n\n`listing-flyer`, `listing-carousel`, `listing-description`, `buydown-math`,\n`open-house-flyer`, `open-house-signin`, `social-caption`.\n\n---\n\n<!-- self-improvement-loop v1 -->\n\n## Self-improvement loop\n\nBefore ending a run of this skill, review the run:\n\n1. Did any step fail, stall, or need a workaround you had to invent?\n2. Did the user correct, reject, or rewrite something meaningful in the output?\n3. Did you discover something a future run would want to know (a path that moved, a\n   tool that replaced another, a preference they stated out loud)?\n\nIf yes to any, propose a specific edit to this SKILL.md in one or two lines and ask\nwhether to apply it. Propose only changes that would alter a future run's behavior --\nskip cosmetic rewording, and never propose more than two edits at once.\n\nDo not edit this file without their go-ahead. If they say no, drop it and do not re-raise\nthe same suggestion in a later run of the same session.\n", "path": "listing-intake/SKILL.md", "orchestrator": false, "calls": ["buydown-math", "compliance-check", "listing-carousel", "listing-description", "listing-flyer", "open-house-flyer", "open-house-signin", "social-caption", "source-check"], "calledBy": ["agent-profile", "buydown-math", "listing-carousel", "listing-description", "listing-flyer", "meeting-brief", "open-house-flyer"]}, {"id": "listing-package", "folder": "listing-package", "dept": "listings", "deptLabel": "Listings", "hue": 28, "description": "Orchestrator. Produces the complete marketing package for one new listing in a single run — verified property file, MLS remarks, print flyer, social carousel, buydown scenarios, captions, and a posting schedule — by calling the individual listing skills in order. Trigger on \"full package for [address]\", \"market this listing\", \"I just took a listing, do everything\", \"listing package\", \"the whole thing for [address]\". Use the individual skills instead when the agent wants only one piece.", "body": "# Listing Package — the orchestrator\n\nRuns the listing skills in dependency order and hands back one package plus a schedule.\n\n**Each step below is its own skill and can be run alone.** That is the point of the\nsplit: an agent who only wants a flyer runs `listing-flyer`, and an agent who wants\neverything runs this.\n\n---\n\n## The chain\n\n```\nlisting-package\n├─ 0. agent-profile          (only if profile/AGENT.md is missing)\n├─ 1. listing-intake          → listings/<slug>/LISTING.md\n├─ 2. listing-description     → MLS public + private remarks, short + hook\n├─ 3. buydown-math            → listings/<slug>/BUYDOWN.md    [may BLOCK, see below]\n├─ 4. listing-flyer           → flyer-standard.pdf (+ flyer-buydown.pdf only if step 3\n│                                did not block)\n├─ 5. listing-carousel (A)    → photo-led slides\n├─ 6. listing-carousel (B)    → buydown slides                [skipped if step 3 blocked]\n├─ 7. social-caption × N      → one caption per asset\n├─ 8. compliance-check        → gate on everything above\n├─ 9. source-check            → gate on every number above\n└─ 10. schedule + handoff\n```\n\n## Running it\n\n**Do step 1 completely before anything else.** Every later step reads `LISTING.md`, and\nre-asking the agent for the square footage in step 4 destroys the whole impression of a\nsystem that works.\n\n**Step 3 is allowed to block, and blocking is a success.** `buydown-math` blocks if ANY\none of its five gate items is missing (dated rate sheet within 2 business days, the\npricing convention, a dated MI quote if MI applies, the full assumption set, or the\nlender's NMLS ID) — a missing rate sheet is the most common trigger but not the only one.\nWhen it blocks, for any reason:\n\n- Skip steps 6 and the buydown flyer\n- Deliver everything else\n- Tell the agent in one line what is missing and give them the exact sentence to forward\n  to their lender\n- Do NOT estimate a payment to keep the package complete\n\n**Steps 8 and 9 are gates, not reviews.** If `compliance-check` returns any `BLOCK`, the\npackage does not go out. Say that in your first line, then offer the fixed version.\n\n## The schedule to hand back\n\nDo not dump nine files and walk away. Give them a dated plan:\n\n| Day | Piece | Where |\n|---|---|---|\n| Day 0 | MLS remarks live | MLS |\n| Day 0 | Flyer printed | Listing, brochure box, office |\n| Day 1 | Listing carousel | Instagram, Facebook |\n| Day 2 | Buydown carousel | Instagram |\n| Day 3-4 | Open house flyer + QR page live | If an open house is set |\n\n**Never post the listing carousel and the buydown carousel on the same day.** They\ncompete with each other for the same audience and both underperform.\n\nIf there is an open house on the calendar, hand off to `open-house-package` rather than\nduplicating its steps here.\n\n## The handoff\n\nDeliver as a list of file paths grouped by where each one goes, plus:\n\n- What is blocked and why, in one line each\n- What needs the agent's approval before it ships\n- The one thing that would most improve the result (usually: better photos, or tagging\n  and crediting the other agents involved)\n\nIf this is another agent's listing being marketed as a favor, tell them to send the\nfinished package to that agent **before** it goes live, framed as \"made you something,\nno charge, use it however you want.\" Finding it on the feed lands worse than receiving\nit, and the relationship is the actual product.\n\n## Ceiling\n\nTwo full packages a week is the realistic ceiling for one person, because each one is\nreal work and the value is in doing it well. Say so if the agent queues five.\n\n---\n\n<!-- self-improvement-loop v1 -->\n\n## Self-improvement loop\n\nBefore ending a run of this skill, review the run:\n\n1. Did any step fail, stall, or need a workaround you had to invent?\n2. Did the user correct, reject, or rewrite something meaningful in the output?\n3. Did you discover something a future run would want to know (a path that moved, a\n   tool that replaced another, a preference they stated out loud)?\n\nIf yes to any, propose a specific edit to this SKILL.md in one or two lines and ask\nwhether to apply it. Propose only changes that would alter a future run's behavior --\nskip cosmetic rewording, and never propose more than two edits at once.\n\nDo not edit this file without their go-ahead. If they say no, drop it and do not re-raise\nthe same suggestion in a later run of the same session.\n", "path": "listing-package/SKILL.md", "orchestrator": true, "calls": ["buydown-math", "compliance-check", "listing-flyer", "open-house-package"], "calledBy": ["buydown-math", "compliance-check", "listing-carousel", "listing-description", "listing-flyer", "social-caption", "source-check"]}, {"id": "market-brief", "folder": "market-brief", "dept": "market", "deptLabel": "Market", "hue": 265, "description": "Write the client-facing monthly market update for one area from a market-pull data file — what the numbers say, what it means for a buyer, what it means for a seller, in the agent's own voice, with sources and as-of dates attached. Trigger on \"write the market update\", \"monthly market brief\", \"what do I tell my sphere about the market\", \"market report for [city]\", or as a step inside market-update-package. Do NOT trigger to pull data — that is market-pull.", "body": "# Market Brief — the numbers turned into something a client can use\n\nThe brief is the highest-leverage recurring piece an agent produces. It is proof they know\ntheir market, it justifies the monthly email, and it gives every follow-up a reason to\nexist that is not \"just checking in.\"\n\nReads `data/market/<area-slug>-<YYYY-MM>.md`, `profile/AGENT.md`, `profile/VOICE.md`.\n\n**If the data file does not exist for the current period, stop and run `market-pull`\nfirst.** Do not write a brief from a previous month's numbers and do not write around the\nabsence of data.\n\n---\n\n## Structure\n\n**1. The headline — one sentence.** What actually changed. Not \"the market remains\ndynamic.\" Something like: \"Median sold price held flat while homes took 11 days longer to\nsell than a year ago.\" If nothing changed, say nothing changed. That is a real finding and\nsaying it builds more trust than manufacturing a trend.\n\n**2. The numbers table.** Four to six metrics, each with the current value, the\nyear-over-year comparison, and the sample size. Not every metric from the pull — pick the\nones that moved and the ones a normal person understands.\n\n**3. What it means if you are buying.** Two or three sentences, concrete. More choices,\nless competition, room to negotiate — or the opposite. Never a prediction.\n\n**4. What it means if you are selling.** Same treatment. Pricing, timing, what condition\nis worth.\n\n**5. The honest caveat.** Where the data is thin, where the area definition matters,\nwhat would change the picture. Including this makes the confident parts more believable.\n\n**6. Sources block.** MLS name, area definition verbatim, date range, pull date. Every\ntime, at the foot of the brief.\n\n## Rules that keep it defensible\n\n- **Never predict.** No \"prices will rise\", no \"now is the time to buy\", no \"we expect\".\n  Describe what happened. Interpretation of the past is a service; forecasting is a\n  liability.\n- **Never say \"it's a good time to buy\" or \"a good time to sell.\"** It is a good time for\n  some people and a bad time for others, and saying so is more useful and more honest.\n- **Median, not average**, and say which. One expensive sale moves an average and tells a\n  false story.\n- **Sample size travels with every percentage.** \"Down 12%\" on nine sales is noise.\n  Report the nine.\n- **Year-over-year, not month-over-month**, unless there is a specific reason. Real\n  estate is seasonal and MoM mostly measures the calendar.\n- **Do not blend property types** without saying so.\n- Every number routes through `source-check`. Every time.\n- Every neighborhood or area description routes through `compliance-check` — this is the\n  piece where \"desirable area\" and school-quality claims sneak in most often.\n\n## Length and format\n\n- **Email version:** 250 to 400 words. Nobody reads more. Table plus four short sections.\n- **One-page PDF version:** same content, the agent's brand, the numbers set larger, the\n  sources block at the foot.\n- **Three-line text version:** the headline, one number, and one question. This is what\n  actually gets replies.\n\n## Voice\n\nRun `agent-voice`. The market brief is where generated copy is most obvious, because\nevery agent in the country sends one and most of them read identically. The agent's actual\nregister is the entire differentiator. Scan the draft for banned words before delivering.\n\n## Chains from / into\n\nReads `market-pull`. Called by `market-update-package`. Feeds `market-carousel`,\n`sphere-message`, `social-caption`, `meeting-brief`, `open-house-followup`.\n\n---\n\n<!-- self-improvement-loop v1 -->\n\n## Self-improvement loop\n\nBefore ending a run of this skill, review the run:\n\n1. Did any step fail, stall, or need a workaround you had to invent?\n2. Did the user correct, reject, or rewrite something meaningful in the output?\n3. Did you discover something a future run would want to know (a path that moved, a\n   tool that replaced another, a preference they stated out loud)?\n\nIf yes to any, propose a specific edit to this SKILL.md in one or two lines and ask\nwhether to apply it. Propose only changes that would alter a future run's behavior --\nskip cosmetic rewording, and never propose more than two edits at once.\n\nDo not edit this file without their go-ahead. If they say no, drop it and do not re-raise\nthe same suggestion in a later run of the same session.\n", "path": "market-brief/SKILL.md", "orchestrator": false, "calls": ["agent-voice", "compliance-check", "market-carousel", "market-pull", "market-update-package", "meeting-brief", "open-house-followup", "social-caption", "source-check", "sphere-message"], "calledBy": ["agent-profile", "agent-voice", "market-carousel", "market-pull", "open-house-followup", "source-check"]}, {"id": "market-carousel", "folder": "market-carousel", "dept": "market", "deptLabel": "Market", "hue": 265, "description": "Build the social carousel that presents one area's market statistics as readable graphics — cover, three to five stat slides, what it means for buyers and sellers, and a sources slide with the MLS name and as-of date. Trigger on \"market carousel\", \"make the stats slides\", \"post the market update\", \"city carousel\", or as a step inside market-update-package. Do NOT trigger for a single property — that is listing-carousel.", "body": "# Market Carousel — the recurring post that proves the agent knows their market\n\nThe most repeatable content an agent has, because the data refreshes every month on its\nown. Build the template once, and every month after is a data swap.\n\nReads `data/market/<area-slug>-<YYYY-MM>.md`, the brief from `market-brief` if it exists,\nand `profile/AGENT.md`.\n\n**Do not build this without a current `market-pull` file.** No exceptions, no\nlast-month's-numbers, no aggregator fill-ins.\n\n---\n\n## Slide plan (7 slides)\n\n1. **Cover** — the area name, the month and year, and the one-sentence headline from the\n   brief. The month must be on the cover; these posts get found months later and an\n   undated stat graphic is a liability.\n2. **The headline metric** — usually median sold price. One enormous number, the\n   year-over-year change beneath it, and the sample size in small type. The sample size\n   goes on the slide, not only in the caption.\n3. **Speed** — median days on market for **sold** listings, with YoY. Label it \"days to\n   sell (sold listings)\" so nobody reads it as active inventory age.\n4. **Supply** — active listings, pendings, and months of supply.\n5. **What this means if you're buying** — two or three lines, no prediction.\n6. **What this means if you're selling** — same.\n7. **Sources** — MLS name, the area definition verbatim, the date range, the pull date,\n   plus the agent's name, license number, brokerage, and Equal Housing Opportunity.\n\nSlide 7 is not optional and does not get dropped for aesthetics. It is what separates this\nfrom the thousands of unsourced stat graphics agents post every month, and it is the slide\nanother agent will screenshot if the numbers are wrong.\n\n## Design\n\n- **1080 x 1350** (4:5). Design at 2x (2160 x 2700) and downscale.\n- Brand colors and fonts from `profile/AGENT.md`.\n- **One number per slide.** A slide with six statistics on it communicates none of them.\n- Numbers set very large; labels small but legible; the caveat line smaller still but\n  never below ~22px at 1080 wide.\n- Keep the bottom ~120px clear of anything important — the feed UI covers it.\n- If a metric moved less than its own noise floor, say \"roughly flat\" on the slide rather\n  than printing a meaningless 0.4% change.\n\n## Honesty rules on the graphics themselves\n\n- **Never truncate a chart's y-axis** to make a small change look dramatic. This is the\n  single most common lie in real estate stat graphics.\n- Never show a percentage change without its sample size somewhere on the same slide.\n- Never blend property types without labeling it.\n- Never put a projection or a trend arrow extending past the last real data point.\n- Never describe the area's character, its residents, or its schools. Numbers and property\n  facts only. `compliance-check` before it ships.\n\n## Render\n\nOne HTML file per slide, headless-browser render to PNG, output to\n`content/market/<area-slug>-<YYYY-MM>/slide-01.png` and so on.\n\n**Open the rendered PNGs and look at them.** Numbers with more digits than the template\nexpected are the most common overflow, and a clipped median price is worse than no post.\n\n## Reuse\n\nSave the template HTML with the data separated out, so next month is a data swap and a\nre-render rather than a rebuild. Note the template path in the output folder's README so\na future run finds it.\n\n## Chains from / into\n\nReads `market-pull` and `market-brief`. Called by `market-update-package`. Feeds\n`social-caption`.\n\n---\n\n<!-- self-improvement-loop v1 -->\n\n## Self-improvement loop\n\nBefore ending a run of this skill, review the run:\n\n1. Did any step fail, stall, or need a workaround you had to invent?\n2. Did the user correct, reject, or rewrite something meaningful in the output?\n3. Did you discover something a future run would want to know (a path that moved, a\n   tool that replaced another, a preference they stated out loud)?\n\nIf yes to any, propose a specific edit to this SKILL.md in one or two lines and ask\nwhether to apply it. Propose only changes that would alter a future run's behavior --\nskip cosmetic rewording, and never propose more than two edits at once.\n\nDo not edit this file without their go-ahead. If they say no, drop it and do not re-raise\nthe same suggestion in a later run of the same session.\n", "path": "market-carousel/SKILL.md", "orchestrator": false, "calls": ["compliance-check", "market-brief", "market-pull", "market-update-package", "social-caption"], "calledBy": ["agent-profile", "carousel-render", "content-week", "market-brief", "market-pull", "social-caption", "source-check"]}, {"id": "market-pull", "folder": "market-pull", "dept": "market", "deptLabel": "Market", "hue": 265, "description": "Pull the current month's statistics for one defined geography from the MLS and write them to a dated, sourced data file that every market skill reads — median sold price, closed sales, sold days on market, months of supply, sale-to-list ratio, active and pending counts. Trigger on \"pull the numbers for [city]\", \"market data\", \"run the stats\", \"what's the market doing in [area]\", or as step 1 of any market skill. Do NOT trigger to write a client-facing brief — that is market-brief, which reads this file.", "body": "# Market Pull — get the numbers, from the MLS, with a date on them\n\nEvery market number this library ever publishes originates here. Separating the pull from\nthe presentation is what makes it possible to check a claim months later.\n\n---\n\n## The MLS rule — read this before anything else\n\n**Market statistics come from the MLS. Full stop.**\n\nConsumer aggregators — Zillow, Redfin, Realtor.com, Homes.com and the rest — publish\nmarket statistics on definitions that do not match the MLS, and the mismatch is not\ncosmetic. The most damaging case: their \"days on market\" typically measures how long a\nlisting has been **active on their site**, not how long a **sold** property took to reach\ncontract. Publishing that as \"average days on market\" is a false claim, and it is the\nnumber an agent gets publicly corrected on by another agent.\n\nAggregator data is acceptable for exactly one thing in this library: confirming a single\nproperty's basic facts when there is no MLS access. Never for a statistic about a market.\n\n**If there is no MLS access this session, this skill does not produce a number.** Report\nthat, name what you tried, and stop. That is honest and it is completely different from\nhanding the agent a wrong figure.\n\n## Define the geography precisely\n\nVague geography is the second-biggest source of wrong market claims. Pin down and record:\n\n- Exactly what area: city, MLS area code, ZIP list, or drawn boundary. Write down the\n  literal definition used.\n- Property types included: SFR only, or SFR + condo + townhome? These move differently\n  and blending them without saying so is misleading.\n- Price band, if filtered\n- The date range, and whether it is calendar month, trailing 30 days, or trailing 12\n  months\n\n**The same definition must be used every month** or the trend line is fiction. Store the\ndefinition in the file and reuse it.\n\n## What to pull\n\n| Metric | Definition to use |\n|---|---|\n| Closed sales | Count of `Sold` in the period |\n| Median sold price | Median of closed sale prices in the period. Median, not average. |\n| Sold price per sqft | Median, on interior sqft |\n| Days on market | Median DOM of **SOLD** listings. Say which DOM field the MLS reports. |\n| Sale-to-list ratio | Median of sold price ÷ final list price |\n| Active listings | Count as of the pull date |\n| Pending / under contract | Count as of the pull date |\n| Months of supply | Active ÷ trailing-12-month average monthly closed sales |\n| New listings | Count entered in the period |\n\nAlso pull the same period one year prior, for year-over-year. Month-over-month in real\nestate is mostly seasonality and it misleads.\n\n**Small samples.** If a metric is built on fewer than about 10 closed sales, the median is\nnoise. Record the sample size next to every metric and flag anything thin. Never publish a\npercentage change built on 4 sales without saying it is built on 4 sales.\n\n## Write the file\n\n`data/market/<area-slug>-<YYYY-MM>.md`:\n\n```\n## Definition\nArea: ...          Property types: ...      Date range: ...\nMLS: ...           Pulled by: ...           Pulled on: YYYY-MM-DD\n\n## Metrics\nmetric | value | sample size | YoY | notes\n\n## Source\nReport name / search ID, exactly as run in the MLS, so it can be re-run.\n\n## Caveats\nAnything thin, anything the MLS defines unusually, anything that changed since last month.\n```\n\n**Never overwrite a prior month's file.** The archive is what makes trends real.\n\n## Handing it on\n\nReturn the file path plus a two-line plain reading: what actually changed, and what did\nnot. Resist narrative. `market-brief` writes the story; this skill produces the facts.\n\n## Chains into\n\n`market-brief`, `market-carousel`, `market-update-package`, `meeting-brief`,\n`open-house-followup` (message 2).\n\n---\n\n<!-- self-improvement-loop v1 -->\n\n## Self-improvement loop\n\nBefore ending a run of this skill, review the run:\n\n1. Did any step fail, stall, or need a workaround you had to invent?\n2. Did the user correct, reject, or rewrite something meaningful in the output?\n3. Did you discover something a future run would want to know (a path that moved, a\n   tool that replaced another, a preference they stated out loud)?\n\nIf yes to any, propose a specific edit to this SKILL.md in one or two lines and ask\nwhether to apply it. Propose only changes that would alter a future run's behavior --\nskip cosmetic rewording, and never propose more than two edits at once.\n\nDo not edit this file without their go-ahead. If they say no, drop it and do not re-raise\nthe same suggestion in a later run of the same session.\n", "path": "market-pull/SKILL.md", "orchestrator": false, "calls": ["market-brief", "market-carousel", "market-update-package", "meeting-brief", "open-house-followup"], "calledBy": ["agent-profile", "followup-queue", "followup-sequence", "home-anniversary", "market-brief", "market-carousel", "market-update-package", "meeting-brief", "source-check"]}, {"id": "market-update-package", "folder": "market-update-package", "dept": "market", "deptLabel": "Market", "hue": 265, "description": "Orchestrator. Runs the full monthly market update for one or more areas — pull the MLS data, write the client brief, build the carousel, write the captions, and stage the sphere email and text for approval. Trigger on \"run the monthly market update\", \"do the market package\", \"it's the first of the month\", \"market update for [city]\", \"monthly numbers\". Use the individual skills when the agent wants only the data or only the post.", "body": "# Market Update Package — the orchestrator for the monthly cycle\n\nThe one recurring routine that makes an agent look like they have a system. It runs on the\ncalendar, not on a listing, which means it produces value in months when nothing else is\nhappening.\n\n**Every step is its own skill and runs alone.**\n\n---\n\n## The chain\n\n```\nmarket-update-package\n├─ 0. agent-profile          (only if profile/AGENT.md is missing)\n├─ 1. market-pull  × area     → data/market/<area>-<YYYY-MM>.md    [may BLOCK]\n├─ 2. market-brief × area     → email version, PDF version, 3-line text version\n├─ 3. market-carousel × area  → 7 slides per area\n├─ 4. social-caption          → caption per carousel\n├─ 5. source-check            → gate on every number\n├─ 6. compliance-check        → gate on all copy and all slides\n└─ 7. stage the sphere send   → held for approval, never auto-sent\n```\n\n## Step 1 is allowed to block\n\nIf there is no MLS access this session, `market-pull` produces nothing and the whole\npackage stops. **This is correct behavior.** Do not substitute aggregator data, do not\nreuse last month's numbers, and do not write a \"qualitative\" brief around the gap.\n\nReport which areas pulled and which did not, and what you tried.\n\n## Timing\n\nRun in the **first week of the month**, for the month that just closed. Sales that close\nlate in a month take a few days to post in the MLS, so pulling on the 1st undercounts.\nWaiting until the 5th or 6th gives a cleaner number, and the brief is still timely.\n\nUse the **same area definitions** every month, read from the prior month's data file.\nChanging the geography silently makes every trend claim false.\n\n## Scale\n\nAsk which areas up front. One area is a 20-minute run; twelve areas is a batch and needs\nthe same definition file reused and the same template re-rendered rather than redesigned.\n\nIf the agent wants more than about six areas, tell them plainly: six well-sourced areas\nthey can speak to beats twelve they cannot. Then build what they ask for.\n\n## Step 7 — staging, not sending\n\nProduce, and hold:\n\n- The email to their sphere (brief, email version), with the recipient list filtered by\n  `consent_tier` and every `optout` removed\n- The three-line text version for the contacts who prefer text\n- The carousel and caption ready to post\n\n**Nothing sends and nothing posts without the agent's explicit go in this session, for\nthis specific batch.** Show them the recipient counts, the subject, and the copy. Approval\non this month's send is not approval on next month's.\n\n## The handoff\n\nReturn:\n\n- File paths grouped by destination\n- The counts: contacts on the email list after filtering, contacts excluded and why\n- Anything blocked, in one line each\n- The single most interesting thing in this month's data, in plain language — the agent\n  will use that line in conversation all month, and it is the real deliverable\n\n## Archive\n\nNever overwrite a prior month. `data/market/` accumulating twelve files is what makes\nnext year's year-over-year claims sourceable instead of asserted.\n\n---\n\n<!-- self-improvement-loop v1 -->\n\n## Self-improvement loop\n\nBefore ending a run of this skill, review the run:\n\n1. Did any step fail, stall, or need a workaround you had to invent?\n2. Did the user correct, reject, or rewrite something meaningful in the output?\n3. Did you discover something a future run would want to know (a path that moved, a\n   tool that replaced another, a preference they stated out loud)?\n\nIf yes to any, propose a specific edit to this SKILL.md in one or two lines and ask\nwhether to apply it. Propose only changes that would alter a future run's behavior --\nskip cosmetic rewording, and never propose more than two edits at once.\n\nDo not edit this file without their go-ahead. If they say no, drop it and do not re-raise\nthe same suggestion in a later run of the same session.\n", "path": "market-update-package/SKILL.md", "orchestrator": true, "calls": ["market-pull"], "calledBy": ["market-brief", "market-carousel", "market-pull", "social-caption", "source-check"]}, {"id": "meeting-brief", "folder": "meeting-brief", "dept": "pipeline", "deptLabel": "Pipeline", "hue": 192, "description": "Build a one-page brief before a listing appointment, buyer consultation, showing, or any meeting with a client or another agent — who they are, the history, the property, the MLS-sourced numbers, and the three questions to ask. Trigger on \"brief me on [name]\", \"I have a listing appointment\", \"prep me for this meeting\", \"who am I meeting\", \"before my 2 o'clock\", \"listing presentation prep\". Do NOT trigger for a written follow-up after the meeting — that is sphere-message.", "body": "# Meeting Brief — read it in the car\n\nThe whole value is that it is short enough to read in the five minutes before walking in.\nOne page. If it runs to three, it will not be read and it produced nothing.\n\nReads `data/contacts.csv`, `data/pipeline.csv`, `records/sent-log.md`,\n`data/market/`, and `listings/` if a property is involved.\n\n---\n\n## Ask first\n\nWhat kind of meeting, with whom, when, and where. A listing appointment, a buyer\nconsultation, a showing, and a coffee with another agent need different briefs, and\nproducing the wrong one wastes the run.\n\n## The brief\n\n**1. Who — three lines.** Name, how the agent knows them, and the single most important\npiece of context. Not a biography.\n\n**2. History — the last three touches.** What was sent, when, and what they replied. Pull\nfrom `records/sent-log.md`. This is the part agents most want and most often walk in\nwithout.\n\n**3. What they said they want**, in their own words if the record has them. Their words\nbeat any summary.\n\n**4. The property, if there is one.** Address, verified specs from `listing-intake` or the\nMLS, days on market, price history, and anything in the compliance notes the agent needs\nto know before standing in the room.\n\n**5. The numbers — MLS-sourced, dated.** For a listing appointment: recent comparable\nsales with addresses, close dates, and prices; current actives; median days to sell. Every\nfigure from `market-pull`, every one carrying its as-of date.\n\n**Never bring an aggregator estimate into a listing appointment.** The seller has already\nseen the aggregator's number, and the agent's entire credibility in that room rests on\nbeing the person with the real data. Bringing the same estimate back is the worst possible\noutcome. If MLS data cannot be pulled this session, say so plainly and say the appointment\nneeds it — do not fill the section with something softer.\n\n**6. Three questions to ask.** Real ones, specific to this person and this property. This\nsection makes the meeting go well more than any of the data does.\n\n**7. One thing to watch.** The likely objection, the thing they were unhappy about last\ntime, the competing agent, the timeline pressure. One, not five.\n\n## Rules\n\n- **Everything is sourced.** Every number cites where it came from and when. Run\n  `source-check`. An agent quoting a wrong number in a listing appointment loses the\n  listing on the spot.\n- **No valuation opinion in the brief.** Provide the comparables and let the agent form\n  the opinion. That is their license and their judgment.\n- **Nothing about the client's demographics, family composition, national origin,\n  religion, or anything protected.** Not in a private internal brief either — it has no\n  legitimate use, and a discoverable file containing it is a liability.\n- **Do not invent history.** If there is no record of prior contact, say \"no prior contact\n  recorded.\" That is useful information; a fabricated warm history is a disaster in the\n  room.\n- If the meeting is with another agent about a co-listing or a referral, include their\n  brokerage and anything the record holds about prior dealings, and nothing speculative.\n\n## Format\n\nOne page. Markdown, and a PDF if they want it on a phone. Bold the three or four things\nthat matter most so it survives a 90-second skim.\n\n## Chains from / into\n\nReads `lead-intake`, `market-pull`, `listing-intake`, `contact-import` output. Uses\n`source-check`. Feeds `sphere-message` for the follow-up afterward.\n\n---\n\n<!-- self-improvement-loop v1 -->\n\n## Self-improvement loop\n\nBefore ending a run of this skill, review the run:\n\n1. Did any step fail, stall, or need a workaround you had to invent?\n2. Did the user correct, reject, or rewrite something meaningful in the output?\n3. Did you discover something a future run would want to know (a path that moved, a\n   tool that replaced another, a preference they stated out loud)?\n\nIf yes to any, propose a specific edit to this SKILL.md in one or two lines and ask\nwhether to apply it. Propose only changes that would alter a future run's behavior --\nskip cosmetic rewording, and never propose more than two edits at once.\n\nDo not edit this file without their go-ahead. If they say no, drop it and do not re-raise\nthe same suggestion in a later run of the same session.\n", "path": "meeting-brief/SKILL.md", "orchestrator": false, "calls": ["contact-import", "lead-intake", "listing-intake", "market-pull", "source-check", "sphere-message"], "calledBy": ["agent-profile", "lead-intake", "market-brief", "market-pull"]}, {"id": "open-house-flyer", "folder": "open-house-flyer", "dept": "open-house", "deptLabel": "Open House", "hue": 152, "description": "Build the event flyer for a specific open house — the property, the day, date and time window, the QR code to the sign-in page, and the agent block — plus the matching directional sign copy and the neighbor invitation card. Trigger on \"open house flyer\", \"flyer for Saturday\", \"make the open house handout\", \"directional signs\", \"neighbor invite\", or as a step inside open-house-package. Do NOT trigger for a standard listing flyer with no event — that is listing-flyer.", "body": "# Open House Flyer — the event piece\n\nA listing flyer sells the house. An open house flyer sells **being there at 1pm on\nSaturday**, and then converts the visitor into a contact. Different job, different\nhierarchy.\n\nReads `listings/<slug>/LISTING.md`, `profile/AGENT.md`, and the QR target produced by\n`open-house-signin`.\n\n---\n\n## Hierarchy on the page\n\nThe order of prominence, top to bottom:\n\n1. **Hero photo** — full bleed across the top third\n2. **Day, date, and time window** — the largest type on the page after the address.\n   \"SATURDAY, MARCH 8 · 1–4 PM\". Spell the day out; nobody parses \"3/8\".\n3. **Address and city**\n4. **Price and the spec row** — beds / baths / interior sqft / lot sqft / year built\n5. **Three or four supporting photos**\n6. **Three to five sentences** built on the distinctive feature from `LISTING.md`\n7. **QR code** with a short human-readable URL beneath it, and one line of why to scan:\n   \"scan to sign in\" or \"scan for the full photo set\"\n8. **Agent block** — headshot, name, license number, phone, email, brokerage and logo,\n   Equal Housing Opportunity\n\nPrint production rules — 300 DPI, 0.25in bleed, 0.5in safe margin, export as PDF, CSS\nphysical units — are the same as `listing-flyer`. Follow that skill's production section\nrather than reinventing it here.\n\n## Also produce, in the same run\n\n**Directional sign copy.** Short. An arrow direction, \"OPEN HOUSE\", the day and time, and\nthe agent's name. Nothing else — people read these at 30 mph. Ask how many signs and\nwhich corners, and produce one per direction. Check the city's rules on sign placement and\nwhether the HOA permits them; some cities and most HOAs restrict both, and a confiscated\nsign is a wasted Saturday.\n\n**Neighbor invitation card.** Half-page or postcard sized. The property, the day and time,\nand a genuine invitation to come see the inside. **No valuation hook** — nothing that\nimplies what their own home is worth or promises a number. Describe the event.\n\n**A \"just sold / just listed\" version** of the same layout, for reuse afterward, so the\nagent gets a second piece from one build.\n\n## Before it ships\n\n- **Scan the QR with a real phone from the printed proof.** Not from the screen. A QR\n  that fails at the door wastes the entire capture strategy for that day.\n- `compliance-check` on all copy, including the neighbor card.\n- `source-check` on the specs and the price.\n- Confirm the date and time are correct against the agent's calendar. A flyer with the\n  wrong Saturday on it is the most expensive typo in this library.\n\n## Output\n\n`listings/<slug>/open-house-<date>/` containing `flyer.pdf`, `signs.pdf`,\n`neighbor-card.pdf`, and the source HTML for each.\n\n## Chains from / into\n\nCalled by `open-house-package`. Needs `open-house-signin` to have run first (for the QR\ntarget). Reads `listing-intake`. Shares production rules with `listing-flyer`.\n\n---\n\n<!-- self-improvement-loop v1 -->\n\n## Self-improvement loop\n\nBefore ending a run of this skill, review the run:\n\n1. Did any step fail, stall, or need a workaround you had to invent?\n2. Did the user correct, reject, or rewrite something meaningful in the output?\n3. Did you discover something a future run would want to know (a path that moved, a\n   tool that replaced another, a preference they stated out loud)?\n\nIf yes to any, propose a specific edit to this SKILL.md in one or two lines and ask\nwhether to apply it. Propose only changes that would alter a future run's behavior --\nskip cosmetic rewording, and never propose more than two edits at once.\n\nDo not edit this file without their go-ahead. If they say no, drop it and do not re-raise\nthe same suggestion in a later run of the same session.\n", "path": "open-house-flyer/SKILL.md", "orchestrator": false, "calls": ["compliance-check", "listing-flyer", "listing-intake", "open-house-package", "open-house-signin", "source-check"], "calledBy": ["agent-profile", "listing-intake", "open-house-package", "open-house-signin"]}, {"id": "open-house-followup", "folder": "open-house-followup", "dept": "open-house", "deptLabel": "Open House", "hue": 152, "description": "Turn an open house sign-in list into individually drafted follow-up messages, segmented by what each visitor said they were, on a timed cadence — and hold every message for the agent's approval before anything sends. Trigger on \"follow up on the open house\", \"who came Sunday\", \"draft the open house follow-ups\", \"what do I send the people who came\", or as the final step of open-house-package. Do NOT trigger for general sphere touches — that is followup-queue.", "body": "# Open House Follow-Up — the 48 hours that decide whether the open house was worth it\n\nMost agents hold the open house and then send nothing, or send one identical blast. The\nfollow-up is where the open house actually pays.\n\nReads `data/open-house-<slug>-<date>.csv`, `listings/<slug>/LISTING.md`,\n`profile/AGENT.md`, and `profile/VOICE.md`.\n\n---\n\n## Segment first\n\nSplit the sign-in list by what each visitor told you:\n\n| They said | What they are | Cadence |\n|---|---|---|\n| Actively looking | The reason to hold open houses | Same day, then day 3, then weekly |\n| Just looking | Long horizon, real | Same day, then day 7, then monthly |\n| Working with an agent | Do not poach | ONE courteous message, then stop |\n| Neighbor | Future seller, best source | Same day, then at the sale |\n\n**The \"working with an agent\" rule is a hard line.** Send one message thanking them for\ncoming and nothing else. Do not add them to a nurture sequence. Soliciting a client under\nan exclusive representation agreement is an ethics complaint, and in most markets the\nother agent will find out.\n\n## Consent filter (runs before anything is drafted)\n\nDrop every row whose `consent_tier` is `unknown` from all automated and bulk messaging.\nThey can be called or written to one at a time by the agent personally, and that is the\nagent's judgment call — but this library will not queue them.\n\nDrop every row tagged `optout`, permanently, across all channels.\n\nSay the counts out loud: \"42 signed in, 31 consented, 4 already working with an agent,\n7 excluded for no consent.\"\n\n## Draft each message individually\n\nNot a template with a merge field. The whole advantage here is that each visitor had a\ndifferent conversation.\n\nEvery message should carry **one specific thing** — what they said about the kitchen,\nthat they mentioned a commute, that they asked about the schools district assignment,\nthat they were the neighbor two doors down. Ask the agent for their notes from the day. If\nthey have none, ask for the three visitors they remember and draft those individually,\nand keep the rest short and honest rather than fake-personal.\n\n**Message 1 (same day, evening):** thank them, one specific reference, one useful thing\n(the listing link, the flyer PDF, the answer to a question they asked), one low-pressure\nopen. Short. Two or three sentences.\n\n**Message 2 (day 3):** the actual value. What sold, what came on, what the property did.\nThis is where `market-brief` output gets attached — MLS-sourced, dated.\n\n**Message 3 (day 7+):** the ask, once. A call, a showing, a buyer consultation. Then move\nthem to the long cadence in `followup-sequence`.\n\n**Voice:** run `agent-voice` on every draft. Scan for the banned words before delivering.\n\n## The approval gate — this is not optional\n\n**Nothing sends automatically. Ever.**\n\nPresent the batch as a numbered list: recipient, channel, and the full message copy for\neach one, in a file the agent can read and edit, not buried in chat scrollback. Then\nwait.\n\n- The agent approves the batch, or specific numbers, in this session.\n- Approval on one batch is never approval on the next batch, the next wave, or tomorrow.\n  New batch, new ask.\n- \"Looks good\", silence, or ambiguity is not approval. If you are not certain, ask in one\n  line and wait.\n- After sending, say plainly what went and what did not. Count them. Name anything that\n  failed. Never report a send as complete when a call errored.\n\n## Log it\n\nWrite every sent message to `records/sent-log.md` with date, recipient, channel, and the\ncopy. Update `last_touch` in `data/contacts.csv`. Merge new consented visitors into the\ncontacts file via `contact-import` so they flow into the sphere skills from then on.\n\n## Chains from / into\n\nCalled by `open-house-package`. Reads `open-house-signin` output. Uses `agent-voice`.\nHands long-term contacts to `followup-sequence` and `sphere-daily`.\n\n---\n\n<!-- self-improvement-loop v1 -->\n\n## Self-improvement loop\n\nBefore ending a run of this skill, review the run:\n\n1. Did any step fail, stall, or need a workaround you had to invent?\n2. Did the user correct, reject, or rewrite something meaningful in the output?\n3. Did you discover something a future run would want to know (a path that moved, a\n   tool that replaced another, a preference they stated out loud)?\n\nIf yes to any, propose a specific edit to this SKILL.md in one or two lines and ask\nwhether to apply it. Propose only changes that would alter a future run's behavior --\nskip cosmetic rewording, and never propose more than two edits at once.\n\nDo not edit this file without their go-ahead. If they say no, drop it and do not re-raise\nthe same suggestion in a later run of the same session.\n", "path": "open-house-followup/SKILL.md", "orchestrator": false, "calls": ["agent-voice", "contact-import", "followup-sequence", "market-brief", "open-house-package", "open-house-signin", "sphere-daily"], "calledBy": ["agent-voice", "followup-sequence", "market-brief", "market-pull", "open-house-package", "open-house-signin", "sphere-message"]}, {"id": "open-house-package", "folder": "open-house-package", "dept": "open-house", "deptLabel": "Open House", "hue": 152, "description": "Orchestrator. Produces everything one open house needs, on the right timeline — event flyer with QR, digital sign-in page, social carousel and captions, neighbor invitation, day-of checklist, and the segmented follow-up drafts afterward — by calling the individual skills in order. Trigger on \"open house Saturday\", \"I'm holding [address] open\", \"open house package\", \"everything for the open house\", \"set up my open house\". Use the individual skills when the agent wants only one piece.", "body": "# Open House Package — the orchestrator\n\nAn open house is a dated event, so this orchestrator is built around a countdown rather\nthan a checklist. Ask for the date and time window first; everything else schedules off\nit.\n\n**Every step is its own skill and runs alone.** An agent who only needs the QR page runs\n`open-house-signin`.\n\n---\n\n## The chain\n\n```\nopen-house-package\n├─ 0. agent-profile           (only if profile/AGENT.md is missing)\n├─ 1. listing-intake           → listings/<slug>/LISTING.md  (skip if it exists)\n├─ 2. open-house-signin        → sign-in page + QR  (do this FIRST, the flyer needs the QR)\n├─ 3. open-house-flyer         → event flyer PDF with the QR embedded\n├─ 4. listing-carousel (A)     → the promo carousel\n├─ 5. buydown-math             → payment scenarios          [may BLOCK]\n├─ 6. listing-carousel (B)     → buydown carousel           [skipped if 5 blocked]\n├─ 7. social-caption × N       → captions for each post\n├─ 8. compliance-check + source-check   → gates\n├─ 9. day-of checklist         → produced here\n└─ 10. open-house-followup     → AFTER the event, from the sign-in data\n```\n\nStep 2 runs before step 3. The flyer embeds the QR, and building the flyer first means\nrebuilding it.\n\n## The countdown\n\n| When | What | Skill |\n|---|---|---|\n| T-7 days | Sign-in page live, QR tested on a real phone | `open-house-signin` |\n| T-6 days | Flyers printed. Order more than you think. | `open-house-flyer` |\n| T-4 days | Listing carousel posts | `listing-carousel` A |\n| T-3 days | Buydown carousel posts | `listing-carousel` B |\n| T-2 days | Neighbor invitation delivered | below |\n| T-1 day | Day-of checklist reviewed, signs and batteries checked | below |\n| Day of | Run it | — |\n| T+6 hours | Message 1 to everyone who signed in | `open-house-followup` |\n| T+3 days | Message 2 | `open-house-followup` |\n| T+7 days | Message 3, then long cadence | `followup-sequence` |\n\n**Post the listing carousel and the buydown carousel on different days.** They compete.\n\n## The neighbor invitation\n\nThe highest-value and most-skipped piece. Neighbors are the future sellers on that street,\nand they come to open houses to see what their own home is worth.\n\nProduce a short printed invitation for the surrounding homes — the property, the day and\ntime, and a genuine \"come see what your neighbor's place looks like inside.\" No valuation\nclaim, no \"find out what your home is worth\" hook that implies a number.\n\nCheck the agent's state and local rules on unaddressed mail drops and do-not-solicit\nlists before suggesting a walk. Where solicitation restrictions apply, this is a hand\ndelivery to doors, not a mailer, and the agent decides.\n\n## Day-of checklist (produce this, agents actually use it)\n\nSigns and directional arrows with the count needed. Sign-in QR card by the door plus a\npaper backup. Printed flyers, plus the buydown flyer if it exists. Business cards. Phone\ncharger. Something to write notes on — **the notes from the day are what make the\nfollow-up worth anything**, and they are always the thing that gets skipped. Lights on,\nblinds open, thermostat set, valuables and medications secured, pets handled.\n\nOne line to say to every visitor: ask what brought them by. That answer is the whole\nsegment field on the sign-in.\n\n## After\n\nDo not consider this run complete when the flyers are printed. Set the expectation\nexplicitly: **the follow-up is the deliverable, the open house is the event.** Tell the\nagent when to come back and run step 10, and what to bring (their notes from the day).\n\n---\n\n<!-- self-improvement-loop v1 -->\n\n## Self-improvement loop\n\nBefore ending a run of this skill, review the run:\n\n1. Did any step fail, stall, or need a workaround you had to invent?\n2. Did the user correct, reject, or rewrite something meaningful in the output?\n3. Did you discover something a future run would want to know (a path that moved, a\n   tool that replaced another, a preference they stated out loud)?\n\nIf yes to any, propose a specific edit to this SKILL.md in one or two lines and ask\nwhether to apply it. Propose only changes that would alter a future run's behavior --\nskip cosmetic rewording, and never propose more than two edits at once.\n\nDo not edit this file without their go-ahead. If they say no, drop it and do not re-raise\nthe same suggestion in a later run of the same session.\n", "path": "open-house-package/SKILL.md", "orchestrator": true, "calls": ["followup-sequence", "listing-carousel", "open-house-flyer", "open-house-followup", "open-house-signin"], "calledBy": ["compliance-check", "listing-carousel", "listing-flyer", "listing-package", "open-house-flyer", "open-house-followup", "open-house-signin", "social-caption", "source-check"]}, {"id": "open-house-signin", "folder": "open-house-signin", "dept": "open-house", "deptLabel": "Open House", "hue": 152, "description": "Build the digital open house sign-in page and its QR code — a single self-contained HTML page in the agent's brand that captures name, phone, email, and buyer status on a visitor's phone, with the consent language that makes later follow-up legitimate. Trigger on \"sign-in sheet\", \"QR code for the open house\", \"digital sign in\", \"capture page\", \"how do I collect visitor info\", or as a step inside open-house-package. Do NOT trigger for a general lead form on the agent's website.", "body": "# Open House Sign-In — capture that holds up later\n\nThe paper clipboard loses half the visitors and produces handwriting nobody can read. A\nQR code on the flyer and a card by the door converts better and produces clean data.\n\nThe part most agents get wrong is the consent language, and that is the part that decides\nwhether the follow-up sequence you build later is legitimate or a problem.\n\nReads `listings/<slug>/LISTING.md` and `profile/AGENT.md`.\n\n---\n\n## The page\n\n**One self-contained HTML file.** All CSS inline, no external fonts, no CDN scripts, no\ntracking pixels. It has to load instantly on a weak cell signal in someone's driveway,\nwhich is exactly where it will be used.\n\nLayout, in order:\n\n1. Property hero photo and the address. The visitor should recognize where they are.\n2. **Four fields, and only four:** first and last name, mobile phone, email, and one\n   radio group: *just looking / actively looking / working with an agent / neighbor*.\n   Every additional field costs completions. Resist adding more.\n3. The consent block (below), as visible text with a checkbox — not buried in a link.\n4. One submit button with a large tap target.\n5. A short confirmation state after submit, with the agent's name and contact.\n6. Footer: agent name, license number, brokerage, Equal Housing Opportunity.\n\n**Mobile first.** 16px minimum input font size, or iOS zooms the page on focus. Tap\ntargets at least 44px tall. Test at 375px wide.\n\n## The consent block (this is the whole point)\n\nWritten as plain text the visitor actually reads, with an **unchecked** box:\n\n> I'd like [Agent Name] of [Brokerage] to follow up with me about this property and\n> similar homes, by text, call, or email. I can stop at any time by replying STOP, or\n> just by telling [Agent Name] to stop.\n\n(The \"or just by telling me\" clause is load-bearing: under 47 CFR 64.1200, a consumer\nmay revoke by ANY reasonable method, and naming STOP as the only way is itself a\nviolation. The revocation-watch skill enforces the honor side.)\n\nRules that are not optional:\n\n- **The box starts unchecked.** A pre-checked box is not consent.\n- **No pre-checked box, no dark pattern, no \"by submitting you agree\" buried in fine\n  print.** If a visitor did not affirmatively opt in, they go into the database as\n  consent tier `existing-relationship` at best, and they do not go into any automated\n  text or bulk email sequence.\n- Automated or bulk texting to a mobile number has its own legal rules, and they change.\n  Tell the agent plainly: **the written consent record is what protects them**, and they\n  should have their broker confirm the current requirements in their state. Do not state\n  a specific statute or a specific rule as settled law in this skill — say it needs their\n  broker's confirmation.\n- Record where the submit goes. If the agent has a CRM, post there. If not, the page\n  writes to a local CSV and you tell them exactly where the file is.\n\n## Where the data goes\n\nOutput rows into `data/open-house-<slug>-<date>.csv` with columns matching the\n`contact-import` schema, including `source` (`open house <address> <date>`) and\n`consent_tier` (`express-written` only if the box was checked, otherwise `unknown`).\n\nThat file is the input to `open-house-followup`. Contacts marked `unknown` are excluded\nfrom any automated send by every downstream skill, automatically.\n\n## The QR code\n\n- Generate the QR pointing at wherever the page is actually reachable — a hosted URL if\n  the agent has a site, or a local network address if the page runs on a laptop at the\n  house. **A QR pointing at a `file://` path does not work from a visitor's phone.** If\n  there is no hosting, say so and produce a paper fallback instead of shipping a dead QR.\n- Minimum printed size 1 inch square; 1.5 inches is safer on a flyer.\n- Quiet zone: leave at least four modules of blank margin around it. QR codes fail most\n  often because someone put a border right against them.\n- Put a short human-readable URL under the code, for people who will not scan.\n- **Scan the printed QR with an actual phone before the open house.** Every time. Do not\n  assume.\n\n## Fallback\n\nBring a paper sheet too. Some visitors will not scan anything, and the two-minute\nconversation while someone writes their name down is not worthless.\n\n## Chains from / into\n\nCalled by `open-house-package`. Feeds `open-house-flyer` (the QR target) and\n`open-house-followup` (the captured list).\n\n---\n\n<!-- self-improvement-loop v1 -->\n\n## Self-improvement loop\n\nBefore ending a run of this skill, review the run:\n\n1. Did any step fail, stall, or need a workaround you had to invent?\n2. Did the user correct, reject, or rewrite something meaningful in the output?\n3. Did you discover something a future run would want to know (a path that moved, a\n   tool that replaced another, a preference they stated out loud)?\n\nIf yes to any, propose a specific edit to this SKILL.md in one or two lines and ask\nwhether to apply it. Propose only changes that would alter a future run's behavior --\nskip cosmetic rewording, and never propose more than two edits at once.\n\nDo not edit this file without their go-ahead. If they say no, drop it and do not re-raise\nthe same suggestion in a later run of the same session.\n", "path": "open-house-signin/SKILL.md", "orchestrator": false, "calls": ["contact-import", "open-house-flyer", "open-house-followup", "open-house-package"], "calledBy": ["agent-profile", "listing-flyer", "listing-intake", "open-house-flyer", "open-house-followup", "open-house-package"]}, {"id": "revocation-watch", "folder": "revocation-watch", "dept": "foundation", "deptLabel": "Foundation", "hue": 220, "description": "Catch every opt-out, however it's phrased, and make it stick. Run on every batch of inbound replies before drafting any follow-up, and any time the agent asks \"did anyone opt out\", \"check for stops\", \"clean my list\", or \"can I still text this person\". Also runs automatically as the first step of followup-queue and sphere-daily. This is a compliance gate: its NO overrides every other skill's draft.", "body": "# Revocation Watch — the opt-out catcher\n\nConsumers may revoke consent by **any reasonable method** (47 CFR 64.1200(a)(10)) —\nnot just by replying STOP. \"Please don't text me,\" \"take me off your list,\" \"not\ninterested, stop reaching out,\" \"who is this? don't contact me,\" a voicemail saying to\nquit calling, or telling the agent face to face at an open house ALL count. A system\nthat only catches the literal word STOP is a system that keeps texting people who\nrevoked, and every message after a revocation is a separate violation that lands on\nthe agent's license and wallet.\n\n## What a revocation looks like (classify by meaning, not keywords)\n\nRead each inbound reply and judge intent:\n\n- **Clear revocation** — any expression of \"stop contacting me,\" whatever the words:\n  STOP, unsubscribe, remove me, don't text me, wrong number + go away, \"no more,\"\n  profanity + leave-me-alone, \"I already have a lender/agent, please stop.\"\n- **Channel-specific revocation** — \"stop texting me, email is fine\" revokes ONE\n  channel. Honor the named channel; keep only what they said stays open, and record\n  which is which.\n- **Scope-specific** — \"I'm not interested in this house\" is not a revocation of all\n  contact. When genuinely ambiguous, treat as full revocation OR ask exactly once for\n  clarification with zero marketing content. When in doubt, out.\n- **NOT a revocation** — a question, a \"not right now, maybe in spring\" (that's a\n  deferral: pause the sequence, keep consent), a complaint about frequency (\"so many\n  texts!\" → reduce cadence, confirm once).\n\n## What happens on a revocation (all five, every time)\n\n1. **Tag the contact immediately** in the CRM/
