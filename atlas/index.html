ank or tied, break alphabetically by last name,\nthen first name. Apply the same tiebreak when deciding which 3 items get the call flag.\n\nReport how many were held back. \"9 today, 22 held\" keeps the cap trustworthy.\n\n## Draft each one against the real record\n\n**Do not send the sequence file's copy verbatim.** That copy is a starting point. For each\ncontact, personalize it against what the record actually holds: what they said they\nwanted, what the agent last sent them, how long it has been, what has changed in their\narea since.\n\nCall `sphere-message` for the drafting. Run `agent-voice`. Scan for banned words.\n\nIf a touch is supposed to carry a listing match or a market number, go get it — from the\nMLS via `market-pull`, sourced and dated. If it cannot be sourced this session, change the\ntouch rather than shipping an unsourced number.\n\n## Calls\n\nSome touches should be calls, and the sequence says which. **Do not silently convert a\ncall into a text because a text is easier to draft.** Produce a talk track for the call\ninstead — the opening line, the one question, and the goal — and flag it clearly.\n\nCap calls at 3 a day. Agents will do three; they will not do eleven.\n\n## Approval\n\nOne file, `daily/followups-<YYYY-MM-DD>.md`, numbered, with recipient, channel, why, and\nthe full copy for each.\n\n**Nothing sends without an explicit go for this specific batch in this session.** Approval\ndoes not carry to the next batch. \"Looks good\" is not approval — ask once and wait.\n\nAfter sending, report what went and what did not, by count and by name.\n\n## After the send\n\n- Update `next_action` and `next_action_date` in `data/pipeline.csv` — every touched item\n  exits with a new dated next action, or with the sequence marked complete\n- Update `last_touch` in `data/contacts.csv`\n- Append to `records/sent-log.md`\n- Anything the agent rewrote goes into `profile/VOICE.md` under Corrections\n\n## The honest monthly reading\n\nOnce a month report: items queued, items approved, items sent, replies received, and how\nmany pipeline rows are sitting with an overdue `next_action_date` nobody has touched. If\nthe queue is being generated and ignored, say so plainly rather than continuing to produce\nlists nobody reads.\n\n## Chains from / into\n\nCalled by `sphere-daily`. Reads `followup-sequence` and `lead-intake` output. Uses\n`sphere-message`, `agent-voice`, `market-pull`, `source-check`.\n\n---\n\n<!-- self-improvement-loop v1 -->\n\n## Self-improvement loop\n\nBefore ending a run of this skill, review the run:\n\n1. Did any step fail, stall, or need a workaround you had to invent?\n2. Did the user correct, reject, or rewrite something meaningful in the output?\n3. Did you discover something a future run would want to know (a path that moved, a\n   tool that replaced another, a preference they stated out loud)?\n\nIf yes to any, propose a specific edit to this SKILL.md in one or two lines and ask\nwhether to apply it. Propose only changes that would alter a future run's behavior --\nskip cosmetic rewording, and never propose more than two edits at once.\n\nDo not edit this file without their go-ahead. If they say no, drop it and do not re-raise\nthe same suggestion in a later run of the same session.\n", "path": "followup-queue/SKILL.md", "orchestrator": false, "calls": ["agent-voice", "followup-sequence", "lead-intake", "market-pull", "revocation-watch", "source-check", "sphere-daily", "sphere-message"], "calledBy": ["contact-import", "followup-sequence", "lead-intake", "preflight", "revocation-watch", "sphere-audit", "sphere-message"]}, {"id": "followup-sequence", "folder": "followup-sequence", "dept": "pipeline", "deptLabel": "Pipeline", "hue": 192, "description": "Design a multi-touch follow-up cadence for one lead type or one situation — how many touches, on what days, on which channel, and what each one actually says — and write it as a reusable sequence file the daily queue reads. Trigger on \"build a follow-up sequence\", \"what's my cadence for [lead type]\", \"nurture sequence\", \"drip campaign\", \"how often should I follow up\", or as a step after lead-intake. Do NOT trigger to send today's touches — that is followup-queue.", "body": "# Follow-Up Sequence — the cadence, designed once\n\nA sequence is a plan, not a send. This skill writes the plan; `followup-queue` runs it a\nday at a time with the agent approving each message.\n\nWrites `sequences/<sequence-name>.md`. Reads `profile/AGENT.md`, `profile/VOICE.md`.\n\n---\n\n## Design principles\n\n**Front-load heavily.** Most of the value of a follow-up sequence is in the first 72\nhours. A lead who called on Tuesday and hears back on Friday is usually gone. Touch 1 is\nsame day, touch 2 is next day, touch 3 is day 3.\n\n**Then decay.** Days 1, 2, 3, 7, 14, 30, then monthly. Not because thirty touches are\nbetter than eight, but because the long tail is where most agents quit and where the\ntransaction eventually happens.\n\n**Every touch carries something.** A touch that only says \"just checking in\" trains the\nrecipient to ignore the agent. Each one should deliver a listing that matches what they\nsaid they wanted, an MLS-sourced number about their area, an answer to a question they\nasked, or a genuinely useful piece of process explanation.\n\n**Vary the channel.** Text, call, email, video, mail. Five texts in a row reads as a\nrobot; the same five touches across three channels reads as a person who is paying\nattention.\n\n**Name the exit.** Every sequence needs a stop condition: they respond, they book, they\nsay no, they opt out, or the sequence completes. A lead who replied and is still receiving\nsequence touches is the single most damaging failure mode here. Write the exit into the\nfile.\n\n## Standard sequences worth having\n\nBuild the one the agent needs now, not all of them.\n\n| Sequence | Shape |\n|---|---|\n| **New buyer lead** | Day 0 call + text, day 1 text, day 3 email with matches, day 7 call, day 14 value, then monthly |\n| **New seller lead** | Day 0 call, day 1 email with the area's MLS numbers, day 3 call, day 7 offer a walkthrough, then bi-weekly |\n| **Open house visitor** | Handled by `open-house-followup` — do not duplicate it here |\n| **Past client** | Quarterly, plus birthday and home anniversary, driven by `sphere-daily` |\n| **Referral received** | Day 0 call same day without exception, day 1 thank the referrer separately, then the matching lead sequence |\n| **Went quiet** | One honest message naming the silence, then stop. Not a new sequence. |\n\n## The file format\n\n```\n# Sequence: <name>\nApplies to: <lead type / entry condition>\nExit on: <every stop condition>\nConsent required: <minimum consent tier for this sequence>\n\n## Touch 1 — Day 0 — call\nGoal: ...\nIf no answer: ...\nCopy / talk track: ...\n\n## Touch 2 — Day 1 — text\n...\n```\n\nCopy in the file is a **starting point, not the send.** `followup-queue` personalizes each\none against that contact's actual record before it is drafted for approval. A sequence\nthat sends its file copy verbatim is a mass mailer.\n\n## Hard rules\n\n- **Consent tier gates the sequence.** Anything requiring `unknown`-tier contacts is not\n  built. Say so.\n- **An opt-out stops every sequence for that contact, permanently, on every channel.**\n  No skill in this library may remove an opt-out tag.\n- **Reply stops the sequence immediately.** Build the check into touch generation, not\n  just into the file.\n- Bulk and automated texting carries its own legal requirements that vary by state and\n  change over time. Tell the agent this needs their broker's confirmation; do not state a\n  specific rule as settled law here.\n- Every market number in any touch routes through `market-pull` and `source-check`.\n\n## Realism check\n\nBefore writing the file, ask how many new leads the agent actually gets in a month. A\ntwelve-touch sequence across forty leads is 480 messages and it will not happen. Design\nfor what they will really do, then say what you designed for.\n\n## Chains from / into\n\nCalled after `lead-intake`. Read by `followup-queue`. Uses `agent-voice`.\n\n---\n\n<!-- self-improvement-loop v1 -->\n\n## Self-improvement loop\n\nBefore ending a run of this skill, review the run:\n\n1. Did any step fail, stall, or need a workaround you had to invent?\n2. Did the user correct, reject, or rewrite something meaningful in the output?\n3. Did you discover something a future run would want to know (a path that moved, a\n   tool that replaced another, a preference they stated out loud)?\n\nIf yes to any, propose a specific edit to this SKILL.md in one or two lines and ask\nwhether to apply it. Propose only changes that would alter a future run's behavior --\nskip cosmetic rewording, and never propose more than two edits at once.\n\nDo not edit this file without their go-ahead. If they say no, drop it and do not re-raise\nthe same suggestion in a later run of the same session.\n", "path": "followup-sequence/SKILL.md", "orchestrator": false, "calls": ["agent-voice", "followup-queue", "lead-intake", "market-pull", "open-house-followup", "source-check", "sphere-daily"], "calledBy": ["agent-profile", "agent-voice", "followup-queue", "ghl-setup", "lead-intake", "open-house-followup", "open-house-package", "preflight", "voice-command"]}, {"id": "ghl-setup", "folder": "ghl-setup", "dept": "pipeline", "deptLabel": "Pipeline", "hue": 192, "description": "Set up GoHighLevel as the agent's CRM, texting number, inbox and automation rail, with Claude doing the configuration and verification and the agent's own hands on every password, payment, consent screen and code. Trigger on \"set up my GoHighLevel\", \"GHL setup\", \"connect my Instagram to GoHighLevel\", \"get me a texting number\", \"connect my calendar to GoHighLevel\", \"let Claude read my GoHighLevel\", or when any pipeline skill needs a CRM and profile/STACK.md has no GoHighLevel section. Do NOT trigger for building a specific automation once setup is done; that is ghl-automations. Do NOT trigger for writing the messages themselves; that is sphere-message or followup-sequence.", "body": "# GoHighLevel setup, with the right hands on the right clicks\n\nGoHighLevel is the system of record this library can run on: one contact record per person,\nevery text, DM and synced email on that record, a phone number the agent owns, booking\ncalendars, and workflows. Claude Code is the brain that reads it and drafts from it. This\nskill wires the two together in the right order and proves each step before the next.\n\nReads `profile/AGENT.md` and `profile/STACK.md`. Writes a `## GoHighLevel` section into\n`profile/STACK.md` and stores credentials only in `.env`.\n\n## The rule that comes first\n\n**A password, a payment method, an OAuth consent screen, and a 2FA code are the agent's\nown click. Always.** Claude opens the page, names the button, and stops. If the agent asks\nClaude to type a password or enter a card, Claude declines and says why. This is not a\nlimitation to work around; it is the reason the agent can trust the setup.\n\n## Levels, so nothing is promised before it is proven\n\n- **Level 1, the app.** GoHighLevel on the phone and the laptop, the number bought, the\n  inbox live, Instagram connected. Everything in this level is the agent's own clicks with\n  Claude narrating the path.\n- **Level 2, Claude reads.** A read-only API token. Claude reads the inbox, drafts replies,\n  reports what a workflow actually delivered, and never transmits. Most agents live here\n  for weeks and that is correct.\n- **Level 3, Claude sends on your go.** A second token that can send and cannot read.\n  Claude drafts, the agent says go in that same exchange, Claude sends that one message\n  and reads the delivery status back. Set up in a later session, after Level 2 is trusted.\n\n## Who does what\n\n| Step | Claude | The agent (their own hands) | Why |\n|---|---|---|---|\n| Create the account, choose Starter, enter the card | Opens the pricing page, explains the usage billing | Yes | Payment |\n| Buy the phone number | Names the menu path | Yes | Payment, account settings |\n| A2P 10DLC registration (US texting will not deliver without it; allow days) | Drafts the business description and the sample messages to paste | Yes: EIN, business address, submit | Regulatory identity |\n| Account timezone (Settings > Business Profile) | Says why it matters: texts must land inside the legal 8am to 9pm window | Yes, one time | Settings page |\n| Connect Instagram | Drives to the popup; says to use the direct Instagram route, not Instagram through a Facebook Page | Yes: the Meta consent screen and any 2FA | OAuth |\n| Connect Google or Outlook calendar (Calendars > Connections) | Clicks \"+ Add new\" | Yes: the Google consent screen | OAuth |\n| Two-way email sync (Settings > My Profile > Email) | Explains what it does and does not sync | Yes: the Google consent screen | OAuth |\n| Mint API tokens (Settings > Private Integrations) | Names the exact scopes for each token | Yes: creates each one, copies the token from the one-time toast, pastes it into `.env` | The token is shown once |\n| Verify every token | One GET per token; reports pass or fail | Nothing | Read-only |\n| Create pipeline stages and one booking calendar | By API, with `calendars.write` | Nothing, or their own clicks if they prefer | Config work |\n| Import contacts, tag, dedupe, set DND for opt-outs | By API, after the canary below | Confirms the file and the tags | Config work |\n| Build or edit a workflow | Reads the list by API, dictates the exact clicks, verifies `published` after | Yes: every click in the builder | No write API exists |\n| Anything that costs money beyond the plan | Prints the price and stops | Yes | Payment |\n\n## The run, in order\n\n1. **Intake.** Do they already have a GoHighLevel account, on which plan, with which of\n   the above done? Read `profile/STACK.md`. Ask only what the file does not answer.\n2. **No account yet: stop here.** Point them to the playbook's \"Before you start\" section\n   for the plan and the referral disclosure. Never host them under someone else's agency;\n   the account is theirs.\n3. **Level 1 clicks,** in the table order. After each one, verify by looking, not by asking:\n   the number shows in Settings > Phone Numbers, the Instagram thread appears in\n   Conversations, the calendar shows under Connections.\n4. **Tokens.** Two Private Integrations, deliberately split:\n   - `GHL_READ_TOKEN`: `contacts.readonly`, `contacts.write`, `conversations.readonly`,\n     `conversations/message.readonly`, `workflows.readonly`, `calendars.readonly`,\n     `calendars.write`, `locations/customFields.readonly`, `locations/customFields.write`.\n     No message-write scope.\n   - `GHL_SEND_TOKEN` (Level 3 only): `conversations/message.write` and nothing else.\n   - `GHL_LOCATION_ID`: the sub-account id from the address bar or Settings > Business\n     Profile.\n   All three go in `.env`, which must be in `.gitignore`. Confirm the ignore before the\n   paste, not after.\n5. **Verify each token with one read.** `GET https://services.leadconnectorhq.com/workflows/?locationId=...`\n   with header `Version: 2021-07-28` for the read token. Contacts and workflows use\n   `2021-07-28`; conversations and calendars use `2021-04-15`. Send a normal browser\n   `User-Agent` header; without one the edge returns 403 with `error code: 1010`, which is\n   not an auth failure. A 401 or 403 with the right headers means the token lacks that\n   scope: mint again, do not guess.\n6. **Canary before any import.** Create one contact by API using the agent's own email\n   with a plus-alias, carrying the exact tags the real import will carry. Confirm no\n   workflow's enrolled count moved, the contact has no messages, and it gained no tags it\n   was not given. Then delete it. Only then import.\n7. **Opt-outs.** A tag never blocks a send; only DND does. Set DND on every opt-out. When\n   updating a contact, write only the fields being changed; a `tags` array in a PUT\n   replaces the whole set.\n8. **Write `profile/STACK.md`**: which steps are done, which tokens exist and their scopes\n   (never the values), the number, and what could not be done and why.\n9. **Level 3, only when asked, only after Level 2 has run for real.** The send wrapper\n   POSTs `{\"type\": \"SMS\", \"contactId\": ..., \"message\": ...}` to\n   `/conversations/messages` with `Version: 2021-04-15` and the send token. A 201 means\n   accepted, not delivered: read the message back and report its status. Every send is\n   logged with the timestamp, the contact, and the agent's go in that session.\n\n## What this skill will not claim\n\n- It will not say texts are working until a real text has delivered after A2P clears.\n- It will not build a workflow by API; there is no such API. It dictates and verifies.\n- It will not present two-way email sync as an inbox replacement. Only threads started\n  from the CRM, or from contacts already in it, sync; nothing before the connection does.\n- It will not turn on Conversation AI to answer people on the agent's behalf without the\n  agent reading its pricing and saying yes.\n\n## Chains from / into\n\nCalled before `ghl-automations`, `followup-sequence`, `open-house-followup`, and any skill\nthat wants a texting rail. Reads `agent-profile`. Writes to `profile/STACK.md`, which\n`stack-setup` also owns.\n\nIf the user asks how this works, what it needs, or how to customize it, read PLAYBOOK.md in\nthis folder and answer from it.\n\n---\n\n<!-- self-improvement-loop v1 -->\n\n## Self-improvement loop\n\nBefore ending a run of this skill, review the run:\n\n1. Did any step fail, stall, or need a workaround you had to invent?\n2. Did the user correct, reject, or rewrite something meaningful in the output?\n3. Did you discover something a future run would want to know (a path that moved, a\n   tool that replaced another, a preference they stated out loud)?\n\nIf yes to any, propose a specific edit to this SKILL.md in one or two lines and ask\nwhether to apply it. Propose only changes that would alter a future run's behavior --\nskip cosmetic rewording, and never propose more than two edits at once.\n\nDo not edit this file without their go-ahead. If they say no, drop it and do not re-raise\nthe same suggestion in a later run of the same session.\n", "path": "ghl-setup/SKILL.md", "orchestrator": false, "calls": ["agent-profile", "followup-sequence", "open-house-followup"], "calledBy": ["owners-manual", "preflight", "voice-command", "wire-a-tool"]}, {"id": "home-anniversary", "folder": "home-anniversary", "dept": "sphere", "deptLabel": "Sphere", "hue": 340, "description": "Find past clients whose home purchase anniversary is landing, and draft the anniversary touch — including the five, seven, and ten year marks where a past client is most likely to move again. Trigger on \"home anniversaries\", \"closing anniversaries\", \"who bought a year ago\", \"anniversary check\", or as part of sphere-daily. Do NOT trigger for birthdays — that is birthday-watch.", "body": "# Home Anniversary — the highest-probability seller in the database\n\nA past client at year five, seven, or ten is statistically the most likely person in an\nagent's database to transact next. Most agents never touch them because there is no CRM\nfield reminding them to.\n\nReads `data/contacts.csv` (the `close_date` and `property_address` fields),\n`profile/VOICE.md`, `profile/AGENT.md`.\n\n---\n\n## The check\n\nMatch on `close_date`. Only one format is valid: `YYYY-MM-DD` (the year is required — it\nis what determines which anniversary year this is). If a row's `close_date` is blank or in\nany other format (e.g. `3/3/2019`, `March 2019`), do not guess the year: skip that row,\nadd it to the \"missing/unreadable close_date\" count reported to the agent below, and do\nnot include it in any year grouping until it is corrected. Return anyone whose anniversary\nlands today or in the next 14 days, grouped by year:\n\n- **Year 1** — the warmest. They still remember the transaction vividly.\n- **Years 2 to 4** — maintenance cadence. Keep the relationship alive.\n- **Years 5, 7, 10** — flag these separately and prominently. This is where the next\n  listing lives.\n- **Year 10+** — long-hold owners. Different conversation, often about an adult child\n  buying, a rental, or downsizing.\n\nExclude anyone tagged `optout: all`, or `optout: text`/`optout: call` if that is the\nchannel this message would use. Note anyone missing a `close_date` (see above) — filling\nthose in is usually the highest-value data fix in the whole database.\n\n## What to send, by year\n\n**Year 1:** purely warm. \"One year in that house.\" Reference something specific about the\ntransaction or the property if the file holds it. **No ask.**\n\n**Years 2 to 4:** warm, plus at most one genuinely useful thing — a reminder that they can\nask about a contractor, or an offer to send the current numbers for their street if they\nare ever curious. Soft, once.\n\n**Years 5, 7, 10:** this one can carry a real conversation, because it is genuinely\nrelevant. Frame it as information, not a pitch: what has changed on their street since\nthey bought, and an offer to walk them through where they stand with no obligation.\n\n**Never lead with a valuation number.** Do not send \"your home is now worth $X.\" An\nunsolicited automated valuation is frequently wrong, it anchors the client against the\nagent when it is high, and it turns a relationship touch into a lead-gen tactic they can\nsmell. Offer the conversation, not the number.\n\n## Draft individually\n\nSame rule as birthdays: **no template with a merge field.** Each message references\ntheir actual property, their actual transaction, or something in their notes. If the file\nholds nothing, keep it short and honest.\n\nRun `agent-voice`. One to four sentences. Scan for banned words.\n\n## The escalation\n\nFor year 5, 7, and 10 clients, propose a **call**, not a text. That is the year where a\nconversation converts and a text gets a thumbs-up emoji.\n\nRank the list so the agent sees the two or three worth picking up the phone for today.\n\n## Approval and sending\n\nNumbered list, recipient and full copy, in a file. Wait for the agent's explicit go for\nthis batch. Approval never carries to the next batch.\n\nReport what went and what did not, by count and name. Update `last_touch` and log to\n`records/sent-log.md`.\n\n## Compliance\n\n- Any market number attached to an anniversary message routes through `market-pull` and\n  `source-check` — MLS-sourced, dated. No aggregator estimates.\n- Nothing describing the neighborhood, its character, or its residents.\n  `compliance-check` if the message grows past a few sentences.\n- Do not contact a past client who is currently represented by another agent.\n\n## Chains from / into\n\nCalled by `sphere-daily`. Reads `contact-import` output and `agent-voice`. May pull from\n`market-pull` for the year 5/7/10 conversation.\n\n---\n\n<!-- self-improvement-loop v1 -->\n\n## Self-improvement loop\n\nBefore ending a run of this skill, review the run:\n\n1. Did any step fail, stall, or need a workaround you had to invent?\n2. Did the user correct, reject, or rewrite something meaningful in the output?\n3. Did you discover something a future run would want to know (a path that moved, a\n   tool that replaced another, a preference they stated out loud)?\n\nIf yes to any, propose a specific edit to this SKILL.md in one or two lines and ask\nwhether to apply it. Propose only changes that would alter a future run's behavior --\nskip cosmetic rewording, and never propose more than two edits at once.\n\nDo not edit this file without their go-ahead. If they say no, drop it and do not re-raise\nthe same suggestion in a later run of the same session.\n", "path": "home-anniversary/SKILL.md", "orchestrator": false, "calls": ["agent-voice", "compliance-check", "contact-import", "market-pull", "source-check", "sphere-daily"], "calledBy": ["agent-profile", "birthday-watch", "contact-import", "preflight", "revocation-watch", "sphere-audit", "sphere-message"]}, {"id": "lead-intake", "folder": "lead-intake", "dept": "pipeline", "deptLabel": "Pipeline", "hue": 192, "description": "Capture one new lead into the database cleanly and completely — where they came from, what they said they want, their consent basis, and the next action with a date on it. Trigger on \"new lead\", \"someone just called\", \"I got an inquiry\", \"add this person\", \"log this lead\", or when a name and a phone number arrive with no other context. Do NOT trigger for a bulk import — that is contact-import.", "body": "# Lead Intake — the two minutes that decide whether a lead survives\n\nLeads die in the gap between the conversation and the CRM. This skill closes it in one\npass and makes sure the next action has a date on it.\n\nWrites into `data/contacts.csv` and `data/pipeline.csv`.\n\n---\n\n## Capture\n\nAsk for what is missing, in one message, and accept partial answers. A lead with a name\nand a phone number is worth logging; do not block on completeness.\n\n**Identity:** first and last name, mobile, email.\n\n**Source — the field agents skip and the one that matters most.** Where exactly did this\ncome from: a referral (from whom, by name), an open house (which one, what date), a sign\ncall, a portal, a social post, a past client, a walk-in. Source drives the cadence, the\ntone, and the consent basis. \"Online\" is not a source.\n\n**Consent basis, recorded now:**\n- `express-written` — they filled in a form, signed in, or opted in. Note where.\n- `existing-relationship` — a referral from a past client, or a prior client themselves\n- `inbound-inquiry` — they called or messaged the agent first about a specific property\n- `unknown` — anything else. Excluded from every automated send in this library.\n\n**What they said they want:** buying or selling or both, timeframe in their own words,\narea, price range, whether financing is arranged, whether they are already under a\nrepresentation agreement with another agent.\n\n**The representation question is not optional.** If they are already under an exclusive\nagreement with another agent, log it, do not pursue, and tell the agent why in one line.\n\n## Score it, honestly\n\nThree axes, and say the reasoning out loud:\n\n- **Timeframe** — what they actually said, not what the agent hopes\n- **Motivation** — is there a reason they must move (job, lease ending, family change,\n  a property already listed) or is this exploratory\n- **Readiness** — financing, a home to sell first, an agreement with someone else\n\nThen say plainly: this is a this-month lead, a this-quarter lead, or a this-year lead.\nAgents lose money treating year-out leads like this-month leads and vice versa.\n\n**Do not score on where they live, what they look like they can afford, their name, or\nanything demographic.** Score on what they said. This is both a fair housing rule and\nsimply a better predictor.\n\n## The next action\n\nEvery lead exits this skill with **one next action and a date.** Not \"follow up soon.\"\nA specific thing on a specific day, written into `data/pipeline.csv`:\n\n```\ncontact_id,stage,next_action,next_action_date,owner,notes,created,last_touch\n```\n\nIf the right next action is a call today, say so and say it plainly rather than drafting\na text because a text is easier to produce.\n\n## Then\n\n- Merge into `data/contacts.csv` using the `contact-import` schema, deduplicating against\n  what is already there. A lead who is already a past client is a completely different\n  conversation, and finding that out at intake matters.\n- Hand off to `followup-sequence` to build the cadence for this lead type.\n- Draft the first touch via `sphere-message`, held for approval.\n\n## Chains into\n\n`followup-sequence`, `followup-queue`, `sphere-message`, `meeting-brief`.\n\n---\n\n<!-- self-improvement-loop v1 -->\n\n## Self-improvement loop\n\nBefore ending a run of this skill, review the run:\n\n1. Did any step fail, stall, or need a workaround you had to invent?\n2. Did the user correct, reject, or rewrite something meaningful in the output?\n3. Did you discover something a future run would want to know (a path that moved, a\n   tool that replaced another, a preference they stated out loud)?\n\nIf yes to any, propose a specific edit to this SKILL.md in one or two lines and ask\nwhether to apply it. Propose only changes that would alter a future run's behavior --\nskip cosmetic rewording, and never propose more than two edits at once.\n\nDo not edit this file without their go-ahead. If they say no, drop it and do not re-raise\nthe same suggestion in a later run of the same session.\n", "path": "lead-intake/SKILL.md", "orchestrator": false, "calls": ["contact-import", "followup-queue", "followup-sequence", "meeting-brief", "sphere-message"], "calledBy": ["followup-queue", "followup-sequence", "meeting-brief", "preflight", "social-scan"]}, {"id": "listing-carousel", "folder": "listing-carousel", "dept": "listings", "deptLabel": "Listings", "hue": 28, "description": "Build a multi-slide Instagram or Facebook carousel for one property — the photo-led listing carousel, or the text-and-graphics buydown carousel on the same property. Renders slides from HTML to PNG at social dimensions using the agent's brand colors and fonts. Trigger on \"carousel for [address]\", \"listing carousel\", \"build the slides\", \"make the buydown carousel\", or as a step inside listing-package or open-house-package. Do NOT trigger for a market or city carousel — that is market-carousel.", "body": "# Listing Carousel — the format that gets shared\n\nTwo variants, built from the same listing file. Post them on different days so they do\nnot compete with each other.\n\nReads `listings/<slug>/LISTING.md`, `listings/<slug>/BUYDOWN.md` if it exists, and\n`profile/AGENT.md`.\n\n---\n\n## Variant A — the listing carousel (photo-led)\n\n**Real photography. The property is the hero on slide one.** Not a logo, not a headshot,\nnot a \"JUST LISTED\" bar over a stock image.\n\n- **Slide 1 (cover):** the hero photo, with a restrained overlay — address and city, and\n  the price. If it is an open house, the day and time window instead of the price. Keep\n  overlay text off faces and off the roof line.\n- **Slides 2 to 7:** six photos from the Photos section of `LISTING.md`, in the order a\n  buyer walks the house. Slide 2 is always the distinctive-feature photo with its sentence\n  from `LISTING.md` — that one slide is why the post gets saved. If the Supporting set has\n  more than five photos left after slide 2, take the first five in walk order and drop the\n  rest; if it has fewer than five, use what exists and end the carousel early rather than\n  repeating a photo or padding with the hero shot again.\n- **Slide 8 (close):** the specs in a clean block — beds, baths, interior sqft, lot sqft,\n  year built — plus the agent's name, headshot, brokerage, license number, phone, and the\n  Equal Housing statement.\n\n## Variant B — the buydown carousel (text and graphics)\n\n**No photography required.** This variant routinely outperforms the photo carousel with\npeople who do not already follow the agent, because it answers a question rather than\nshowing a house. Do not over-build it.\n\n- **Cover:** the tension in the reader's own language. \"Most buyers negotiate the price.\n  Almost nobody negotiates the rate.\"\n- **Slide 2:** the mechanic in plain English — one credit applied once versus the same\n  dollars applied to the payment every month.\n- **Slides 3 to 5:** the scenario table from `BUYDOWN.md`, one comparison per slide. Big\n  numbers, minimal chrome.\n- **Slide 6:** the down-payment ladder, if the product supports it, with the product\n  named.\n- **Slide 7:** pivot to the property and the open house, so the post still serves the\n  listing.\n- **Final slide:** the full disclaimer block, verbatim from `BUYDOWN.md`. It is small\n  type but it is legible type. Never a screenshot, never cropped.\n\n## Build method\n\n1. Write one HTML file per slide, or one HTML file with one `.slide` element per slide,\n   at **1080 x 1350** (4:5 portrait, the highest-reach feed ratio). Use 1080 x 1080 only\n   if the agent asks for square.\n2. Pull colors and fonts from `profile/AGENT.md`. If a brand font is not installed\n   locally, say so and fall back to a named system font rather than silently substituting.\n3. Design at 2x and downscale — render at 2160 x 2700 and resize. Text renders far\n   cleaner.\n4. Render with a headless browser to PNG. Name files `slide-01.png` … in post order, in\n   `listings/<slug>/carousel-<variant>/`.\n5. Open the rendered PNGs and actually look at them before delivering. Check for clipped\n   text, overlay text sitting on a face or a busy area, and low-contrast text on photos.\n   Rendering is where layouts break, and the only way to catch it is to look.\n\n## Type and layout rules\n\n- One idea per slide. If a slide needs a paragraph, it needs to be two slides.\n- Minimum body size ~28px at 1080 wide. Instagram compresses; small type turns to mush.\n- High contrast. Text over a photo needs a scrim or a solid block behind it, never raw\n  text on a busy image.\n- Leave the bottom ~120px of every slide clear of anything important — the app's own UI\n  covers it in feed.\n- Consistent margins across all slides. Inconsistent gutters is the single most common\n  tell of a generated deck.\n\n## Before it ships\n\n- `compliance-check` on all slide copy. Every time. This is public marketing.\n- `source-check` on any number on any slide.\n- License number and brokerage on the final slide, per `profile/AGENT.md`.\n- If the listing belongs to another agent, credit the listing agent and their brokerage\n  on the final slide, and confirm photo permission is recorded in `LISTING.md`.\n\n## Distribution note (say this to the agent once)\n\nThe design is not what makes this reach people. **The tags are.** Crediting and tagging\nthe listing agent, the co-lister, the open house host, and the brokerage borrows their\naudiences, which are dense with exactly the people the agent wants. A carousel with\nnobody tagged is a worse version of a post that already underperforms. Invite every real\naccount as a collaborator.\n\n## Chains from / into\n\nCalled by `listing-package`, `open-house-package`. Reads `listing-intake` and\n`buydown-math` output. Feeds `social-caption`.\n\n---\n\n<!-- self-improvement-loop v1 -->\n\n## Self-improvement loop\n\nBefore ending a run of this skill, review the run:\n\n1. Did any step fail, stall, or need a workaround you had to invent?\n2. Did the user correct, reject, or rewrite something meaningful in the output?\n3. Did you discover something a future run would want to know (a path that moved, a\n   tool that replaced another, a preference they stated out loud)?\n\nIf yes to any, propose a specific edit to this SKILL.md in one or two lines and ask\nwhether to apply it. Propose only changes that would alter a future run's behavior --\nskip cosmetic rewording, and never propose more than two edits at once.\n\nDo not edit this file without their go-ahead. If they say no, drop it and do not re-raise\nthe same suggestion in a later run of the same session.\n", "path": "listing-carousel/SKILL.md", "orchestrator": false, "calls": ["buydown-math", "compliance-check", "listing-intake", "listing-package", "open-house-package", "social-caption", "source-check"], "calledBy": ["agent-profile", "buydown-math", "carousel-render", "compliance-check", "content-week", "listing-intake", "open-house-package", "preflight", "social-caption", "source-check"]}, {"id": "listing-description", "folder": "listing-description", "dept": "listings", "deptLabel": "Listings", "hue": 28, "description": "Write the MLS public remarks and the agent-facing private remarks for one listing, plus the shorter variants for syndication and social, all inside the MLS character limits and clean on fair housing. Trigger on \"write the listing description\", \"MLS remarks\", \"property description\", \"public remarks\", \"write the copy for [address]\", or as a step inside listing-package. Do NOT trigger for a caption on a social post — that is social-caption.", "body": "# Listing Description — the copy that has to survive a compliance review\n\nMLS remarks are the most-scrutinized copy an agent writes. They are archived, they are\npublic, and they are the exhibit if a fair housing complaint is ever filed. Write them\ncarefully.\n\nReads `listings/<slug>/LISTING.md` and `profile/AGENT.md`.\n\n---\n\n## What to produce\n\n1. **Public remarks** — the consumer-facing description. Ask the agent for their MLS's\n   character limit; most fall between 750 and 1,500 characters including spaces. **Do not\n   assume a limit.** If they do not know, write to 750 and note that it can expand.\n2. **Private / agent remarks** — showing instructions, lockbox notes, offer instructions,\n   commission terms if the MLS carries them, known conditions. Never consumer-facing.\n3. **Short syndication line** — roughly 250 characters for portals that truncate.\n4. **One-line hook** — under 100 characters, reusable in texts, emails, and captions.\n\n## How to write the public remarks\n\n**Structure that works:**\n\n- **Open on the distinctive feature**, not on \"Welcome to this beautiful home.\" The first\n  eight words are the only ones most readers see in a list view. Use the sentence from\n  `LISTING.md`.\n- **Then the layout**, concretely: bedroom and bath count and how they are arranged, the\n  kitchen, the primary suite, the flow. Specific beats adjectival.\n- **Then improvements with dates.** \"Roof replaced 2021, HVAC 2023\" outperforms \"recently\n  updated\" because it is checkable.\n- **Then the lot and the outdoor space**, if it is a selling point.\n- **Close on the practical**: parking, HOA, and any showing note that belongs in public.\n\n**Voice:** run `agent-voice`. Most MLS remarks read like they were written by the same\nperson because they were all written by the same three habits. The agent's own register is\na differentiator.\n\n**Banned across the board:** exclamation-point stacking, ALL CAPS SHOUTING, \"must see\",\n\"won't last\", \"priced to sell\", \"motivated seller\" (unless the seller has explicitly\nauthorized signaling that — it costs them negotiating position), \"TLC\", \"handyman\nspecial\", \"as-is\" without the agent's confirmation, and any word implying a value opinion.\n\n## Fair housing — the specific ones that show up in MLS remarks\n\nScan for and remove:\n\n- Anything about schools as a quality claim. Naming the assigned district factually is\n  different from \"top-rated schools.\"\n- \"Safe\", \"quiet neighborhood\", \"family neighborhood\", \"good area\", \"up-and-coming\",\n  \"exclusive\", \"desirable\"\n- \"Perfect for a growing family\", \"great starter home\", \"ideal for retirees\", \"empty\n  nesters\", \"bachelor pad\", \"mother-in-law suite\" (use \"second unit\" or \"ADU\")\n- \"Walking distance to…\" — say the distance or say \"near\"\n- Proximity to a specific place of worship as an amenity\n- Anything describing current or expected occupants\n- \"Master bedroom\" — most brokerages have moved to \"primary bedroom\"\n\n**Describe the property, never the people.** Then run `compliance-check` on the finished\ncopy anyway. This is the one piece where a second pass is always worth it.\n\n## Accuracy\n\n- Every number in the remarks comes from the verified section of `LISTING.md`. Square\n  footage, lot size, year built, bed and bath count.\n- **Do not describe an unpermitted addition as finished square footage.** If permit\n  status is unknown, describe the space without claiming it as square footage, and flag\n  it to the agent.\n- Do not state that solar is owned if `LISTING.md` says the lease status is unconfirmed.\n- Do not describe a condition you have not been told about — no \"move-in ready\", no\n  \"needs nothing\", unless the agent said it.\n\n## Output\n\nAppend a `## Copy` section to `listings/<slug>/LISTING.md` holding all four variants\nverbatim, with the character count of each. The agent pastes from there.\n\nWorked example (public remarks, opening lines only):\n\n> You can renovate a kitchen, you cannot grow a 40-year-old avocado tree. This three\n> bedroom, two bath home offers 1,850 square feet with the primary suite separated from\n> the secondary bedrooms. Roof replaced 2021, HVAC 2023...\n\nThat is the pattern for all four variants: distinctive feature first, then concrete\nspecifics, never an adjective doing the work a fact could do.\n\n## Chains from / into\n\nCalled by `listing-package`. Reads `listing-intake`, `agent-voice`. Gated by\n`compliance-check` and `source-check`. Feeds `social-caption` and `listing-flyer`.\n\n---\n\n<!-- self-improvement-loop v1 -->\n\n## Self-improvement loop\n\nBefore ending a run of this skill, review the run:\n\n1. Did any step fail, stall, or need a workaround you had to invent?\n2. Did the user correct, reject, or rewrite something meaningful in the output?\n3. Did you discover something a future run would want to know (a path that moved, a\n   tool that replaced another, a preference they stated out loud)?\n\nIf yes to any, propose a specific edit to this SKILL.md in one or two lines and ask\nwhether to apply it. Propose only changes that would alter a future run's behavior --\nskip cosmetic rewording, and never propose more than two edits at once.\n\nDo not edit this file without their go-ahead. If they say no, drop it and do not re-raise\nthe same suggestion in a later run of the same session.\n", "path": "listing-description/SKILL.md", "orchestrator": false, "calls": ["agent-voice", "compliance-check", "listing-flyer", "listing-intake", "listing-package", "social-caption", "source-check"], "calledBy": ["agent-profile", "agent-voice", "compliance-check", "listing-intake", "preflight", "source-check"]}, {"id": "listing-flyer", "folder": "listing-flyer", "dept": "listings", "deptLabel": "Listings", "hue": 28, "description": "Build a print-ready single-page property flyer for one listing — hero photo, specs, supporting photos, agent block, disclosures — as a PDF sized for letter or A4, in the agent's brand. Also builds the buydown variant of the same flyer when payment scenarios exist. Trigger on \"flyer for [address]\", \"property flyer\", \"make the handout\", \"open house flyer\", \"print piece\", or as a step inside listing-package or open-house-package. Do NOT trigger for social graphics — that is listing-carousel.", "body": "# Listing Flyer — the thing people pick up and take home\n\nThe flyer is the only piece in this library that gets printed, which means every mistake\nis permanent and sits in a stack on a kitchen counter. Slower, more careful pass than\nanything digital.\n\nReads `listings/<slug>/LISTING.md`, `listings/<slug>/BUYDOWN.md` if present, and\n`profile/AGENT.md`.\n\n---\n\n## Layouts\n\n**Standard property flyer (default)** — one page, letter (8.5 x 11 in) portrait unless\nthe agent's market uses A4.\n\n- Top third: hero photo, full bleed to the margins. Address and city over it or directly\n  beneath it, whichever keeps text off a busy area.\n- Price, prominent, with beds / baths / interior sqft / lot sqft / year built as a clean\n  spec row.\n- Middle: three to five supporting photos in a grid, sized so nothing is a thumbnail.\n- Short body copy: three to five sentences maximum, built around the distinctive feature\n  and its sentence from `LISTING.md`. Nobody reads a flyer paragraph.\n- Bottom block: agent headshot, name, title, license number, phone, email, brokerage name\n  and logo, Equal Housing Opportunity statement.\n- Fine print: HOA dues if any, and the \"information deemed reliable but not guaranteed\"\n  line the agent's brokerage uses.\n\n**Open house variant** — same layout, with the open house day, date, and time window as\nthe most prominent element after the address, plus a QR code linking to the sign-in page\nfrom `open-house-signin`.\n\n**Buydown variant** — a second page or a separate flyer. The scenario table from\n`BUYDOWN.md` occupies the top half, the property occupies the bottom half, and the full\ndisclaimer block sits at the foot at a legible size. Never shrink the disclaimer to make\nroom.\n\n## Print production rules\n\nThese are the ones people get wrong:\n\n- **300 DPI.** Render or export at 300 dots per inch at final size. A 1080px photo is a\n  screen asset; it prints soft. Check the source resolution of every image before\n  placing it, and say so if a photo is too small rather than placing it anyway.\n  The test is arithmetic, not taste: a photo supports `pixels / 300` inches at final\n  size. On the default letter layout the hero needs at least **2550 x 1200 px** and each\n  supporting-grid photo at least **1050 x 790 px**. Below that, name the photo, give its\n  pixel size and the largest size it can print at, and either drop it or ask for a\n  higher-resolution replacement. Never upscale it and place it anyway, and never quietly\n  shrink the whole grid to accommodate one weak file.\n- **0.25 inch bleed** on anything intended for a commercial printer; 0.5 inch safe\n  margin inside the trim on all four sides. Nothing important within the safe margin.\n- **Export as PDF, not PNG or JPG.** Vector text stays sharp; rasterized text does not.\n- Check the file size. Over about 10 MB and email will bounce it; run a compression pass\n  and verify the photos still look right afterward.\n- If the agent is printing at home, produce a no-bleed version too, because home printers\n  cannot print to the edge.\n\n## Build method\n\nAuthor in HTML and CSS with a `@page { size: letter; margin: 0 }` rule and print-to-PDF\nfrom a headless browser. It gives real text in the PDF, the agent's actual brand fonts,\nand a file anyone can re-render later.\n\nUse CSS physical units (`in`, `mm`, `pt`) throughout, not `px`. Mixing pixel units into a\nprint layout is how flyers come out at 92% scale.\n\nThen open the PDF and look at it. Every time.\n\n## Before it ships\n\nRun this list in order, every time. It is a checklist, not a judgment call — a flyer that\ngets a clean pass one day and a blocked pass the next on the same inputs is the bug.\n\n1. **Profile gate.** Open `profile/AGENT.md`. If any field under Required disclosures\n   reads `TO CONFIRM WITH BROKER`, the flyer is **BLOCKED** — say which fields, route\n   them to the broker, and do not write a plausible-looking line in their place.\n2. **Profile staleness.** Compare `Last updated` in `profile/AGENT.md` against today's\n   date read off the system. More than 180 days, say so and offer a refresh — every run,\n   not just the runs that happen to open `agent-profile`. Never infer today's date.\n3. **Asset existence.** Every file path the profile names — logo, headshot — and every\n   photo the layout places must actually exist on disk. Check them; a path in a profile\n   is not a file. Missing logo or headshot blocks the bottom block, and that blocks the\n   flyer.\n4. **Photo resolution**, per the 300 DPI rule below.\n5. `compliance-check` on all copy. License number and brokerage present and at the size\n   the brokerage requires.\n6. `source-check` on every number, including the square footage and the HOA dues.\n7. If it is another agent's listing, their name and brokerage are credited, and photo\n   permission is recorded in `LISTING.md`.\n8. Confirm the QR code, if present, actually resolves — scan it, do not assume it.\n\n## Output\n\n`listings/<slug>/flyer-<variant>.pdf`, plus the source HTML alongside it so it can be\nregenerated when the price changes. Note it in the listing's Status log.\n\n## Chains from / into\n\nCalled by `listing-package`, `open-house-package`. Reads `listing-intake`, `buydown-math`,\n`open-house-signin` (for the QR target).\n\n---\n\n<!-- self-improvement-loop v1 -->\n\n## Self-improvement loop\n\nBefore ending a run of this skill, review the run:\n\n1. Did any step fail, stall, or need a workaround you had to invent?\n2. Did the user correct, reject, or rewrite something meaningful in the output?\n3. Did you discover something a future run would want to know (a path that moved, a\n   tool that replaced another, a preference they stated out loud)?\n\nIf yes to any, propose a specific edit to this SKILL.md in one or two lines and ask\nwhether to apply it. Propose only changes that would alter a future run's behavior --\nskip cosmetic rewording, and never propose more than two edits at once.\n\nDo not edit this file without their go-ahead. If they say no, drop it and do not re-raise\nthe same suggestion in a later run of the same session.\n", "path": "listing-flyer/SKILL.md", "orchestrator": false, "calls": ["agent-profile", "buydown-math", "compliance-check", "listing-intake", "listing-package", "open-house-package", "open-house-signin", "source-check"], "calledBy": ["agent-profile", "buydown-math", "compliance-check", "listing-description", "listing-intake", "listing-package", "open-house-flyer", "preflight", "source-check"]}, {"id": "listing-intake", "folder": "listing-intake", "dept": "listings", "deptLabel": "Listings", "hue": 28, "description": "Collect and verify every fact about one property in a single pass, then write it to a per-listing file that all downstream listing skills read — address, price, beds, baths, square footage, lot size, year built, HOA, status, photo inventory, and the distinctive feature that actually sells it. Trigger on \"new listing\", \"set up [address]\", \"I just took a listing\", \"here's the property\", or automatically as step 1 of listing-package and open-house-package. Do NOT trigger for a buyer lead or a market-wide question.", "body": "# Listing Intake — one pass, verified, written down\n\nEvery downstream piece (flyer, carousel, remarks, buydown, QR page, captions) reads this\nfile. Get it right once and nothing downstream has to re-ask or re-guess.\n\n---\n\n## Step 0 — Recover before you create\n\nCheck `listings/<address-slug>/LISTING.md`. If it exists, a prior session already made\ndecisions. **Those win** unless you have a stated reason they are wrong. Never silently\nre-decide a chosen photo or an approved line of copy.\n\nSlug format: `123-main-st-anytown` — number, street, city, lowercase, hyphens.\n\n## Step 1 — Ask for everything in ONE message\n\nDo not trickle-ask across five turns. An agent's patience for this is one message long.\n\n**Required:**\n- Full property address including city, state, ZIP\n- List price\n- Beds, full baths, partial baths\n- Interior square footage, lot square footage\n- Year built\n- Property type\n- MLS number and status\n- Photos: a folder path, a shared-drive link, or the public listing URL\n\n**Required if it is a co-listing or another agent's listing:**\n- Listing agent name(s), brokerage, and license number\n- Written permission to use their photos and market the property\n\n**Required if there is an HOA:**\n- HOA dues, frequency, and what the dues cover\n\n**Ask once, then move on if they do not have it:**\n- What the seller or the agent most wants highlighted\n- Recent improvements with dates\n- Parking, garage, pool, ADU, solar (owned or leased — this matters)\n- Showing instructions\n\n**If a Required field is still missing after your one message, that is the one\nexception to \"ask once.\"** Send a second, short message asking only for the specific\nRequired fields still missing (e.g. \"just need the full address and lot size to pull the\nMLS record\"). Do not invent a placeholder and do not proceed to Step 2 until you have\neither an answer or an explicit \"the agent doesn't know\" for every Required field — record\n\"agent doesn't know, needs confirmation\" as the answer where that is the case, and carry\nit into `## Not verified` in Step 4.\n\n**Never ask them for the lender rate sheet.** `buydown-math` goes and gets a current\ndated one itself, or it blocks.\n\n## Step 2 — Verify against the MLS\n\nOpen the MLS record **this session** and confirm: beds, baths, interior sqft, lot size,\nlist price, year built, status, and HOA. The MLS is the source of record for a property's\nfacts.\n\n**Do not** take property facts from the agent's message alone, from a prior session, or\nfrom memory. Agents relay from other agents and everyone rounds. A flyer that says 2,400\nsqft when the MLS says 2,180 is a real problem.\n\nIf MLS access is not available this session, the public listing page is an acceptable\nfallback **for property facts only** — label it as such in the file. Aggregator pages are\nnever acceptable for market statistics; see `source-check`.\n\nRecord what you actually opened, and when.\n\n## Step 3 — Inventory the photos\n\nList every image file with a one-line description. Then pick and mark:\n\n- **Hero** — the single best exterior or signature shot. This is slide one and the flyer\n  cover. It is the house, never a logo and never the agent.\n- **The distinctive feature** — the one thing about this property nobody else has. A\n  mature fruit-bearing yard, an original 1920s stair, a workshop, a view. Find the\n  sentence for it: *\"you can renovate a kitchen, you cannot grow that.\"* Every property\n  has one. Write the sentence into the file; every downstream skill reuses it.\n- **Supporting set** — six to ten in the order a buyer would walk the house.\n- **Do not use** — anything with people in it, a neighbor's property, a visible address\n  on a package, a pet, or a mirror with the photographer in it.\n\nFlag photo quality honestly. If the photos are phone snapshots in bad light, say so and\nsay that a professional shoot changes the result more than any graphic will.\n\n## Step 4 — Write the file\n\n`listings/<address-slug>/LISTING.md`, with sections:\n\n```\n## Property        (every verified fact, one per line)\n## Sources         (what you opened, with the date)\n## Photos          (file, role, one-line description)\n## The one thing   (the distinctive feature and its sentence)\n## Seller priorities\n## Compliance notes (permissions, HOA disclosure, solar lease, known issues)\n## Status log      (dated line per downstream piece produced)\n```\n\nThen a `## Not verified` list — anything the agent asserted that you could not confirm.\nThat list is what blocks downstream pieces, and it should be short and explicit.\n\n## Guardrails\n\n- **Fair housing starts here.** Describe the house and the lot. Nothing about the\n  neighborhood's character, its schools, who lives there, or whether it is \"safe\" or\n  \"family-friendly\". `compliance-check` will catch it, but do not write it in the first\n  place.\n- **No valuation opinion.** Not underpriced, not a deal, not what it is \"really worth\".\n- **Solar leases, HOA special assessments, permit status on additions, and known material\n  defects** get recorded in Compliance notes even if they never appear in marketing. The\n  agent needs to see them in one place.\n\n## Chains into\n\n`listing-flyer`, `listing-carousel`, `listing-description`, `buydown-math`,\n`open-house-flyer`, `open-house-signin`, `social-caption`.\n\n---\n\n<!-- self-improvement-loop v1 -->\n\n## Self-improvement loop\n\nBefore ending a run of this skill, review the run:\n\n1. Did any step fail, stall, or need a workaround you had to invent?\n2. Did the user correct, reject, or rewrite something meaningful in the output?\n3. Did you discover something a future run would want to know (a path that moved, a\n   tool that replaced another, a preference they stated out loud)?\n\nIf yes to any, propose a specific edit to this SKILL.md in one or two lines and ask\nwhether to apply it. Propose only changes that would alter a future run's behavior --\nskip cosmetic rewording, and never propose more than two edits at once.\n\nDo not edit this file without their go-ahead. If they say no, drop it and do not re-raise\nthe same suggestion in a later run of the same session.\n", "path": "listing-intake/SKILL.md", "orchestrator": false, "calls": ["buydown-math", "compliance-check", "listing-carousel", "listing-description", "listing-flyer", "open-house-flyer", "open-house-signin", "social-caption", "source-check"], "calledBy": ["buydown-math", "listing-carousel", "listing-description", "listing-flyer", "meeting-brief", "open-house-flyer", "preflight"]}, {"id": "listing-package", "folder": "listing-package", "dept": "listings", "deptLabel": "Listings", "hue": 28, "description": "Orchestrator. Produces the complete marketing package for one new listing in a single run — verified property file, MLS remarks, print flyer, social carousel, buydown scenarios, captions, and a posting schedule — by calling the individual listing skills in order. Trigger on \"full package for [address]\", \"market this listing\", \"I just took a listing, do everything\", \"listing package\", \"the whole thing for [address]\". Use the individual skills instead when the agent wants only one piece.", "body": "# Listing Package — the orchestrator\n\nRuns the listing skills in dependency order and hands back one package plus a schedule.\n\n**Each step below is its own skill and can be run alone.** That is the point of the\nsplit: an agent who only wants a flyer runs `listing-flyer`, and an agent who wants\neverything runs this.\n\n---\n\n## The chain\n\n```\nlisting-package\n├─ 0. agent-profile          (only if profile/AGENT.md is missing)\n├─ 1. listing-intake          → listings/<slug>/LISTING.md\n├─ 2. listing-description     → MLS public + private remarks, short + hook\n├─ 3. buydown-math            → listings/<slug>/BUYDOWN.md    [may BLOCK, see below]\n├─ 4. listing-flyer           → flyer-standard.pdf (+ flyer-buydown.pdf only if step 3\n│                                did not block)\n├─ 5. listing-carousel (A)    → photo-led slides\n├─ 6. listing-carousel (B)    → buydown slides                [skipped if step 3 blocked]\n├─ 7. social-caption × N      → one caption per asset\n├─ 8. compliance-check        → gate on everything above\n├─ 9. source-check            → gate on every number above\n└─ 10. schedule + handoff\n```\n\n## Running it\n\n**Do step 1 completely before anything else.** Every later step reads `LISTING.md`, and\nre-asking the agent for the square footage in step 4 destroys the whole impression of a\nsystem that works.\n\n**Step 3 is allowed to block, and blocking is a success.** `buydown-math` blocks if ANY\none of its five gate items is missing (dated rate sheet within 2 business days, the\npricing convention, a dated MI quote if MI applies, the full assumption set, or the\nlender's NMLS ID) — a missing rate sheet is the most common trigger but not the only one.\nWhen it blocks, for any reason:\n\n- Skip steps 6 and the buydown flyer\n- Deliver everything else\n- Tell the agent in one line what is missing and give them the exact sentence to forward\n  to their lender\n- Do NOT estimate a payment to keep the package complete\n\n**Steps 8 and 9 are gates, not reviews.** If `compliance-check` returns any `BLOCK`, the\npackage does not go out. Say that in your first line, then offer the fixed version.\n\n## The schedule to hand back\n\nDo not dump nine files and walk away. Give them a dated plan:\n\n| Day | Piece | Where |\n|---|---|---|\n| Day 0 | MLS remarks live | MLS |\n| Day 0 | Flyer printed | Listing, brochure box, office |\n| Day 1 | Listing carousel | Instagram, Facebook |\n| Day 2 | Buydown carousel | Instagram |\n| Day 3-4 | Open house flyer + QR page live | If an open house is set |\n\n**Never post the listing carousel and the buydown carousel on the same day.** They\ncompete with each other for the same audience and both underperform.\n\nIf there is an open house on the calendar, hand off to `open-house-package` rather than\nduplicating its steps here.\n\n## The handoff\n\nDeliver as a list of file paths grouped by where each one goes, plus:\n\n- What is blocked and why, in one line each\n- What needs the agent's approval before it ships\n- The one thing that would most improve the result (usually: better photos, or tagging\n  and crediting the other agents involved)\n\nIf this is another agent's listing being marketed as a favor, tell them to send the\nfinished package to that agent **before** it goes live, framed as \"made you something,\nno charge, use it however you want.\" Finding it on the feed lands worse than receiving\nit, and the relationship is the actual product.\n\n## Ceiling\n\nTwo full packages a week is the realistic ceiling for one person, because each one is\nreal work and the value is in doing it well. Say so if the agent queues five.\n\n---\n\n<!-- self-improvement-loop v1 -->\n\n## Self-improvement loop\n\nBefore ending a run of this skill, review the run:\n\n1. Did any step fail, stall, or need a workaround you had to invent?\n2. Did the user correct, reject, or rewrite something meaningful in the output?\n3. Did you discover something a future run would want to know (a path that moved, a\n   tool that replaced another, a preference they stated out loud)?\n\nIf yes to any, propose a specific edit to this SKILL.md in one or two lines and ask\nwhether to apply it. Propose only changes that would alter a future run's behavior --\nskip cosmetic rewording, and never propose more than two edits at once.\n\nDo not edit this file without their go-ahead. If they say no, drop it and do not re-raise\nthe same suggestion in a later run of the same session.\n", "path": "listing-package/SKILL.md", "orchestrator": true, "calls": ["buydown-math", "compliance-check", "listing-flyer", "open-house-package"], "calledBy": ["agent-profile", "buydown-math", "compliance-check", "listing-carousel", "listing-description", "listing-flyer", "preflight", "social-caption", "source-check"]}, {"id": "market-brief", "folder": "market-brief", "dept": "market", "deptLabel": "Market", "hue": 265, "description": "Write the client-facing monthly market update for one area from a market-pull data file — what the numbers say, what it means for a buyer, what it means for a seller, in the agent's own voice, with sources and as-of dates attached. Trigger on \"write the market update\", \"monthly market brief\", \"what do I tell my sphere about the market\", \"market report for [city]\", or as a step inside market-update-package. Do NOT trigger to pull data — that is market-pull.", "body": "# Market Brief — the numbers turned into something a client can use\n\nThe brief is the highest-leverage recurring piece an agent produces. It is proof they know\ntheir market, it justifies the monthly email, and it gives every follow-up a reason to\nexist that is not \"just checking in.\"\n\nReads `data/market/<area-slug>-<YYYY-MM>.md`, `profile/AGENT.md`, `profile/VOICE.md`.\n\n**If the data file does not exist for the current period, stop and run `market-pull`\nfirst.** Do not write a brief from a previous month's numbers and do not write around the\nabsence of data.\n\n---\n\n## Structure\n\n**1. The headline — one sentence.** What actually changed. Not \"the market remains\ndynamic.\" Something like: \"Median sold price held flat while homes took 11 days longer to\nsell than a year ago.\" If nothing changed, say nothing changed. That is a real finding and\nsaying it builds more trust than manufacturing a trend.\n\n**2. The numbers table.** Four to six metrics, each with the current value, the\nyear-over-year comparison, and the sample size. Not every metric from the pull — pick the\nones that moved and the ones a normal person understands.\n\n**3. What it means if you are buying.** Two or three sentences, concrete. More choices,\nless competition, room to negotiate — or the opposite. Never a prediction.\n\n**4. What it means if you are selling.** Same treatment. Pricing, timing, what condition\nis worth.\n\n**5. The honest caveat.** Where the data is thin, where the area definition matters,\nwhat would change the picture. Including this makes the confident parts more believable.\n\n**6. Sources block.** MLS name, area definition verbatim, date range, pull date. Every\ntime, at the foot of the brief.\n\n## Rules that keep it defensible\n\n- **Never predict.** No \"prices will rise\", no \"now is the time to buy\", no \"we expect\".\n  Describe what happened. Interpretation of the past is a service; forecasting is a\n  liability.\n- **Never say \"it's a good time to buy\" or \"a good time to sell.\"** It is a good time for\n  some people and a bad time for others, and saying so is more useful and more honest.\n- **Median, not average**, and say which. One expensive sale moves an average and tells a\n  false story.\n- **Sample size travels with every percentage.** \"Down 12%\" on nine sales is noise.\n  Report the nine.\n- **Year-over-year, not month-over-month**, unless there is a specific reason. Real\n  estate is seasonal and MoM mostly measures the calendar.\n- **Do not blend property types** without saying so.\n- Every number routes through `source-check`. Every time.\n- Every neighborhood or area description routes through `compliance-check` — this is the\n  piece where \"desirable area\" and school-quality claims sneak in most often.\n\n## Length and format\n\n- **Email version:** 250 to 400 words. Nobody reads more. Table plus four short sections.\n- **One-page PDF version:** same content, the agent's brand, the numbers set larger, the\n  sources block at the foot.\n- **Three-line text version:** the headline, one number, and one question. This is what\n  actually gets replies.\n\n## Voice\n\nRun `agent-voice`. The market brief is where generated copy is most obvious, because\nevery agent in the country sends one and most of them read identically. The agent's actual\nregister is the entire differentiator. Scan the draft for banned words before delivering.\n\n## Chains from / into\n\nReads `market-pull`. Called by `market-update-package`. Feeds `market-carousel`,\n`sphere-message`, `social-caption`, `meeting-brief`, `open-house-followup`.\n\n---\n\n<!-- self-improvement-loop v1 -->\n\n## Self-improvement loop\n\nBefore ending a run of this skill, review the run:\n\n1. Did any step fail, stall, or need a workaround you had to invent?\n2. Did the user correct, reject, or rewrite something meaningful in the output?\n3. Did you discover something a future run would want to know (a path that moved, a\n   tool that replaced another, a preference they stated out loud)?\n\nIf yes to any, propose a specific edit to this SKILL.md in one or two lines and ask\nwhether to apply it. Propose only changes that would alter a future run's behavior --\nskip cosmetic rewording, and never propose more than two edits at once.\n\nDo not edit this file without their go-ahead. If they say no, drop it and do not re-raise\nthe same suggestion in a later run of the same session.\n", "path": "market-brief/SKILL.md", "orchestrator": false, "calls": ["agent-voice", "compliance-check", "market-carousel", "market-pull", "market-update-package", "meeting-brief", "open-house-followup", "social-caption", "source-check", "sphere-message"], "calledBy": ["agent-profile", "agent-voice", "market-carousel", "market-pull", "open-house-followup", "preflight", "source-check"]}, {"id": "market-carousel", "folder": "market-carousel", "dept": "market", "deptLabel": "Market", "hue": 265, "description": "Build the social carousel that presents one area's market statistics as readable graphics — cover, three to five stat slides, what it means for buyers and sellers, and a sources slide with the MLS name and as-of date. Trigger on \"market carousel\", \"make the stats slides\", \"post the market update\", \"city carousel\", or as a step inside market-update-package. Do NOT trigger for a single property — that is listing-carousel.", "body": "# Market Carousel — the recurring post that proves the agent knows their market\n\nThe most repeatable content an agent has, because the data refreshes every month on its\nown. Build the template once, and every month after is a data swap.\n\nReads `data/market/<area-slug>-<YYYY-MM>.md`, the brief from `market-brief` if it exists,\nand `profile/AGENT.md`.\n\n**Do not build this without a current `market-pull` file.** No exceptions, no\nlast-month's-numbers, no aggregator fill-ins.\n\n---\n\n## Slide plan (7 slides)\n\n1. **Cover** — the area name, the month and year, and the one-sentence headline from the\n   brief. The month must be on the cover; these posts get found months later and an\n   undated stat graphic is a liability.\n2. **The headline metric** — usually median sold price. One enormous number, the\n   year-over-year change beneath it, and the sample size in small type. The sample size\n   goes on the slide, not only in the caption.\n3. **Speed** — median days on market for **sold** listings, with YoY. Label it \"days to\n   sell (sold listings)\" so nobody reads it as active inventory age.\n4. **Supply** — active listings, pendings, and months of supply.\n5. **What this means if you're buying** — two or three lines, no prediction.\n6. **What this means if you're selling** — same.\n7. **Sources** — MLS name, the area definition verbatim, the date range, the pull date,\n   plus the agent's name, license number, brokerage, and Equal Housing Opportunity.\n\nSlide 7 is not optional and does not get dropped for aesthetics. It is what separates this\nfrom the thousands of unsourced stat graphics agents post every month, and it is the slide\nanother agent will screenshot if the numbers are wrong.\n\n## Design\n\n- **1080 x 1350** (4:5). Design at 2x (2160 x 2700) and downscale.\n- Brand colors and fonts from `profile/AGENT.md`.\n- **One number per slide.** A slide with six statistics on it communicates none of them.\n- Numbers set very large; labels small but legible; the caveat line smaller still but\n  never below ~22px at 1080 wide.\n- Keep the bottom ~120px clear of anything important — the feed UI covers it.\n- If a metric moved less than its own noise floor, say \"roughly flat\" on the slide rather\n  than printing a meaningless 0.4% change.\n\n## Honesty rules on the graphics themselves\n\n- **Never truncate a chart's y-axis** to make a small change look dramatic. This is the\n  single most common lie in real estate stat graphics.\n- Never show a percentage change without its sample size somewhere on the same slide.\n- Never blend property types without labeling it.\n- Never put a projection or a trend arrow extending past the last real data point.\n- Never describe the area's character, its residents, or its schools. Numbers and property\n  facts only. `compliance-check` before it ships.\n\n## Render\n\nOne HTML file per slide, headless-browser render to PNG, output to\n`content/market/<area-slug>-<YYYY-MM>/slide-01.png` and so on.\n\n**Open the rendered PNGs and look at them.** Numbers with more digits than the template\nexpected are the most common overflow, and a clipped median price is worse than no post.\n\n## Reuse\n\nSave the template HTML with the data separated out, so next month is a data swap and a\nre-render rather than a rebuild. Note the template path in the output folder's README so\na future run finds it.\n\n## Chains from / into\n\nReads `market-pull` and `market-brief`. Called by `market-update-package`. Feeds\n`social-caption`.\n\n---\n\n<!-- self-improvement-loop v1 -->\n\n## Self-improvement loop\n\nBefore ending a run of this skill, review the run:\n\n1. Did any step fail, stall, or need a workaround you had to invent?\n2. Did the user correct, reject, or rewrite something meaningful in the output?\n3. Did you discover something a future run would want to know (a path that moved, a\n   tool that replaced another, a preference they stated out loud)?\n\nIf yes to any, propose a specific edit to this SKILL.md in one or two lines and ask\nwhether to apply it. Propose only changes that would alter a future run's behavior --\nskip cosmetic rewording, and never propose more than two edits at once.\n\nDo not edit this file without their go-ahead. If they say no, drop it and do not re-raise\nthe same suggestion in a later run of the same session.\n", "path": "market-carousel/SKILL.md", "orchestrator": false, "calls": ["compliance-check", "market-brief", "market-pull", "market-update-package", "social-caption"], "calledBy": ["agent-profile", "carousel-render", "content-week", "market-brief", "market-pull", "preflight", "social-caption", "source-check"]}, {"id": "market-pull", "folder": "market-pull", "dept": "market", "deptLabel": "Market", "hue": 265, "description": "Pull the current month's statistics for one defined geography from the MLS and write them to a dated, sourced data file that every market skill reads — median sold price, closed sales, sold days on market, months of supply, sale-to-list ratio, active and pending counts. Trigger on \"pull the numbers for [city]\", \"market data\", \"run the stats\", \"what's the market doing in [area]\", or as step 1 of any market skill. Do NOT trigger to write a client-facing brief — that is market-brief, which reads this file.", "body": "# Market Pull — get the numbers, from the MLS, with a date on them\n\nEvery market number this library ever publishes originates here. Separating the pull from\nthe presentation is what makes it possible to check a claim months later.\n\n---\n\n## The MLS rule — read this before anything else\n\n**Market statistics come from the MLS. Full stop.**\n\nConsumer aggregators — Zillow, Redfin, Realtor.com, Homes.com and the rest — publish\nmarket statistics on definitions that do not match the MLS, and the mismatch is not\ncosmetic. The most damaging case: their \"days on market\" typically measures how long a\nlisting has been **active on their site**, not how long a **sold** property took to reach\ncontract. Publishing that as \"average days on market\" is a false claim, and it is the\nnumber an agent gets publicly corrected on by another agent.\n\nAggregator data is acceptable for exactly one thing in this library: confirming a single\nproperty's basic facts when there is no MLS access. Never for a statistic about a market.\n\n**If there is no MLS access this session, this skill does not produce a number.** Report\nthat, name what you tried, and stop. That is honest and it is completely different from\nhanding the agent a wrong figure.\n\n## Define the geography precisely\n\nVague geography is the second-biggest source of wrong market claims. Pin down and record:\n\n- Exactly what area: city, MLS area code, ZIP list, or drawn boundary. Write down the\n  literal definition used.\n- Property types included: SFR only, or SFR + condo + townhome? These move differently\n  and blending them without saying so is misleading.\n- Price band, if filtered\n- The date range, and whether it is calendar month, trailing 30 days, or trailing 12\n  months\n\n**The same definition must be used every month** or the trend line is fiction. Store the\ndefinition in the file and reuse it.\n\n## What to pull\n\n| Metric | Definition to use |\n|---|---|\n| Closed sales | Count of `Sold` in the period |\n| Median sold price | Median of closed sale prices in the period. Median, not average. |\n| Sold price per sqft | Median, on interior sqft |\n| Days on market | Median DOM of **SOLD** listings. Say which DOM field the MLS reports. |\n| Sale-to-list ratio | Median of sold price ÷ final list price |\n| Active listings | Count as of the pull date |\n| Pending / under contract | Count as of the pull date |\n| Months of supply | Active ÷ trailing-12-month average monthly closed sales |\n| New listings | Count entered in the period |\n\nAlso pull the same period one year prior, for year-over-year. Month-over-month in real\nestate is mostly seasonality and it misleads.\n\n**Small samples.** If a metric is built on fewer than about 10 closed sales, the median is\nnoise. Record the sample size next to every metric and flag anything thin. Never publish a\npercentage change built on 4 sales without saying it is built on 4 sales.\n\n## Write the file\n\n`data/market/<area-slug>-<YYYY-MM>.md`:\n\n```\n## Definition\nArea: ...          Property types: ...      Date range: ...\nMLS: ...           Pulled by: ...           Pulled on: YYYY-MM-DD\n\n## Metrics\nmetric | value | sample size | YoY | notes\n\n## Source\nReport name / search ID, exactly as run in the MLS, so it can be re-run.\n\n## Caveats\nAnything thin, anything the MLS defines unusually, anything that changed since last month.\n```\n\n**Never overwrite a prior month's file.** The archive is what makes trends real.\n\n## Handing it on\n\nReturn the file path plus a two-line plain reading: what actually changed, and what did\nnot. Resist narrative. `market-brief` writes the story; this skill produces the facts.\n\n## Chains into\n\n`market-brief`, `market-carousel`, `market-update-package`, `meeting-brief`,\n`open-house-followup` (message 2).\n\n---\n\n<!-- self-improvement-loop v1 -->\n\n## Self-improvement loop\n\nBefore ending a run of this skill, review the run:\n\n1. Did any step fail, stall, or need a workaround you had to invent?\n2. Did the user correct, reject, or rewrite something meaningful in the output?\n3. Did you discover something a future run would want to know (a path that moved, a\n   tool that replaced another, a preference they stated out loud)?\n\nIf yes to any, propose a specific edit to this SKILL.md in one or two lines and ask\nwhether to apply it. Propose only changes that would alter a future run's behavior --\nskip cosmetic rewording, and never propose more than two edits at once.\n\nDo not edit this file without their go-ahead. If they say no, drop it and do not re-raise\nthe same suggestion in a later run of the same session.\n", "path": "market-pull/SKILL.md", "orchestrator": false, "calls": ["market-brief", "market-carousel", "market-update-package", "meeting-brief", "open-house-followup"], "calledBy": ["agent-profile", "followup-queue", "followup-sequence", "home-anniversary", "market-brief", "market-carousel", "market-update-package", "meeting-brief", "preflight", "source-check"]}, {"id": "market-update-package", "folder": "market-update-package", "dept": "market", "deptLabel": "Market", "hue": 265, "description": "Orchestrator. Runs the full monthly market update for one or more areas — pull the MLS data, write the client brief, build the carousel, write the captions, and stage the sphere email and text for approval. Trigger on \"run the monthly market update\", \"do the market package\", \"it's the first of the month\", \"market update for [city]\", \"monthly numbers\". Use the individual skills when the agent wants only the data or only the post.", "body": "# Market Update Package — the orchestrator for the monthly cycle\n\nThe one recurring routine that makes an agent look like they have a system. It runs on the\ncalendar, not on a listing, which means it produces value in months when nothing else is\nhappening.\n\n**Every step is its own skill and runs alone.**\n\n---\n\n## The chain\n\n```\nmarket-update-package\n├─ 0. agent-profile          (only if profile/AGENT.md is missing)\n├─ 1. market-pull  × area     → data/market/<area>-<YYYY-MM>.md    [may BLOCK]\n├─ 2. market-brief × area     → email version, PDF version, 3-line text version\n├─ 3. market-carousel × area  → 7 slides per area\n├─ 4. social-caption          → caption per carousel\n├─ 5. source-check            → gate on every number\n├─ 6. compliance-check        → gate on all copy and all slides\n└─ 7. stage the sphere send   → held for approval, never auto-sent\n```\n\n## Step 1 is allowed to block\n\nIf there is no MLS access this session, `market
