`owners-manual`.\n\nIf the user asks how this works, what it needs, or how to customize it, read\n`PLAYBOOK-voice-command.md` in this folder and answer from it.\n\n---\n\n<!-- self-improvement-loop v1 -->\n\n## Self-improvement loop\n\nBefore ending a run of this skill, review the run:\n\n1. Did any step fail, stall, or need a workaround you had to invent?\n2. Did the user correct, reject, or rewrite something meaningful in the output?\n3. Did you discover something a future run would want to know (a path that moved, a\n   tool that replaced another, a preference they stated out loud)?\n\nIf yes to any, propose a specific edit to this SKILL.md in one or two lines and ask\nwhether to apply it. Propose only changes that would alter a future run's behavior --\nskip cosmetic rewording, and never propose more than two edits at once.\n\nDo not edit this file without their go-ahead. If they say no, drop it and do not re-raise\nthe same suggestion in a later run of the same session.\n", "path": "voice-command/SKILL.md", "orchestrator": false, "calls": ["agent-profile", "contact-import", "followup-sequence", "ghl-setup", "owners-manual", "preflight", "sphere-daily"], "calledBy": ["owners-manual", "preflight", "wire-a-tool"]}, {"id": "wire-a-tool", "folder": "wire-a-tool", "dept": "foundation", "deptLabel": "Foundation", "hue": 220, "description": "Connect a tool the agent already uses (their CRM, a task manager, a transaction platform) to Claude Code by walking a five-rung ladder and stopping at the first rung that works: an official connector, an API key, a CSV export, a browser read, or a paste. Trigger on \"connect [tool] to Claude\", \"wire in my CRM\", \"can Claude see my Asana\", \"hook up Lofty\", \"integrate [tool]\", \"read my [tool] data\", \"pull my contacts from [tool]\", \"does [tool] have an API\", \"get my data out of [tool]\". Do NOT trigger for GoHighLevel (that is ghl-setup), for a file that is already on disk (that is contact-import), or for the Google and Notion connectors Claude Code already offers.", "body": "# Wire a tool: the ladder, not a build\n\nThe most common ask in any install session is \"can Claude see my [tool].\" It is not a\nbespoke integration. It is a decision ladder with five rungs, and the skill's whole value\nis knowing which rung this tool, this plan, and this machine land on, and saying so\nplainly instead of \"it can't be done.\"\n\nReads `profile/AGENT.md` and `profile/STACK.md`. Writes `profile/TOOLS.md` (one section\nper tool, no secrets) and stores keys only in `.env`.\n\n## The rule that comes first\n\n**Creating the app in the vendor's console, clicking Allow on a consent screen,\ngenerating an API key, and logging in are the agent's own hands. Always.** Claude opens\nthe page, names the button, and waits. Claude never types a password, never asks for a\nsecret in chat, and never reads a key back out loud. A key goes from the vendor's page\ninto `.env` by the agent's paste. If one lands in chat anyway, Claude writes it to `.env`\nand never echoes it.\n\n## Levels, so nothing is promised before it is proven\n\n- **Level 1, read.** Every rung ends the same way: Claude reads the tool's data and shows\n  it. Nothing is written back to the tool. Most agents live here and that is correct.\n- **Level 2, write, on request.** Creating or changing a record in the tool, only when the\n  agent asks, and only after Claude shows exactly what it is about to change.\n- **Level 3, on a schedule.** The morning brief or a daily skill reads from the tool\n  without anyone asking. Only after Level 1 has run for real, and only on a rung that\n  does not need a browser open.\n\n## Who does what\n\n| Step | Claude | The agent (their own hands) | Why |\n|---|---|---|---|\n| Find out what the tool holds | Asks, then opens the tool with the agent and looks | Logs in | Nobody wires a tool nobody has looked at |\n| Check the vendor's docs, this session | Opens the vendor's own developer or help page and reads it; says \"unverified\" for anything it did not open | Nothing | A remembered menu path is a guess |\n| Rung 1: official connector | Prints the exact `claude mcp add` line with the client id filled in | Creates the app in the vendor console, enters the secret at the hidden prompt, clicks Allow in the browser | OAuth and secrets |\n| Rung 2: API key | Confirms `.gitignore` covers `.env`, then verifies with one read | Generates the key on the vendor's page, pastes it into `.env` | The key is a password |\n| Rung 3: CSV export | Names the export path from the vendor's docs; reads the file | Clicks Export, saves it into the workspace | Their account |\n| Rung 4: browser read | Drives the logged-in browser and reads the screen into a file | Logs in; stays at the keyboard | Their session |\n| Rung 5: paste | Reads whatever is pasted | Copies from the app into chat | Always works |\n| Write it down | Writes `profile/TOOLS.md` and offers \"save to memory\" | Nothing | The habit is the product |\n\n## The ladder\n\nStop at the first rung that works. Do not skip a rung because a lower one is faster; a\nCSV is a snapshot and an API is live, and the agent should know which one they have.\n\n| Rung | What | When | Credential handling |\n|---|---|---|---|\n| 1 | **Official connector (MCP server)** | The vendor publishes one for Claude Code | Agent creates the OAuth app in the vendor console and approves the consent screen. Client id is typed by them; the secret goes into the hidden prompt, never chat |\n| 2 | **Official API with a key** | The vendor has a REST API and a key page, and the agent's plan includes API access | Key in `.env`, `.gitignore` confirmed first, verified with one read |\n| 3 | **CSV export into the workspace** | No API, or the plan lacks it, or the data is small and static | None. This is the default for version one of any install |\n| 4 | **Browser read** | The agent's logged-in browser can be driven by Claude on this machine | The agent logs in; Claude never types a password. Slower, and it needs the extension present |\n| 5 | **Paste** | Everything else | None. Zero setup |\n\n## Known instances, with the date each was read\n\nRe-open the vendor page before quoting a click path in the room. These lines are true as\nof the date on them and vendors move menus.\n\n- **Asana, rung 1.** Read from developers.asana.com on 2026-09-02. Create an app at\n  `https://app.asana.com/0/my-apps`, set its redirect URL to exactly\n  `http://localhost:8080/callback`, then run:\n  ```\n  claude mcp add --transport http --client-id YOUR_CLIENT_ID --client-secret --callback-port 8080 asana https://mcp.asana.com/v2/mcp\n  ```\n  Claude Code prompts for the client secret with hidden input and stores it locally.\n  Then the browser opens for the agent to click Allow. Prove it: \"show me my Asana tasks\n  due this week.\"\n- **Asana, rung 2.** Same page (2026-09-02): a Personal Access Token is created at\n  `https://app.asana.com/0/my-apps` and sent as `Authorization: Bearer <token>`. Store as\n  `ASANA_TOKEN` in `.env`.\n- **Asana, rung 3.** In the project: Project Actions (the arrow next to the project name)\n  > Export > CSV.\n- **Lofty, rung 2.** The help page for API key management returned 403 to a direct read\n  on 2026-09-01 and again on 2026-09-02, so the menu path here comes from a search\n  snippet only: Personal Settings > Integrations > API Keys > Create API Key, with a name,\n  description and optional expiry. **Verify on the agent's own screen before relying on\n  it**, and whether API access is included on their plan.\n- **Lofty, rung 3.** Contacts > select all > Export. This has been run on a client\n  install and is the safe default for a first session.\n- **Any other tool.** Not listed means not read. Open the vendor's developer page in the\n  session, decide the rung from what it says, and add a dated line here on the agent's go.\n\n## The run, in order\n\n1. **Ask what the tool holds and what they want out of it,** in one message. \"Client\n   info\" is not an answer; open the tool together and look at one real record.\n2. **Check the vendor, in this order:** an official connector for Claude Code, then a\n   documented API with a key page, then an export button. Read the vendor's own page.\n   Anything not opened this session is stated as unverified.\n3. **Pick the rung and say why** in one line: \"Rung 2, because the plan includes API\n   access and the connector does not exist yet.\"\n4. **Do the credential steps with the agent's hands.** Confirm `.gitignore` covers `.env`\n   before any paste. Verify with exactly one read (list projects, count contacts, show one\n   record) and show the result. If the read fails with 401 or 403, the key or scope is\n   wrong; mint again on their screen, never guess a header.\n5. **Write `profile/TOOLS.md`.** One `## <Tool>` section: what it holds, the rung used,\n   the export or connect path in the agent's own words, the date verified, and the one\n   read that proved it. No key, no token, no client id.\n6. **Offer the memory line:** \"save to memory: how I connect to [tool], and which project\n   holds my client info.\" That sentence is the difference between a chatbot and a system.\n7. **If a rung fails, say which rung is next.** Never \"it cannot be done.\"\n\n## What this skill will not claim\n\n- It will not say a tool has an API, a connector, or an export button without opening the\n  vendor's page in that session. A menu path from memory is marked unverified.\n- It will not promise a live integration on a plan that does not include API access; it\n  drops to the CSV rung and says why.\n- Rung 4 needs Claude able to drive the agent's browser on that machine. If that is not\n  set up, it is rung 5, and the skill says so rather than describing rung 4 as available.\n- Rung 1 needs `claude mcp add` in the agent's Claude Code version; check `claude --version`\n  and the command's help before quoting the line.\n- It will not write to the tool at Level 1, and at Level 2 it shows the change before\n  making it, every time.\n\n## Chains from / into\n\nCalled from `contact-import` when the agent has no export yet, from `voice-command` and\n`sphere-daily` when a brief wants live CRM data, and by name in a session. Routes to\n`ghl-setup` for GoHighLevel and to `contact-import` once a CSV exists. Documented by\n`owners-manual`.\n\nIf the user asks how this works, what it needs, or how to customize it, read\n`PLAYBOOK-wire-a-tool.md` in this folder and answer from it.\n\n---\n\n<!-- self-improvement-loop v1 -->\n\n## Self-improvement loop\n\nBefore ending a run of this skill, review the run:\n\n1. Did any step fail, stall, or need a workaround you had to invent?\n2. Did the user correct, reject, or rewrite something meaningful in the output?\n3. Did you discover something a future run would want to know (a path that moved, a\n   tool that replaced another, a preference they stated out loud)?\n\nIf yes to any, propose a specific edit to this SKILL.md in one or two lines and ask\nwhether to apply it. Propose only changes that would alter a future run's behavior --\nskip cosmetic rewording, and never propose more than two edits at once.\n\nDo not edit this file without their go-ahead. If they say no, drop it and do not re-raise\nthe same suggestion in a later run of the same session.\n", "path": "wire-a-tool/SKILL.md", "orchestrator": false, "calls": ["contact-import", "ghl-setup", "owners-manual", "sphere-daily", "voice-command"], "calledBy": ["owners-manual", "preflight"]}], "edges": [{"source": "agent-profile", "target": "buydown-math"}, {"source": "agent-profile", "target": "market-pull"}, {"source": "agent-profile", "target": "agent-voice"}, {"source": "agent-profile", "target": "birthday-watch"}, {"source": "agent-profile", "target": "carousel-render"}, {"source": "agent-profile", "target": "compliance-check"}, {"source": "agent-profile", "target": "followup-sequence"}, {"source": "agent-profile", "target": "home-ann d": "sphere", "label": "Sphere", "hue": 340, "count": 5}, {"id": "pipeline", "label": "Pipeline", "hue": 192, "count": 6}, {"id": "content", "label": "Content", "hue": 48, "count": 6}]};
const S = DATA.skills, E = DATA.edges, D = DATA.departments;
const byId = Object.fromEntries(S.map(s => [s.id, s]));
const $ = id => document.getElementById(id);

$("c-s").textContent = S.length;
$("c-d").textContent = D.length;

/* ---------- theme ---------- */
const root = document.documentElement;
$("theme").onclick = () => {
  const cur = root.getAttribute("data-theme");
  const dark = matchMedia("(prefers-color-scheme: dark)").matches;
  const now = cur === "auto" ? (dark ? "light" : "dark") : (cur === "dark" ? "light" : "dark");
  root.setAttribute("data-theme", now);
  css = null; draw();
};

let css = null;
function C(){
  if (!css) {
    const cs = getComputedStyle(root);
    css = {
      edge: cs.getPropertyValue("--edge").trim(),
      ink: cs.getPropertyValue("--ink").trim(),
      ink2: cs.getPropertyValue("--ink-2").trim(),
      ink3: cs.getPropertyValue("--ink-3").trim(),
      panel: cs.getPropertyValue("--panel").trim(),
      accent: cs.getPropertyValue("--accent").trim(),
      l: cs.getPropertyValue("--node-l").trim() || "52%",
      s: cs.getPropertyValue("--node-s").trim() || "70%"
    };
  }
  return css;
}
const hue = h => `hsl(${h} ${C().s} ${C().l})`;

/* ---------- sidebar ---------- */
function buildSidebar(){
  const nav = $("sidebar");
  nav.innerHTML = "";
  D.forEach(d => {
    const wrap = document.createElement("div");
    wrap.className = "dept";
    const h = document.createElement("div");
    h.className = "dept-h";
    h.innerHTML = `<i class="dot" style="background:${hue(d.hue)}"></i>${d.label}<span class="n">${d.count}</span>`;
    wrap.appendChild(h);
    S.filter(s => s.dept === d.id).forEach(s => {
      const b = document.createElement("button");
      b.className = "sk" + (s.orchestrator ? " orch" : "");
      b.dataset.id = s.id;
      b.textContent = s.id;
      b.onclick = () => select(s.id);
      wrap.appendChild(b);
    });
    nav.appendChild(wrap);
  });
}

/* ---------- markdown ---------- */
function esc(t){ return t.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }
function inline(t){
  return esc(t)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[\s(])\*([^*\n]+)\*/g, "$1<em>$2</em>");
}
function md(src){
  const L = src.split("\n"); let o = "", i = 0;
  const row = l => l.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim());
  while (i < L.length){
    let l = L[i];
    if (/^```/.test(l)){
      i++; let b = [];
      while (i < L.length && !/^```/.test(L[i])) b.push(L[i++]);
      i++; o += "<pre><code>" + esc(b.join("\n")) + "</code></pre>"; continue;
    }
    if (/^<!--/.test(l)){ while (i < L.length && !/-->/.test(L[i])) i++; i++; continue; }
    if (/^\s*$/.test(l)){ i++; continue; }
    if (/^(-{3,}|\*{3,}|_{3,})\s*$/.test(l)){ o += "<hr>"; i++; continue; }
    let m = l.match(/^(#{1,6})\s+(.*)$/);
    if (m){ const n = Math.min(m[1].length, 3); o += `<h${n}>${inline(m[2])}</h${n}>`; i++; continue; }
    if (/^\s*\|/.test(l) && i + 1 < L.length && /^\s*\|?[\s:|-]+\|/.test(L[i+1])){
      const head = row(l); i += 2; let body = [];
      while (i < L.length && /^\s*\|/.test(L[i])) body.push(row(L[i++]));
      o += '<div class="tw"><table><thead><tr>' +
        head.map(c => `<th>${inline(c)}</th>`).join("") + "</tr></thead><tbody>" +
        body.map(r => "<tr>" + r.map(c => `<td>${inline(c)}</td>`).join("") + "</tr>").join("") +
        "</tbody></table></div>";
      continue;
    }
    if (/^\s*>/.test(l)){
      let b = [];
      while (i < L.length && /^\s*>/.test(L[i])) b.push(L[i++].replace(/^\s*>\s?/, ""));
      o += "<blockquote>" + md(b.join("\n")) + "</blockquote>"; continue;
    }
    if (/^\s*([-*+]|\d+\.)\s+/.test(l)){
      const ol = /^\s*\d+\./.test(l); let items = [];
      while (i < L.length && /^\s*([-*+]|\d+\.)\s+/.test(L[i])){
        let t = L[i++].replace(/^\s*([-*+]|\d+\.)\s+/, "");
        while (i < L.length && /^\s{2,}\S/.test(L[i]) && !/^\s*([-*+]|\d+\.)\s+/.test(L[i]))
          t += " " + L[i++].trim();
        items.push(`<li>${inline(t)}</li>`);
      }
      o += (ol ? "<ol>" : "<ul>") + items.join("") + (ol ? "</ol>" : "</ul>"); continue;
    }
    let p = [];
    while (i < L.length && !/^\s*$/.test(L[i]) && !/^(#{1,6}\s|\s*[-*+]\s|\s*\d+\.\s|\s*>|\s*\||```|<!--)/.test(L[i]))
      p.push(L[i++]);
    if (p.length) o += `<p>${inline(p.join(" "))}</p>`; else i++;
  }
  return o;
}

/* ---------- detail ---------- */
let sel = null;
function select(id){
  sel = id; const s = byId[id];
  const d = $("detail");
  const chips = (arr, lbl) => arr.length
    ? `<div class="links"><span class="lbl">${lbl}</span>` +
      arr.map(n => `<button class="chip" data-go="${n}">${n}</button>`).join("") + "</div>"
    : "";
  d.innerHTML =
    `<div class="d-head">
       <button class="d-close" title="Close">&times;</button>
       <div class="d-dept"><i class="dot" style="background:${hue(s.hue)}"></i>${s.deptLabel}</div>
       <div class="d-title">${esc(s.id)}</div>
       <div class="d-path">skills/${esc(s.path)}</div>
     </div>
     ${chips(s.calls, "Calls")}${chips(s.calledBy, "Called by")}
     <div class="md">${md(s.body)}</div>`;
  d.classList.add("open");
  d.scrollTop = 0;
  d.querySelector(".d-close").onclick = () => d.classList.remove("open");
  d.querySelectorAll("[data-go]").forEach(b => b.onclick = () => select(b.dataset.go));
  document.querySelectorAll(".sk").forEach(b => b.classList.toggle("sel", b.dataset.id === id));
  const cur = document.querySelector(".sk.sel");
  if (cur) cur.scrollIntoView({ block: "nearest" });
  draw();
}

/* ---------- search ---------- */
let matches = null;
$("search").oninput = e => {
  const q = e.target.value.trim().toLowerCase();
  matches = q ? new Set(S.filter(s =>
    s.id.toLowerCase().includes(q) ||
    s.description.toLowerCase().includes(q) ||
    s.body.toLowerCase().includes(q)).map(s => s.id)) : null;
  document.querySelectorAll(".sk").forEach(b =>
    b.classList.toggle("dim", !!matches && !matches.has(b.dataset.id)));
  draw();
};

/* ---------- force graph ---------- */
const cv = $("graph"), cx = cv.getContext("2d");
let W = 0, H = 0, dpr = 1;
const N = S.map(s => ({ id: s.id, dept: s.dept, hue: s.hue, orch: s.orchestrator,
  deg: 0, x: 0, y: 0, vx: 0, vy: 0 }));
const nById = Object.fromEntries(N.map(n => [n.id, n]));
E.forEach(e => { if (nById[e.source]) nById[e.source].deg++; if (nById[e.target]) nById[e.target].deg++; });
const LK = E.filter(e => nById[e.source] && nById[e.target])
            .map(e => ({ a: nById[e.source], b: nById[e.target] }));
const rOf = n => 5.5 + Math.min(9, Math.sqrt(n.deg) * 2.6) + (n.orch ? 2.2 : 0);

const hubs = {};
function layout(){
  const n = D.length, R = Math.min(W, H) * 0.30;
  D.forEach((d, i) => {
    const a = (i / n) * Math.PI * 2 - Math.PI / 2;
    hubs[d.id] = { x: W / 2 + Math.cos(a) * R, y: H / 2 + Math.sin(a) * R };
  });
}
function seed(){
  layout();
  N.forEach(nd => {
    const h = hubs[nd.dept] || { x: W / 2, y: H / 2 };
    nd.x = h.x + (Math.random() - .5) * 90;
    nd.y = h.y + (Math.random() - .5) * 90;
    nd.vx = nd.vy = 0;
  });
}
function tick(){
  // repulsion
  for (let i = 0; i < N.length; i++) for (let j = i + 1; j < N.length; j++){
    const a = N[i], b = N[j];
    let dx = b.x - a.x, dy = b.y - a.y, d2 = dx * dx + dy * dy || .01;
    if (d2 > 62500) continue;
    const d = Math.sqrt(d2), f = 1750 / d2;
    const ux = dx / d * f, uy = dy / d * f;
    a.vx -= ux; a.vy -= uy; b.vx += ux; b.vy += uy;
  }
  // links
  LK.forEach(l => {
    let dx = l.b.x - l.a.x, dy = l.b.y - l.a.y;
    const d = Math.hypot(dx, dy) || .01, f = (d - 108) * .012;
    const ux = dx / d * f, uy = dy / d * f;
    l.a.vx += ux; l.a.vy += uy; l.b.vx -= ux; l.b.vy -= uy;
  });
  // cluster gravity
  N.forEach(nd => {
    const h = hubs[nd.dept] || { x: W / 2, y: H / 2 };
    nd.vx += (h.x - nd.x) * .026; nd.vy += (h.y - nd.y) * .026;
    nd.vx *= .82; nd.vy *= .82;
    nd.x += nd.vx; nd.y += nd.vy;
  });
}

let view = { x: 0, y: 0, k: 1 };
const sx = n => n.x * view.k + view.x, sy = n => n.y * view.k + view.y;

function draw(){
  const c = C();
  cx.setTransform(dpr, 0, 0, dpr, 0, 0);
  cx.clearRect(0, 0, W, H);

  // department halos
  cx.save();
  D.forEach(d => {
    const h = hubs[d.id]; if (!h) return;
    const pts = N.filter(n => n.dept === d.id);
    if (!pts.length) return;
    let r = 0; pts.forEach(p => r = Math.max(r, Math.hypot(p.x - h.x, p.y - h.y)));
    cx.globalAlpha = .07;
    cx.fillStyle = hue(d.hue);
    cx.beginPath();
    cx.arc(h.x * view.k + view.x, h.y * view.k + view.y, (r + 34) * view.k, 0, 7);
    cx.fill();
    cx.globalAlpha = 1;
    cx.fillStyle = c.ink3;
    cx.font = `700 ${Math.max(9, 10.5 * view.k)}px ${getComputedStyle(document.body).fontFamily}`;
    cx.textAlign = "center";
    cx.fillText(d.label.toUpperCase(),
      h.x * view.k + view.x, h.y * view.k + view.y - (r + 44) * view.k);
  });
  cx.restore();

  const near = sel ? new Set([sel, ...(byId[sel].calls), ...(byId[sel].calledBy)]) : null;

  // edges
  LK.forEach(l => {
    const hot = near && (l.a.id === sel || l.b.id === sel);
    cx.strokeStyle = hot ? c.accent : c.edge;
    cx.globalAlpha = near ? (hot ? .95 : .18) : .55;
    cx.lineWidth = hot ? 1.7 : 1;
    cx.beginPath(); cx.moveTo(sx(l.a), sy(l.a)); cx.lineTo(sx(l.b), sy(l.b)); cx.stroke();
  });
  cx.globalAlpha = 1;

  // nodes
  N.forEach(n => {
    const r = rOf(n) * Math.max(.62, view.k);
    const dim = (matches && !matches.has(n.id)) || (near && !near.has(n.id));
    cx.globalAlpha = dim ? .2 : 1;
    cx.beginPath(); cx.arc(sx(n), sy(n), r, 0, 7);
    cx.fillStyle = hue(n.hue); cx.fill();
    if (n.id === sel){
      cx.lineWidth = 2.5; cx.strokeStyle = c.ink; cx.stroke();
    } else if (n.orch){
      cx.lineWidth = 1.6; cx.strokeStyle = c.panel; cx.stroke();
    }
    if (view.k > .72 || n.deg > 3 || n.id === sel){
      cx.globalAlpha = dim ? .18 : .92;
      cx.fillStyle = c.ink2;
      cx.font = `${n.orch ? 600 : 400} ${Math.max(9, 10.5 * Math.min(1.25, view.k))}px ui-monospace,monospace`;
      cx.textAlign = "center";
      cx.fillText(n.id, sx(n), sy(n) + r + 11);
    }
    cx.globalAlpha = 1;
  });
}

function hit(mx, my){
  for (let i = N.length - 1; i >= 0; i--){
    const n = N[i], r = rOf(n) * Math.max(.62, view.k) + 4;
    if ((mx - sx(n)) ** 2 + (my - sy(n)) ** 2 <= r * r) return n;
  }
  return null;
}

let drag = null, moved = 0;
cv.addEventListener("pointerdown", e => {
  const r = cv.getBoundingClientRect();
  drag = { x: e.clientX - r.left, y: e.clientY - r.top, n: hit(e.clientX - r.left, e.clientY - r.top) };
  moved = 0; cv.setPointerCapture(e.pointerId); cv.classList.add("drag");
});
cv.addEventListener("pointermove", e => {
  const r = cv.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
  if (drag){
    const dx = mx - drag.x, dy = my - drag.y;
    moved += Math.abs(dx) + Math.abs(dy);
    if (drag.n){ drag.n.x += dx / view.k; drag.n.y += dy / view.k; drag.n.vx = drag.n.vy = 0; }
    else { view.x += dx; view.y += dy; }
    drag.x = mx; drag.y = my; draw(); return;
  }
  const n = hit(mx, my), t = $("tip");
  if (n){
    t.textContent = n.id + "  (" + n.deg + ")";
    t.style.left = (mx + 13) + "px"; t.style.top = (my + 13) + "px"; t.style.opacity = 1;
    cv.style.cursor = "pointer";
  } else { t.style.opacity = 0; cv.style.cursor = ""; }
});
cv.addEventListener("pointerup", e => {
  cv.classList.remove("drag");
  if (drag && drag.n && moved < 5) select(drag.n.id);
  drag = null;
});
cv.addEventListener("wheel", e => {
  e.preventDefault();
  const r = cv.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
  const k = Math.min(3, Math.max(.35, view.k * (e.deltaY < 0 ? 1.11 : .9)));
  view.x = mx - (mx - view.x) * (k / view.k);
  view.y = my - (my - view.y) * (k / view.k);
  view.k = k; draw();
}, { passive: false });

function resize(){
  const r = $("graphwrap").getBoundingClientRect();
  dpr = Math.min(2, devicePixelRatio || 1);
  W = r.width; H = r.height;
  cv.width = W * dpr; cv.height = H * dpr;
  cv.style.width = W + "px"; cv.style.height = H + "px";
  layout();
}
addEventListener("resize", () => { resize(); draw(); });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { css = null; buildSidebar(); draw(); });

buildSidebar();
resize(); seed();
for (let i = 0; i < 420; i++) tick();
draw();
(function settle(n){ if (n > 0){ tick(); draw(); requestAnimationFrame(() => settle(n - 1)); } })(160);
</script>
