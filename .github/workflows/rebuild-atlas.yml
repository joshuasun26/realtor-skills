name: Rebuild Atlas

# Keeps atlas/index.html in sync with plugins/realtor-skills/skills/*/SKILL.md on GitHub,
# as a backstop for the local pre-commit hook (.githooks/pre-commit) in case someone
# commits without it enabled. Inert until this repo is actually hosted on GitHub — ready
# to work the moment it lands there.

on:
  push:
    paths:
      - "plugins/realtor-skills/skills/**/SKILL.md"
      - "atlas/build.py"

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Rebuild atlas/index.html
        run: python atlas/build.py

      - name: Commit if changed
        run: |
          if ! git diff --quiet -- atlas/index.html; then
            git config user.name "atlas-bot"
            git config user.email "atlas-bot@users.noreply.github.com"
            git add atlas/index.html
            git commit -m "Auto-rebuild atlas/index.html"
            git push
          fi
